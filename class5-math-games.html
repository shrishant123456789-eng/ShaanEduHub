<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5 Mathematics - Complete Interactive Learning</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive;
            background: #ffffff;
            color: #333;
            padding: 20px;
            padding-top: 80px;
            max-width: 100%;
            overflow-x: hidden;
        }

        .score-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 15px;
            font-size: 11px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            min-width: 140px;
        }

        .score-panel div {
            margin: 3px 0;
            font-weight: bold;
        }

        .main-title {
            text-align: center;
            color: #2563eb;
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-container {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .game-title {
            font-size: 24px;
            color: #d63031;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .task-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .task-question {
            font-size: 18px;
            color: #2d3436;
            margin-bottom: 15px;
            font-weight: bold;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .option-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .option-btn.correct {
            background: linear-gradient(135deg, #55efc4 0%, #00b894 100%);
        }

        .option-btn.wrong {
            background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
        }

        .input-field {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 3px solid #0984e3;
            border-radius: 10px;
            margin-bottom: 10px;
            font-family: inherit;
        }

        .submit-btn {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .feedback.correct {
            background: #55efc4;
            color: #00b894;
        }

        .feedback.wrong {
            background: #ff7675;
            color: #d63031;
        }

        .next-btn {
            background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            margin-top: 15px;
            display: none;
        }

        .next-btn:hover {
            transform: scale(1.05);
        }

        .drag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
            min-height: 60px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
            border: 3px dashed #0984e3;
        }

        .draggable {
            padding: 10px 15px;
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border-radius: 8px;
            cursor: move;
            font-weight: bold;
            user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .drop-zone {
            min-width: 80px;
            min-height: 50px;
            padding: 10px;
            background: #fff;
            border: 3px dashed #00b894;
            border-radius: 10px;
            margin: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .match-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }

        .match-item {
            padding: 15px;
            background: linear-gradient(135deg, #fab1a0 0%, #ff7675 100%);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            color: white;
        }

        .match-item.selected {
            background: linear-gradient(135deg, #55efc4 0%, #00b894 100%);
            transform: scale(1.05);
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #dfe6e9;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00b894 0%, #55efc4 100%);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .nav-btn {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }

        .game-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .game-btn {
            background: linear-gradient(135deg, #a29bfe 0%, #6c5ce7 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .game-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .game-btn.active {
            background: linear-gradient(135deg, #fd79a8 0%, #e84393 100%);
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            background: linear-gradient(135deg, #2d3436 0%, #636e72 100%);
            color: white;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .hint-btn {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            color: #2d3436;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            font-family: inherit;
        }

        .hint-box {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border-left: 4px solid #ffc107;
            display: none;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 3px solid #0984e3;
            border-radius: 10px;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        .true-false-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
        }

        .tf-btn {
            flex: 1;
            max-width: 150px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }

        .tf-true {
            background: linear-gradient(135deg, #55efc4 0%, #00b894 100%);
            color: white;
        }

        .tf-false {
            background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
            color: white;
        }

        .image-task {
            text-align: center;
            margin: 15px 0;
        }

        .task-image {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 15px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @media (max-width: 360px) {
            .main-title {
                font-size: 22px;
            }
            .game-title {
                font-size: 20px;
            }
            .task-question {
                font-size: 16px;
            }
            .score-panel {
                font-size: 10px;
                min-width: 120px;
                padding: 8px;
            }
        }
    </style>
</head>

                        question: "Bus fare is Rs. 12 one way. Return trip cost?",
                        answer: "24"
                    },
                    {
                        type: "mcq",
                        question: "Shop had 200 items, sold 85. How many remain?",
                        options: ["115", "285", "200", "85"],
                        correct: 0
                    },
                    {
                        type: "input",
                        question: "Tank holds 500 liters. 125 liters used. How much left?",
                        answer: "375"
                    },
                    {
                        type: "mcq",
                        question: "Pizza cut into 8 equal slices. You eat 3. Fraction eaten?",
                        options: ["3/8", "8/3", "5/8", "1/2"],
                        correct: 0
                    },
                    {
                        type: "input",
                        question: "School has 15 classrooms. Each has 30 desks. Total desks?",
                        answer: "450"
                    },
                    {
                        type: "mcq",
                        question: "Bike travels 45 km in 1 hour. Distance in 3 hours?",
                        options: ["135 km", "45 km", "90 km", "180 km"],
                        correct: 0
                    }
                ]
            }
        ];

        let currentGame = 0;
        let currentTask = 0;
        let score = {
            correct: 0,
            wrong: 0,
            skipped: 0,
            total: 0,
            marks: 0
        };

        function updateScore() {
            document.getElementById('correctCount').textContent = score.correct;
            document.getElementById('wrongCount').textContent = score.wrong;
            document.getElementById('skippedCount').textContent = score.skipped;
            document.getElementById('totalAttempted').textContent = score.total;
            const percentage = score.total > 0 ? Math.round((score.correct / score.total) * 100) : 0;
            document.getElementById('percentage').textContent = percentage;
            document.getElementById('marksObtained').textContent = score.marks;
        }

        function renderGameSelector() {
            const selector = document.getElementById('gameSelector');
            selector.innerHTML = gameData.map((game, index) => 
                `<button class="game-btn ${index === currentGame ? 'active' : ''}" onclick="switchGame(${index})">${game.name}</button>`
            ).join('');
        }

        function switchGame(index) {
            currentGame = index;
            currentTask = 0;
            renderGameSelector();
            renderGame();
        }

        function renderGame() {
            const container = document.getElementById('gamesContainer');
            const game = gameData[currentGame];
            const task = game.tasks[currentTask];
            
            let taskHTML = `
                <div class="game-container" style="background: linear-gradient(135deg, ${game.color}40 0%, ${game.color}80 100%);">
                    <div class="game-title">${game.name} 🎮</div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${((currentTask + 1) / game.tasks.length) * 100}%">
                            ${currentTask + 1} / ${game.tasks.length}
                        </div>
                    </div>
                    <div class="task-container">
                        <div class="task-question">${task.question}</div>
            `;

            if (task.type === 'mcq') {
                taskHTML += '<div class="options">';
                task.options.forEach((option, i) => {
                    taskHTML += `<button class="option-btn" onclick="checkMCQ(${i})">${option}</button>`;
                });
                taskHTML += '</div>';
            } else if (task.type === 'input') {
                taskHTML += `
                    <input type="text" class="input-field" id="answerInput" placeholder="Type your answer here...">
                    <button class="submit-btn" onclick="checkInput()">Submit Answer</button>
                `;
            } else if (task.type === 'trueFalse') {
                taskHTML += `
                    <div class="true-false-container">
                        <button class="tf-btn tf-true" onclick="checkTrueFalse(true)">✓ True</button>
                        <button class="tf-btn tf-false" onclick="checkTrueFalse(false)">✗ False</button>
                    </div>
                `;
            }

            if (task.hint) {
                taskHTML += `
                    <button class="hint-btn" onclick="toggleHint()">💡 Hint</button>
                    <div class="hint-box" id="hintBox">${task.hint}</div>
                `;
            }

            taskHTML += `
                    <div class="feedback" id="feedback"></div>
                    <button class="next-btn" id="nextBtn" onclick="nextTask()">Next ➔</button>
                </div>
            </div>
            `;

            container.innerHTML = taskHTML;
        }

        function toggleHint() {
            const hintBox = document.getElementById('hintBox');
            hintBox.style.display = hintBox.style.display === 'block' ? 'none' : 'block';
        }

        function showFeedback(isCorrect) {
            const feedback = document.getElementById('feedback');
            const nextBtn = document.getElementById('nextBtn');
            
            if (isCorrect) {
                feedback.textContent = 'Excellent! ⭐';
                feedback.className = 'feedback correct';
                score.correct++;
                score.marks++;
            } else {
                feedback.textContent = 'Try Again! Keep Learning 💪';
                feedback.className = 'feedback wrong';
                score.wrong++;
            }
            
            score.total++;
            feedback.style.display = 'block';
            nextBtn.style.display = 'block';
            updateScore();
        }

        function checkMCQ(selected) {
            const task = gameData[currentGame].tasks[currentTask];
            const buttons = document.querySelectorAll('.option-btn');
            
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === task.correct) {
                    btn.classList.add('correct');
                } else if (i === selected) {
                    btn.classList.add('wrong');
                }
            });
            
            showFeedback(selected === task.correct);
        }

        function checkInput() {
            const task = gameData[currentGame].tasks[currentTask];
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            const correctAnswer = task.answer.toString().toLowerCase();
            
            let isCorrect = false;
            
            if (task.flexible) {
                isCorrect = userAnswer.replace(/\s+/g, '') === correctAnswer.replace(/\s+/g, '');
            } else {
                isCorrect = userAnswer === correctAnswer;
            }
            
            document.getElementById('answerInput').disabled = true;
            document.querySelector('.submit-btn').disabled = true;
            
            showFeedback(isCorrect);
        }

        function checkTrueFalse(selected) {
            const task = gameData[currentGame].tasks[currentTask];
            const buttons = document.querySelectorAll('.tf-btn');
            
            buttons.forEach(btn => btn.disabled = true);
            
            showFeedback(selected === task.answer);
        }

        function nextTask() {
            currentTask++;
            
            if (currentTask >= gameData[currentGame].tasks.length) {
                if (currentGame < gameData.length - 1) {
                    if (confirm(`Great job! You've completed ${gameData[currentGame].name}! 🎉\n\nMove to next game: ${gameData[currentGame + 1].name}?`)) {
                        currentGame++;
                        currentTask = 0;
                        renderGameSelector();
                    }
                } else {
                    alert(`Congratulations! 🎊\n\nYou've completed all games!\n\nFinal Score:\n✅ Correct: ${score.correct}\n❌ Wrong: ${score.wrong}\n📊 Total: ${score.total}\n🎯 Marks: ${score.marks}\n📈 Percentage: ${Math.round((score.correct / score.total) * 100)}%`);
                }
            }
            
            renderGame();
        }

        document.addEventListener('DOMContentLoaded', function() {
            renderGameSelector();
            renderGame();
            updateScore();
        });
    </script>
</body>
</html>
