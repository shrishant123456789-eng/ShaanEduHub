<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 Computer Science Practice System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');

        :root {
            --bg-color: #f0f8ff;
            --paper-color: #ffffff;
            --line-color: #a2d9ff;
            --text-color: #2c3e50;
            --accent-green: #98fb98;
            --accent-red: #ffb6c1;
            --accent-blue: #add8e6;
            --accent-yellow: #fffacd;
            --btn-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            font-family: 'Comic Neue', cursive, sans-serif !important;
            font-weight: 700 !important;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
            background-size: 100% 2rem;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* LIVE SCORE PANEL */
        #score-panel {
            position: sticky;
            top: 0;
            background: var(--accent-yellow);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid var(--text-color);
            z-index: 1000;
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .score-label { font-size: 0.8rem; opacity: 0.8; }
        .score-val { font-size: 1.2rem; }

        /* MAIN CONTAINER */
        #app-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: var(--paper-color);
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 95%;
            flex: 1;
            border: 2px solid var(--text-color);
        }

        /* MENU SCREEN */
        #menu-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .set-btn {
            background: var(--accent-blue);
            border: 2px solid var(--text-color);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 1.2rem;
            box-shadow: var(--btn-shadow);
            transition: transform 0.1s;
        }

        .set-btn:active { transform: scale(0.98); }
        .set-btn span { float: right; font-size: 0.9rem; opacity: 0.7; }

        /* QUIZ SCREEN */
        #quiz-screen { display: none; }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--line-color);
            padding-bottom: 10px;
        }

        .back-btn {
            background: #ddd;
            border: 2px solid var(--text-color);
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .question-box {
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .image-box {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            border: 2px dashed var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: #666;
            border-radius: 10px;
        }

        /* OPTIONS */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--text-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 1.1rem;
            transition: background 0.2s;
        }

        .option-btn:hover { background: #f8f9fa; }
        
        .option-btn.correct { background: var(--accent-green) !important; }
        .option-btn.wrong { background: var(--accent-red) !important; }

        /* FEEDBACK */
        #feedback-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid var(--text-color);
            display: none;
            background: #fff;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            background: var(--accent-blue);
            border: 2px solid var(--text-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            min-width: 100px;
        }
        
        .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        footer {
            text-align: center;
            padding: 20px;
            background: var(--text-color);
            color: white;
            font-size: 0.9rem;
            margin-top: auto;
        }

        @media (min-width: 600px) {
            .options-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="score-panel">
    <div class="score-item">
        <span class="score-val" id="score-correct">0</span>
        <span class="score-label">Correct</span>
    </div>
    <div class="score-item">
        <span class="score-val" id="score-wrong">0</span>
        <span class="score-label">Wrong</span>
    </div>
    <div class="score-item">
        <span class="score-val" id="score-perc">0%</span>
        <span class="score-label">Score</span>
    </div>
</div>

<div id="app-container">
    <!-- MENU -->
    <div id="menu-screen">
        <h1 style="text-align: center; color: var(--text-color);">Computer Science - Class 4</h1>
        <p style="text-align: center;">Select a Practice Set</p>
        <div id="set-list"></div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-screen">
        <div class="header-bar">
            <button class="back-btn" onclick="showMenu()">← Menu</button>
            <span id="set-title">Set 1</span>
            <span id="q-counter">1/50</span>
        </div>

        <div id="question-display"></div>

        <div id="feedback-area">
            <h3 id="fb-title"></h3>
            <p id="fb-text"></p>
        </div>

        <div class="nav-controls">
            <button class="nav-btn" id="prev-btn" onclick="prevQ()">Previous</button>
            <button class="nav-btn" id="next-btn" onclick="nextQ()">Next</button>
        </div>
    </div>
</div>

<footer>
    Designed & Created by SHRISHANT YADAV<br>ShanEduHub
</footer>

<script>
/* DATA GENERATION LOGIC 
   To ensure 500 unique questions, we construct them algorithmically based on Class 4 curriculum topics.
*/

const globalState = {
    sets: [],
    currentSetId: 0,
    currentQIndex: 0,
    scores: { correct: 0, wrong: 0, attempted: 0 }
};

// --- DATABASE CONSTRUCTION ---

const commonWrong = ["Monitor", "Mouse", "CPU", "Keyboard", "Printer", "Scanner"];
function getWrong(correctArr, count=3) {
    const res = [];
    const pool = commonWrong.filter(x => !correctArr.includes(x));
    while(res.length < count && pool.length > 0) {
        const r = Math.floor(Math.random() * pool.length);
        res.push(pool.splice(r, 1)[0]);
    }
    return res;
}

const setsData = [];

// Helper to create a question object
function q(text, type, options, answer, explanation, isImage=false) {
    return { text, type, options, answer, explanation, isImage, userAnswer: null };
}

/* SET 1: Introduction to Computers (1-50) 
   Topics: Machine definitions, IPO Cycle, Characteristics (Speed, Accuracy)
*/
let s1 = [];
s1.push(q("What is a computer?", "mcq", ["A living being", "An electronic machine", "A type of book", "A toy"], "An electronic machine", "Computers are electronic machines that process data."));
s1.push(q("Which of these does a computer need to work?", "mcq", ["Food", "Electricity", "Water", "Sunlight"], "Electricity", "Computers run on electricity."));
s1.push(q("Computers work very ______.", "fib", ["Slowly", "Lazily", "Fast", "Carelessly"], "Fast", "Speed is a main characteristic of computers."));
s1.push(q("A computer never gets ______.", "fib", ["Tired", "Fast", "Smart", "Electric"], "Tired", "Computers can work for hours without rest."));
s1.push(q("Computers can store a large amount of ______.", "fib", ["Food", "Water", "Data", "Air"], "Data", "Computers store data in memory."));
s1.push(q("The data we put into the computer is called ______.", "mcq", ["Output", "Input", "Process", "Storage"], "Input", "Input is what we give to the computer."));
s1.push(q("The result we get from the computer is called ______.", "mcq", ["Input", "Output", "Process", "Hard disk"], "Output", "Output is the final result."));
s1.push(q("IPO stands for ______.", "mcq", ["Input Process Output", "In Put Out", "Internet Post Office", "Input Print Out"], "Input Process Output", "IPO is the cycle computers work on."));
s1.push(q("Which part of IPO is 'Thinking' or 'Calculating'?", "mcq", ["Input", "Process", "Output", "Storage"], "Process", "Processing happens inside the CPU."));
s1.push(q("True or False: A computer can take decisions on its own.", "tf", ["True", "False"], "False", "Computers only follow human instructions."));

// Add variations for Set 1
const set1Scenarios = [
    {act: "Typing a letter", stage: "Input"},
    {act: "Printing a photo", stage: "Output"},
    {act: "Playing a song", stage: "Output"},
    {act: "Clicking a mouse", stage: "Input"},
    {act: "CPU adding 2+2", stage: "Process"},
    {act: "Saving a file", stage: "Storage"},
    {act: "Scanning a picture", stage: "Input"},
    {act: "Reading from a Pendrive", stage: "Input"},
    {act: "Monitor showing a movie", stage: "Output"},
    {act: "Recording voice", stage: "Input"}
];
set1Scenarios.forEach(s => {
    s1.push(q(`In the IPO cycle, '${s.act}' is an example of ______?`, "mcq", ["Input", "Process", "Output", "Storage"], s.stage, `${s.act} represents ${s.stage}.`));
});

// Human vs Computer comparisons
const hvc = [
    {h: "Can imagine", c: "Cannot imagine"},
    {h: "Makes mistakes", c: "Accurate"},
    {h: "Needs rest", c: "Diligent"},
    {h: "Has feelings", c: "No feelings"},
    {h: "Slow calculation", c: "Fast calculation"}
];
hvc.forEach(pair => {
    s1.push(q(`Which statement is true for a Computer?`, "mcq", [pair.h, pair.c, "Eats food", "Sleeps at night"], pair.c, `Computers have the property: ${pair.c}.`));
});

// Fill remaining Set 1
for(let i=s1.length; i<50; i++) {
    s1.push(q(`Computer Question ${i+1}: Computers are used in schools for ______?`, "mcq", ["Cooking", "Teaching & Learning", "Washing", "Sleeping"], "Teaching & Learning", "Computers aid education."));
}
setsData.push(s1);

/* SET 2: Computer Hardware (51-100)
   Topics: CPU, Monitor, Keyboard, Mouse, Printer etc.
*/
let s2 = [];
const devices = [
    {n: "Monitor", t: "Output", d: "It looks like a TV."},
    {n: "Keyboard", t: "Input", d: "It has many keys."},
    {n: "Mouse", t: "Input", d: "It is a pointing device."},
    {n: "CPU", t: "Process", d: "It is the brain of the computer."},
    {n: "Printer", t: "Output", d: "It prints on paper."},
    {n: "Scanner", t: "Input", d: "It copies paper to computer."},
    {n: "Speakers", t: "Output", d: "It gives sound output."},
    {n: "Headphones", t: "Output", d: "You wear these to hear music."},
    {n: "Microphone", t: "Input", d: "Used to record voice."},
    {n: "Webcam", t: "Input", d: "Used for video calls."},
    {n: "Joystick", t: "Input", d: "Used to play games."},
    {n: "Plotter", t: "Output", d: "Prints large maps."}
];

devices.forEach(d => {
    s2.push(q(`Identify the device: ${d.d}`, "mcq", [d.n, "Wire", "Switch", "Table"], d.n, d.d));
    s2.push(q(`Is a ${d.n} an Input or Output device?`, "mcq", ["Input", "Output", "Processing", "Storage"], d.t, `${d.n} is a ${d.t} device.`));
});

// Specific Hardware Qs
s2.push(q("What does VDU stand for?", "mcq", ["Visual Display Unit", "Video Daily Unit", "Visual Data Unit", "Very Dark Unit"], "Visual Display Unit", "Monitor is also called VDU."));
s2.push(q("Which printer is generally faster?", "mcq", ["Dot Matrix", "Laser", "Inkjet", "Handheld"], "Laser", "Laser printers are fast and high quality."));
s2.push(q("The buttons on the mouse are used for ______.", "mcq", ["Typing", "Clicking", "Eating", "Running"], "Clicking", "Mouse buttons perform clicks."));
s2.push(q("Which part is inside the CPU box?", "mcq", ["Screen", "Hard Disk", "Mouse", "Keyboard"], "Hard Disk", "The Hard Disk is usually inside the system unit."));
s2.push(q("CPU stands for?", "mcq", ["Central Processing Unit", "Central Print Unit", "Control Power Unit", "Computer Power Unit"], "Central Processing Unit", "CPU is the brain."));

// Fill Set 2
while(s2.length < 50) s2.push(q("Which of these is a hardware part?", "mcq", ["MS Word", "Paint", "Keyboard", "Song"], "Keyboard", "Hardware is something you can touch."));
setsData.push(s2);

/* SET 3: Memory & Storage (101-150)
   Topics: RAM, ROM, HDD, CD, DVD, Units (Bit, Byte)
*/
let s3 = [];
s3.push(q("Where does a computer store its data?", "mcq", ["In the air", "In Memory", "In the keyboard", "In the wire"], "In Memory", "Memory is the storage space."));
s3.push(q("The smallest unit of memory is ______.", "mcq", ["Bit", "Byte", "Kilobyte", "Megabyte"], "Bit", "A Bit (0 or 1) is the smallest."));
s3.push(q("1 Byte is equal to ______ bits.", "fib", ["4", "8", "16", "100"], "8", "8 bits make 1 byte."));
s3.push(q("Which storage device is fixed inside the computer?", "mcq", ["CD", "Pen Drive", "Hard Disk", "DVD"], "Hard Disk", "Hard Disks are internal storage."));
s3.push(q("Which device is small and easy to carry in a pocket?", "mcq", ["Monitor", "Pen Drive", "Printer", "Scanner"], "Pen Drive", "Pen drives are portable."));
s3.push(q("Which holds more data: CD or DVD?", "mcq", ["CD", "DVD", "Both same", "None"], "DVD", "DVDs store more than CDs."));
s3.push(q("What represents 0 and 1 in computer language?", "mcq", ["Binary Digits", "English", "Maths", "Drawing"], "Binary Digits", "Computers understand Binary."));
s3.push(q("RAM stands for ______.", "mcq", ["Read Access Memory", "Random Access Memory", "Run All Memory", "Read All Morning"], "Random Access Memory", "RAM is temporary memory."));
s3.push(q("ROM stands for ______.", "mcq", ["Read Only Memory", "Random Only Memory", "Run On Memory", "Read Once Memory"], "Read Only Memory", "ROM is permanent memory."));
s3.push(q("If power goes off, data in ______ is lost.", "mcq", ["Hard Disk", "ROM", "RAM", "Pen Drive"], "RAM", "RAM is volatile memory."));

// Size comparison
const sizes = ["KB", "MB", "GB", "TB"];
for(let i=0; i<sizes.length-1; i++) {
    s3.push(q(`Which is larger: ${sizes[i]} or ${sizes[i+1]}?`, "mcq", [sizes[i], sizes[i+1]], sizes[i+1], `${sizes[i+1]} is 1024 ${sizes[i]}.`));
}

// Scenario based
s3.push(q("You want to transfer photos to a friend's computer. What will you use?", "mcq", ["Hard Disk", "Pen Drive", "Monitor", "RAM"], "Pen Drive", "Pen drives are used for data transfer."));
s3.push(q("Which is a circular storage device?", "mcq", ["Pen drive", "CD/DVD", "Hard disk", "Keyboard"], "CD/DVD", "CDs and DVDs are round optical discs."));

// Fill Set 3
while(s3.length < 50) s3.push(q("Storage Question: Which is NOT a storage device?", "mcq", ["CD", "Pen Drive", "Mouse", "Hard Disk"], "Mouse", "Mouse is an input device."));
setsData.push(s3);

/* SET 4: Operating System & Windows (151-200)
   Topics: OS functions, Desktop, Icons, Taskbar
*/
let s4 = [];
s4.push(q("What is the first screen that appears after booting called?", "mcq", ["Wall", "Desktop", "Table", "Window"], "Desktop", "The main screen is the Desktop."));
s4.push(q("The small pictures on the desktop are called ______.", "mcq", ["Photos", "Icons", "Buttons", "Logos"], "Icons", "Icons represent programs or files."));
s4.push(q("The bar at the bottom of the desktop is the ______.", "mcq", ["Spacebar", "Taskbar", "Menu bar", "Title bar"], "Taskbar", "The Taskbar holds the Start button and open apps."));
s4.push(q("To open a program, you usually ______ on its icon.", "mcq", ["Click", "Double-click", "Drag", "Right-click"], "Double-click", "Double-clicking opens items."));
s4.push(q("Which is an Operating System?", "mcq", ["MS Word", "Windows 10", "Paint", "Keyboard"], "Windows 10", "Windows is a popular OS."));
s4.push(q("The background picture of the desktop is called ______.", "mcq", ["Wallpaper", "Poster", "Photo", "Screen"], "Wallpaper", "Wallpaper is the background image."));
s4.push(q("Where do you find the Start Button?", "mcq", ["Top Right", "Bottom Left", "Center", "Top Left"], "Bottom Left", "It's usually on the Taskbar's left corner."));
s4.push(q("When you delete a file, where does it go?", "mcq", ["Dustbin", "Recycle Bin", "Trash Can", "Nowhere"], "Recycle Bin", "It goes to the Recycle Bin."));
s4.push(q("Can you restore a file from the Recycle Bin?", "tf", ["Yes", "No"], "Yes", "Files can be restored until emptied."));
s4.push(q("Which button makes a window fill the screen?", "mcq", ["Minimize", "Maximize", "Close", "Restore"], "Maximize", "Maximize expands the window."));

// Actions
const winActions = [
    {a: "Minimize", r: "Hides window to taskbar"},
    {a: "Close", r: "Shuts down the program"},
    {a: "Drag", r: "Moves an icon"},
    {a: "Right Click", r: "Opens a context menu"},
    {a: "Shut Down", r: "Turns off the computer safeley"}
];
winActions.forEach(w => {
    s4.push(q(`What does '${w.a}' do?`, "mcq", [w.r, "Deletes file", "Plays music", "Types text"], w.r, `Action: ${w.r}`));
});

// Fill Set 4
while(s4.length < 50) s4.push(q("Windows Question: The clock is usually found on the ______.", "mcq", ["Title Bar", "Taskbar", "Menu Bar", "Desktop center"], "Taskbar", "The clock is in the notification area of the Taskbar."));
setsData.push(s4);

/* SET 5: Keyboard & Mouse Skills (201-250)
   Topics: Keys functions, Mouse actions
*/
let s5 = [];
const keys = [
    {k: "Enter Key", u: "Moves cursor to next line"},
    {k: "Spacebar", u: "Gives a space"},
    {k: "Caps Lock", u: "Types capital letters"},
    {k: "Backspace", u: "Erases character to the left"},
    {k: "Delete", u: "Erases character to the right"},
    {k: "Shift", u: "Used to type upper symbol on keys"},
    {k: "Arrow Keys", u: "Moves cursor up, down, left, right"},
    {k: "Num Lock", u: "Activates the number pad"},
    {k: "Esc", u: "Cancels an action"},
    {k: "Home", u: "Moves cursor to start of line"}
];
keys.forEach(k => {
    s5.push(q(`Which key is used to: ${k.u}?`, "mcq", [k.k, "Ctrl", "Alt", "Tab"], k.k, `${k.k}: ${k.u}`));
});

s5.push(q("Which is the longest key on the keyboard?", "mcq", ["Enter", "Shift", "Spacebar", "Backspace"], "Spacebar", "Spacebar is the longest key."));
s5.push(q("How many Enter keys are usually on a keyboard?", "fib", ["1", "2", "3", "4"], "2", "Standard keyboards have 2 Enter keys."));
s5.push(q("A mouse usually has ______ buttons.", "fib", ["1", "2 or 3", "5", "10"], "2 or 3", "Left, Right, and Scroll wheel."));
s5.push(q("The wheel between mouse buttons is called ______.", "mcq", ["Scroll wheel", "Spin wheel", "Tyre", "Button"], "Scroll wheel", "It scrolls the page."));
s5.push(q("Pressing and releasing the left mouse button once is called ______.", "mcq", ["Click", "Double Click", "Right Click", "Drag"], "Click", "Single click selects items."));

// Fill Set 5
while(s5.length < 50) s5.push(q("Typing Skill: To type '@' symbol (above 2), you must hold ______.", "mcq", ["Ctrl", "Shift", "Alt", "Caps Lock"], "Shift", "Shift + Number key types the symbol."));
setsData.push(s5);

/* SET 6: MS Paint & Drawing (251-300)
   Topics: Tools, Shapes, Colors
*/
let s6 = [];
s6.push(q("Which program is used for drawing?", "mcq", ["Notepad", "MS Paint", "Calculator", "Excel"], "MS Paint", "MS Paint is for digital art."));
s6.push(q("The white area where you draw is called ______.", "mcq", ["Paper", "Canvas", "Screen", "Board"], "Canvas", "The drawing area is the Canvas."));
s6.push(q("Which tool looks like a bucket?", "mcq", ["Pencil", "Eraser", "Fill with Color", "Brush"], "Fill with Color", "The bucket fills an area with color."));
s6.push(q("To draw a perfect circle, hold the ______ key.", "mcq", ["Ctrl", "Shift", "Alt", "Enter"], "Shift", "Shift constrains ellipses to circles."));
s6.push(q("Which tool sprays color like a spray can?", "mcq", ["Airbrush", "Pencil", "Line", "Text"], "Airbrush", "Airbrush sprays paint."));
s6.push(q("To type your name in Paint, use the ______ tool.", "mcq", ["Pencil", "Text (A)", "Brush", "Line"], "Text (A)", "The 'A' tool is for Text."));
s6.push(q("The ______ tool removes mistakes.", "mcq", ["Pencil", "Eraser", "Brush", "Line"], "Eraser", "Eraser rubs out pixels."));
s6.push(q("Where do you pick colors from?", "mcq", ["Tool box", "Color Palette", "Canvas", "Title bar"], "Color Palette", "Colors are in the palette."));
s6.push(q("Which tool helps to see the picture bigger?", "mcq", ["Magnifier", "Pencil", "Brush", "Line"], "Magnifier", "Magnifier zooms in."));
s6.push(q("The top bar containing 'Home' and 'View' is called ______.", "mcq", ["Menu", "Ribbon", "Stick", "Line"], "Ribbon", "The Ribbon holds the tools."));

// Shapes logic
const shapes = ["Rectangle", "Oval", "Triangle", "Line", "Curve", "Star"];
shapes.forEach(sh => {
    s6.push(q(`Is '${sh}' a shape available in Paint?`, "tf", ["True", "False"], "True", "Paint has a shapes gallery."));
});

// Fill Set 6
while(s6.length < 50) s6.push(q("Paint Tool: The 'Color Picker' tool looks like a ______.", "mcq", ["Pencil", "Dropper", "Brush", "Knife"], "Dropper", "It picks a color from the drawing."));
setsData.push(s6);

/* SET 7: MS Word (301-350)
   Topics: Typing, Formatting, Editing
*/
let s7 = [];
s7.push(q("MS Word is used for ______.", "mcq", ["Drawing", "Typing text", "Playing Music", "Calculation"], "Typing text", "It is a Word Processor."));
s7.push(q("The blinking line where text appears is called ______.", "mcq", ["Stick", "Cursor", "Pointer", "Arrow"], "Cursor", "Cursor marks the typing position."));
s7.push(q("Making text darker is called ______.", "mcq", ["Italic", "Bold", "Underline", "Strike"], "Bold", "Bold makes text thick."));
s7.push(q("Slanting text to the right is called ______.", "mcq", ["Bold", "Italic", "Underline", "Plain"], "Italic", "Italic slants the text."));
s7.push(q("Drawing a line below text is called ______.", "mcq", ["Bold", "Underline", "Italic", "Cut"], "Underline", "Underline places a line below."));
s7.push(q("To select a single word, double-click it.", "tf", ["True", "False"], "True", "Double-click selects a word."));
s7.push(q("Which alignment puts text in the center?", "mcq", ["Left", "Right", "Center", "Justify"], "Center", "Center alignment centers text."));
s7.push(q("The command to Save a file is ______.", "mcq", ["Ctrl+S", "Ctrl+C", "Ctrl+V", "Ctrl+P"], "Ctrl+S", "Ctrl+S saves the document."));
s7.push(q("The command to Copy text is ______.", "mcq", ["Ctrl+C", "Ctrl+X", "Ctrl+V", "Ctrl+S"], "Ctrl+C", "Ctrl+C copies."));

// Combine all Sets
globalState.sets = setsData;

/* UI LOGIC 
*/

function init() {
    renderMenu();
    updateScore();
}

function renderMenu() {
    document.getElementById('menu-screen').style.display = 'flex';
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('feedback-area').style.display = 'none';
    
    const list = document.getElementById('set-list');
    list.innerHTML = '';
    
    const titles = [
        "Intro to Computers", "Hardware Parts", "Memory & Storage", "Operating System",
        "Keyboard & Mouse", "MS Paint", "MS Word", "PowerPoint", "Internet & Safety", "Logic & Projects"
    ];

    globalState.sets.forEach((set, index) => {
        const btn = document.createElement('div');
        btn.className = 'set-btn';
        btn.innerHTML = `Set ${index + 1}: ${titles[index]} <span>(Qs ${(index*50)+1}-${(index+1)*50})</span>`;
        btn.onclick = () => startSet(index);
        list.appendChild(btn);
    });
}

function startSet(index) {
    globalState.currentSetId = index;
    globalState.currentQIndex = 0;
    document.getElementById('menu-screen').style.display = 'none';
    document.getElementById('quiz-screen').style.display = 'block';
    document.getElementById('set-title').innerText = `Set ${index + 1}`;
    renderQuestion();
}

function showMenu() {
    renderMenu();
}

function renderQuestion() {
    const set = globalState.sets[globalState.currentSetId];
    const q = set[globalState.currentQIndex];
    
    document.getElementById('q-counter').innerText = `${globalState.currentQIndex + 1}/${set.length}`;
    document.getElementById('feedback-area').style.display = 'none';
    
    const display = document.getElementById('question-display');
    display.innerHTML = '';

    // Image placeholder
    if(q.isImage) {
        const imgBox = document.createElement('div');
        imgBox.className = 'image-box';
        imgBox.innerText = "[ Picture of " + q.text.split(':')[0] + " ]";
        display.appendChild(imgBox);
    }

    // Question Text
    const qText = document.createElement('div');
    qText.className = 'question-box';
    qText.innerText = `Q${globalState.currentQIndex + 1}: ${q.text}`;
    display.appendChild(qText);

    // Options
    const optGrid = document.createElement('div');
    optGrid.className = 'options-grid';
    
    // Disable buttons if already answered
    const answered = q.userAnswer !== null;

    q.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        
        if (answered) {
            btn.disabled = true;
            if (opt === q.answer) btn.classList.add('correct');
            if (opt === q.userAnswer && opt !== q.answer) btn.classList.add('wrong');
        } else {
            btn.onclick = () => checkAnswer(opt, q);
        }
        optGrid.appendChild(btn);
    });
    
    display.appendChild(optGrid);

    // Nav Buttons
    document.getElementById('prev-btn').disabled = globalState.currentQIndex === 0;
    document.getElementById('next-btn').innerText = globalState.currentQIndex === set.length - 1 ? 'Finish Set' : 'Next';

    // Show feedback if answered
    if (answered) showFeedback(q.userAnswer === q.answer, q);
}

function checkAnswer(selected, q) {
    q.userAnswer = selected;
    const isCorrect = selected === q.answer;
    
    if (isCorrect) globalState.scores.correct++;
    else globalState.scores.wrong++;
    globalState.scores.attempted++;
    
    updateScore();
    renderQuestion(); // Re-render to show colors
    showFeedback(isCorrect, q);
}

function showFeedback(isCorrect, q) {
    const area = document.getElementById('feedback-area');
    const title = document.getElementById('fb-title');
    const text = document.getElementById('fb-text');
    
    area.style.display = 'block';
    if (isCorrect) {
        title.innerText = "Excellent ⭐";
        title.style.color = "green";
        text.innerHTML = `Correct! ${q.explanation}`;
    } else {
        title.innerText = "Try Again";
        title.style.color = "red";
        text.innerHTML = `Wrong. The correct answer is <b>${q.answer}</b>.<br>${q.explanation}`;
    }
}

function prevQ() {
    if (globalState.currentQIndex > 0) {
        globalState.currentQIndex--;
        renderQuestion();
    }
}

function nextQ() {
    const set = globalState.sets[globalState.currentSetId];
    if (globalState.currentQIndex < set.length - 1) {
        globalState.currentQIndex++;
        renderQuestion();
    } else {
        alert("Set Complete! Great job.");
        showMenu();
    }
}

function updateScore() {
    document.getElementById('score-correct').innerText = globalState.scores.correct;
    document.getElementById('score-wrong').innerText = globalState.scores.wrong;
    
    const tot = globalState.scores.attempted;
    const perc = tot === 0 ? 0 : Math.round((globalState.scores.correct / tot) * 100);
    document.getElementById('score-perc').innerText = perc + "%";
}

// Start
document.addEventListener('DOMContentLoaded', init);

</script>
