<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShanEduHub: Class 4 EVS Master Suite</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #66BB6A;
            --wrong: #EF5350;
            --bg-color: #FFF9C4; /* Pastel Yellow */
            --card-bg: #FFFFFF;
            --text-color: #333;
            --font-main: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER & SCOREBOARD --- */
        header {
            background-color: #B3E5FC; /* Pastel Blue */
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #0277BD;
        }

        .score-panel {
            display: flex;
            justify-content: space-around;
            background: white;
            margin-top: 8px;
            padding: 5px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .score-item span {
            display: block;
            font-size: 0.8rem;
            color: #777;
        }

        /* --- NAVIGATION & MENU --- */
        #game-menu {
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            padding-bottom: 60px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 0 #ddd;
            cursor: pointer;
            transition: transform 0.1s;
            border: 2px solid #eee;
        }

        .game-card:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #ddd;
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .game-title {
            font-weight: bold;
            font-size: 0.9rem;
            color: #555;
        }

        /* --- GAME PLAY AREA --- */
        #game-area {
            display: none; /* Hidden by default */
            flex: 1;
            padding: 15px;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .task-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-back {
            background: #FFCC80;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        .level-indicator {
            background: #E1BEE7;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
        }

        .question-box {
            background: white;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
            font-size: 1.1rem;
            line-height: 1.4;
        }

        .question-highlight {
            font-size: 2rem;
            display: block;
            margin: 10px 0;
        }

        /* --- INTERACTIVE ELEMENTS --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
        }

        .option-btn {
            background: white;
            border: 2px solid #B3E5FC;
            padding: 15px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .option-btn.selected {
            background: #B3E5FC;
            border-color: #0288D1;
        }

        .option-btn.correct {
            background: #C8E6C9;
            border-color: #2E7D32;
            color: #1B5E20;
        }

        .option-btn.wrong {
            background: #FFCDD2;
            border-color: #C62828;
            color: #B71C1C;
        }

        /* Sort/Bin Game Styles */
        .bins-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            gap: 10px;
            margin-top: 20px;
        }

        .bin {
            flex: 1;
            background: rgba(255,255,255,0.6);
            border: 3px dashed #aaa;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .bin-active {
            background: #E1F5FE;
            border-color: #03A9F4;
        }

        /* Feedback Overlay */
        #feedback-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .feedback-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .feedback-title {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: block;
        }

        .feedback-text {
            margin-bottom: 20px;
            font-size: 1rem;
            color: #555;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #1565C0;
        }

        .next-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- FOOTER --- */
        footer {
            margin-top: auto;
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 0.8rem;
        }

        .highlight-blue { color: #1976D2; }
        .highlight-green { color: #388E3C; }
    </style>
</head>

            {q: "Largest sense organ?", a: "Skin", w: ["Eye", "Tongue"]},
            {q: "Fastest animal?", a: "Cheetah", w: ["Lion", "Horse"]},
            {q: "Gas plants need?", a: "Carbon Dioxide", w: ["Oxygen", "Nitrogen"]},
            {q: "Freezing point of water?", a: "0°C", w: ["100°C", "10°C"]},
            {q: "National Animal of India?", a: "Tiger", w: ["Lion", "Elephant"]},
            {q: "Planet we live on?", a: "Earth", w: ["Mars", "Venus"]}
        ], 25)
    }
];

// --- GENERATOR FUNCTIONS (To ensure 25 tasks per game) ---

/**
 * Creates a Drag-Drop style MCQ (Categorization)
 * Takes 3 arrays of items and category names.
 */
function generateSorter(cat1Items, cat2Items, cat3Items, promptTitle, labels = ["Category 1", "Category 2", "Category 3"]) {
    let tasks = [];
    const allItems = [
        ...cat1Items.map(i => ({t: i, c: labels[0]})),
        ...cat2Items.map(i => ({t: i, c: labels[1]})),
        ...cat3Items.map(i => ({t: i, c: labels[2]}))
    ];
    
    // Shuffle and pick 25 (loop if needed)
    for(let i=0; i<25; i++) {
        let item = allItems[i % allItems.length];
        tasks.push({
            type: "sort",
            question: `${promptTitle}`,
            highlight: item.t,
            correct: item.c,
            options: labels,
            expl: `${item.t} belongs to ${item.c}.`
        });
    }
    return shuffle(tasks);
}

/**
 * Creates MCQ from a Question Bank
 */
function generateMatcher(baseQuestions, count) {
    let tasks = [];
    for(let i=0; i<count; i++) {
        let q = baseQuestions[i % baseQuestions.length];
        tasks.push({
            type: "mcq",
            question: q.q,
            correct: q.a,
            options: shuffle([q.a, ...q.w]),
            expl: `Correct! ${q.a} is the right answer.`
        });
    }
    return shuffle(tasks);
}

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

// --- ENGINE LOGIC ---

const app = {
    init: () => {
        app.renderMenu();
        app.loadScores();
    },

    loadScores: () => {
        const s = JSON.parse(localStorage.getItem('evs_scores')) || { correct: 0, wrong: 0, total: 0 };
        state.scores = s;
        app.updateScoreUI();
    },

    saveScores: () => {
        localStorage.setItem('evs_scores', JSON.stringify(state.scores));
        app.updateScoreUI();
    },

    updateScoreUI: () => {
        document.getElementById('score-correct').innerText = state.scores.correct;
        document.getElementById('score-wrong').innerText = state.scores.wrong;
        document.getElementById('score-total').innerText = state.scores.total;
        let pct = state.scores.total === 0 ? 0 : Math.round((state.scores.correct / state.scores.total) * 100);
        document.getElementById('score-percent').innerText = pct + "%";
    },

    renderMenu: () => {
        const menu = document.getElementById('game-menu');
        menu.innerHTML = "";
        gameDefinitions.forEach(g => {
            let el = document.createElement('div');
            el.className = 'game-card';
            el.style.borderColor = g.color;
            el.innerHTML = `<div class="game-icon">${g.icon}</div><div class="game-title">${g.title}</div>`;
            el.onclick = () => app.startGame(g.id);
            menu.appendChild(el);
        });
        document.getElementById('game-menu').style.display = 'grid';
        document.getElementById('game-area').style.display = 'none';
        window.scrollTo(0,0);
    },

    showMenu: () => {
        document.getElementById('game-menu').style.display = 'grid';
        document.getElementById('game-area').style.display = 'none';
    },

    startGame: (id) => {
        state.currentGameId = id;
        state.currentTaskIndex = 0;
        
        // Generate Fresh Tasks
        const gameDef = gameDefinitions.find(g => g.id === id);
        state.currentTasks = gameDef.gen();

        document.getElementById('game-menu').style.display = 'none';
        document.getElementById('game-area').style.display = 'flex';
        app.renderTask();
    },

    renderTask: () => {
        const task = state.currentTasks[state.currentTaskIndex];
        const canvas = document.getElementById('game-canvas');
        document.getElementById('current-task-num').innerText = state.currentTaskIndex + 1;
        canvas.innerHTML = '';

        // Render based on type
        if(task.type === "mcq") {
            let html = `
                <div class="question-box">
                    ${task.question}
                </div>
                <div class="options-grid">
                    ${task.options.map(opt => `<button class="option-btn" onclick="app.checkAnswer(this, '${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
                </div>
            `;
            canvas.innerHTML = html;
        } else if (task.type === "sort") {
            let html = `
                <div class="question-box">
                    <div>${task.question}</div>
                    <span class="question-highlight">${task.highlight}</span>
                </div>
                <div class="options-grid" style="grid-template-columns: 1fr;">
                     ${task.options.map(opt => `<button class="option-btn" onclick="app.checkAnswer(this, '${opt}')">Place in: ${opt}</button>`).join('')}
                </div>
            `;
            canvas.innerHTML = html;
        }
    },

    checkAnswer: (btnElement, selectedAnswer) => {
        // Prevent double click
        if(btnElement.classList.contains('correct') || btnElement.classList.contains('wrong')) return;

        const task = state.currentTasks[state.currentTaskIndex];
        const isCorrect = selectedAnswer === task.correct;

        state.scores.total++;
        if(isCorrect) {
            state.scores.correct++;
            btnElement.classList.add('correct');
            app.showFeedback(true, "Excellent! ⭐", task.expl);
        } else {
            state.scores.wrong++;
            btnElement.classList.add('wrong');
            // Highlight correct one
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(b => {
                if(b.innerText.includes(task.correct)) b.classList.add('correct');
            });
            app.showFeedback(false, "Try Again", task.expl);
        }
        app.saveScores();
    },

    showFeedback: (isCorrect, title, msg) => {
        const modal = document.getElementById('feedback-modal');
        const icon = document.getElementById('fb-icon');
        const tit = document.getElementById('fb-title');
        const txt = document.getElementById('fb-reason');

        icon.innerText = isCorrect ? "🌟" : "🤔";
        tit.innerText = title;
        tit.style.color = isCorrect ? "var(--success)" : "var(--wrong)";
        txt.innerText = msg;
        
        setTimeout(() => {
            modal.style.display = 'flex';
        }, 500);
    },

    nextTask: () => {
        document.getElementById('feedback-modal').style.display = 'none';
        state.currentTaskIndex++;
        if(state.currentTaskIndex < 25) {
            app.renderTask();
        } else {
            alert("Game Completed! Well done! 🎉 Returning to Menu.");
            app.renderMenu();
        }
    }
};

// Start
document.addEventListener('DOMContentLoaded', app.init);

</script>
