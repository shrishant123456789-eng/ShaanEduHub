<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShanEduHub - Class 3 Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lobster&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Design Starts Here --- */
        :root {
            --bg-color: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%);
            --card-hover: translateY(-10px) scale(1.02);
            --shadow: 0 15px 30px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-image: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- Header Styling (ShanEduHub) --- */
        header {
            text-align: center;
            padding: 40px 20px;
            animation: bounceIn 1s ease;
        }

        .brand-name {
            font-family: 'Lobster', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 3px 3px 0px #ff6b6b, 6px 6px 0px #4ecdc4;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.5rem;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            padding: 5px 25px;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* --- Grid Container --- */
        .dashboard-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
            margin-bottom: 60px;
            padding: 20px;
        }

        /* --- Card Design --- */
        .subject-card {
            background: white;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            text-decoration: none;
            color: #333;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            border-bottom: 8px solid #ddd;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .subject-card:hover {
            transform: var(--card-hover);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        /* Animation for cards appearing */
        .subject-card {
            animation: fadeUp 0.8s ease-out backwards;
        }
        
        /* Staggered animation delays */
        .card-1 { animation-delay: 0.1s; border-bottom-color: #FF6B6B; }
        .card-2 { animation-delay: 0.2s; border-bottom-color: #FFD93D; }
        .card-3 { animation-delay: 0.3s; border-bottom-color: #4D96FF; }
        .card-4 { animation-delay: 0.4s; border-bottom-color: #6BCB77; }
        .card-5 { animation-delay: 0.5s; border-bottom-color: #A3CB38; }
        .card-6 { animation-delay: 0.6s; border-bottom-color: #8E44AD; }
        .card-7 { animation-delay: 0.7s; border-bottom-color: #FF9F1C; }
        .card-8 { animation-delay: 0.8s; border-bottom-color: #F78FB3; }

        .emoji {
            font-size: 4rem;
            margin-bottom: 15px;
            transition: transform 0.3s;
        }

        .subject-card:hover .emoji {
            transform: scale(1.2) rotate(10deg);
        }

        .title {
            font-family: 'Fredoka', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .desc {
            font-size: 0.9rem;
            color: #777;
        }

        /* --- Footer (Fixed info) --- */
        footer {
            margin-top: auto;
            background: #2c3e50;
            width: 100%;
            text-align: center;
            padding: 20px;
            color: white;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
            font-size: 1rem;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.2);
        }

        /* --- Animations --- */
        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Mobile Responsive --- */
        @media (max-width: 600px) {
            .brand-name { font-size: 3rem; }
            .dashboard-container { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>

    <header>
        <div class="brand-name">ShanEduHub</div>
        <div class="subtitle">🎓 Class 3 Learning World 🌟</div>
    </header>

    <main class="dashboard-container">
        
        <a href="class3-english.html" class="subject-card card-1">
            <div class="emoji">📚</div>
            <div class="title">English</div>
            <div class="desc">Stories & Grammar</div>
        </a>

        <a href="class3-hindi.html" class="subject-card card-2">
            <div class="emoji">🇮🇳</div>
            <div class="title">Hindi (हिंदी)</div>
            <div class="desc">कहानियाँ और व्याकरण</div>
        </a>

        <a href="class3-maths.html" class="subject-card card-3">
            <div class="emoji">🔢</div>
            <div class="title">Mathematics</div>
            <div class="desc">Fun with Numbers</div>
        </a>

        <a href="class3-evs.html" class="subject-card card-4">
            <div class="emoji">🌱</div>
            <div class="title">EVS / Science</div>
            <div class="desc">Nature & World</div>
        </a>

        <a href="class3-computer.html" class="subject-card card-6">
            <div class="emoji">💻</div>
            <div class="title">Computer</div>
            <div class="desc">Tech & Paint</div>
        </a>

        <a href="class3-gk.html" class="subject-card card-7">
            <div class="emoji">🌍</div>
            <div class="title">G.K.</div>
            <div class="desc">World Facts</div>
        </a>

        <a href="class3-moral.html" class="subject-card card-8">
            <div class="emoji">💖</div>
            <div class="title">Moral Values</div>
            <div class="desc">Good Habits</div>
        </a>

        <a href="class3-art.html" class="subject-card card-5">
            <div class="emoji">🎨</div>
            <div class="title">Art & Craft</div>
            <div class="desc">Colors & Fun</div>
        </a>

    </main>

    <footer>
        Created & Designed by SHRISHANT YADAV
    </footer>

</body>
</html>
