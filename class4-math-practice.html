<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 Maths Practice - ShanEduHub</title>
    <!-- Importing a child-friendly handwriting font -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #FFF9C4;
            --primary-green: #C8E6C9;
            --primary-blue: #BBDEFB;
            --primary-orange: #FFE0B2;
            --primary-purple: #E1BEE7;
            --text-color: #424242;
            --btn-color: #FF9800;
            --btn-hover: #F57C00;
            --correct: #4CAF50;
            --wrong: #F44336;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Patrick Hand', cursive;
            background-color: #FAFAFA;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            font-size: 18px;
            font-weight: bold; /* Requirement: ALL TEXT BOLD */
        }

        /* --- STICKY SCORE PANEL --- */
        #score-panel {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid var(--primary-orange);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            font-size: 1rem;
        }

        .score-item {
            text-align: center;
            margin: 2px 5px;
            padding: 5px 10px;
            background: #f0f0f0;
            border-radius: 10px;
            min-width: 80px;
        }

        .score-label {
            font-size: 0.8rem;
            color: #666;
            display: block;
        }

        .score-value {
            font-size: 1.2rem;
            color: #333;
        }

        /* --- HERO SECTION --- */
        #hero {
            background: linear-gradient(135deg, var(--primary-yellow), var(--primary-orange));
            padding: 40px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: #E65100;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #5D4037;
        }

        .motivation {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #333;
        }

        .start-btn {
            margin-top: 20px;
            background: var(--btn-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #E65100;
            transition: transform 0.1s;
            font-family: inherit;
            font-weight: bold;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        /* --- PRACTICE SETS --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 10px;
        }

        .set-section {
            background: white;
            border-radius: 20px;
            margin-bottom: 30px;
            padding: 20px;
            border: 2px solid #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .set-header {
            background: var(--primary-blue);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
            color: #0D47A1;
        }

        /* --- QUESTION CARDS --- */
        .question-card {
            background: #fff;
            border: 2px solid #f0f0f0;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .question-card.basic { border-left: 5px solid var(--primary-green); }
        .question-card.medium { border-left: 5px solid var(--primary-yellow); }
        .question-card.advanced { border-left: 5px solid var(--primary-orange); }

        .q-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #777;
        }

        .q-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .q-input-area {
            margin-bottom: 15px;
        }

        /* Inputs */
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-weight: bold;
            resize: vertical;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: #f9f9f9;
            border: 2px solid #eee;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 1rem;
        }

        .option-btn.selected {
            background: var(--primary-blue);
            border-color: #2196F3;
            color: #0D47A1;
        }

        .check-btn {
            background: var(--primary-green);
            color: #1B5E20;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            width: 100%;
        }

        /* Feedback */
        .feedback {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            display: none;
        }

        .feedback.correct {
            background: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #C8E6C9;
        }

        .feedback.wrong {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #FFCDD2;
        }

        .long-feedback-points li {
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        /* --- FOOTER --- */
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 0.9rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .score-item { min-width: 60px; padding: 5px; margin: 2px; }
            .score-value { font-size: 1rem; }
            .score-label { font-size: 0.7rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- STICKY SCORE PANEL -->
    <div id="score-panel">
        <div class="score-item">
            <span class="score-label">Attempted</span>
            <span class="score-value"><span id="attempted-count">0</span>/500</span>
        </div>
        <div class="score-item">
            <span class="score-label">Correct</span>
            <span class="score-value" style="color:var(--correct);" id="correct-count">0</span>
        </div>
        <div class="score-item">
            <span class="score-label">Wrong</span>
            <span class="score-value" style="color:var(--wrong);" id="wrong-count">0</span>
        </div>
        <div class="score-item">
            <span class="score-label">Score</span>
            <span class="score-value"><span id="score-total">0</span></span>
        </div>
        <div class="score-item">
            <span class="score-label">Accuracy</span>
            <span class="score-value"><span id="accuracy">0</span>%</span>
        </div>
    </div>

    <!-- HERO SECTION -->
    <div id="hero">
        <h1>Class 4 – Maths Practice</h1>
        <div class="subtitle">10 Sets | 500 Questions | ShanEduHub</div>
        <p class="motivation">"Maths is fun when you practice! 🌟"</p>
        <button class="start-btn" onclick="scrollToSet1()">Start Practice</button>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container" id="main-container">
        <!-- Sets will be injected here by JS -->
    </div>

    <!-- FOOTER -->
    <footer>
        Designed & Created by SHRISHANT YADAV<br>
        2026 – ShanEduHub
    </footer>

    <script>
        // --- CONSTANTS & CONFIG ---
        const TOTAL_QUESTIONS = 500;
        const TOTAL_SETS = 10;
        const QUESTIONS_PER_SET = 50;
        const TARGET_LONG_QUESTIONS = 150;
        const TARGET_SHORT_QUESTIONS = 350;

        // Syllabus Data Structure for Generation
        const CHAPTERS = [
            { id: 1, name: "Numbers & Place Value" },
            { id: 2, name: "Addition & Subtraction" },
            { id: 3, name: "Multiplication & Division" },
            { id: 4, name: "Factors & Multiples" },
            { id: 5, name: "Fractions" },
            { id: 6, name: "Decimals" },
            { id: 7, name: "Geometry" },
            { id: 8, name: "Circles" },
            { id: 9, name: "Measurement" },
            { id: 10, name: "Perimeter & Area" },
            { id: 11, name: "Time & Calendar" },
            { id: 12, name: "Data Handling & Money" }
        ];

        // Global State
        let state = {
            totalAttempted: 0,
            correct: 0,
            wrong: 0,
            totalScore: 0,
            totalMaxScore: 0,
            questions: [] // Will hold 500 question objects
        };

        // --- QUESTION GENERATOR ENGINE ---
        // Helper to get random int
        function rInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        // Helper to pick random item
        function rPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        // Generators per Chapter
        const generators = {
            // Ch 1: Numbers
            1: (isLong) => {
                const n1 = rInt(10000, 99999);
                if (isLong) {
                    return {
                        text: `Write the predecessor and successor of ${n1}, and then explain which digit changed and why.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['predecessor', 'successor', 'digit', 'place', 'one', 'less', 'more'],
                        model: `Predecessor is ${n1-1}, Successor is ${n1+1}. The digit in the ones place changes.`
                    };
                } else {
                    const type = rPick(['place', 'expand', 'round']);
                    if (type === 'place') return { text: `What is the Place Value of 5 in ${n1.toString().replace(/./, '5')}?`, type: 'short', answer: '5000', marks: 1 };
                    if (type === 'expand') return { text: `Write ${n1} in expanded form (use +).`, type: 'short', answer: n1.toString().split('').map((d,i,a) => d + '0'.repeat(a.length-i-1)).join('+'), marks: 1 };
                    return { text: `Round ${n1} to the nearest 1000.`, type: 'short', answer: (Math.round(n1/1000)*1000).toString(), marks: 1 };
                }
            },
            // Ch 2: Add/Sub
            2: (isLong) => {
                const n1 = rInt(1000, 9000); const n2 = rInt(1000, 9000);
                if (isLong) {
                    return {
                        text: `A library has ${n1} English books and ${n2} Hindi books. ${rInt(100,500)} books were lent out. How many books are left in the library? Show steps.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['total', 'add', 'subtract', 'left', 'sum', 'minus', 'plus'],
                        model: `Total books = ${n1} + ${n2}. Then subtract lent books.  ${(n1+n2)-rInt(100,500)}.`
                    };
                } else {
                    const op = rPick(['+', '-']);
                    return { text: `Solve: ${n1} ${op} ${n2}`, type: 'short', answer: (op==='+' ? n1+n2 : Math.abs(n1-n2)).toString(), marks: 1 };
                }
            },
            // Ch 3: Mult/Div
            3: (isLong) => {
                const n1 = rInt(15, 50); const n2 = rInt(5, 12);
                if (isLong) {
                    return {
                        text: `One box holds ${n1} apples. A truck carries ${n2} such boxes. If 10 apples are rotten, how many good apples are there? Explain.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['multiply', 'product', 'subtract', 'times', 'total'],
                        model: `Total apples = ${n1} x ${n2}. Subtract 10. Result: ${(n1*n2)-10}.`
                    };
                } else {
                    if (Math.random() > 0.5) return { text: `Multiply: ${n1} × ${n2}`, type: 'short', answer: (n1*n2).toString(), marks: 1 };
                    return { text: `Divide: ${n1*n2} ÷ ${n2}`, type: 'short', answer: n1.toString(), marks: 1 };
                }
            },
            // Ch 4: Factors
            4: (isLong) => {
                const n = rInt(12, 40);
                if (isLong) {
                    return {
                        text: `Find all factors of ${n} and state if it is Prime or Composite. Explain why.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['factor', 'prime', 'composite', 'divisible', 'table'],
                        model: `Factors are numbers that divide ${n} completely. It is Composite.`
                    };
                } else {
                    return { text: `Is ${n} a Prime number? (Yes/No)`, type: 'short', answer: (checkPrime(n) ? 'Yes' : 'No'), marks: 1 };
                }
            },
            // Ch 5: Fractions
            5: (isLong) => {
                if (isLong) {
                    return {
                        text: `Convert the improper fraction 15/4 into a mixed number and explain the steps.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['divide', 'remainder', 'quotient', 'mixed', 'denominator'],
                        model: `Divide 15 by 4. Quotient is 3, Remainder is 3. Answer: 3 3/4.`
                    };
                } else {
                    return { text: `Which is greater: 1/4 or 1/2?`, type: 'short', answer: '1/2', marks: 1 };
                }
            },
            // Ch 6: Decimals
            6: (isLong) => {
                if (isLong) {
                    return {
                        text: `Raju has ₹50.50. He buys a pen for ₹20.25. How much money is left? Write the statement.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['subtract', 'minus', 'left', 'rupees', 'point', 'decimal'],
                        model: `Subtract 20.25 from 50.50. Answer: ₹30.25.`
                    };
                } else {
                    return { text: `Write 0.75 as a fraction (simplest form not needed).`, type: 'short', answer: '75/100', marks: 1 };
                }
            },
            // Ch 7: Geometry
            7: (isLong) => {
                if (isLong) {
                    return {
                        text: `Describe a Cube. How many faces, edges, and vertices does it have?`,
                        type: 'long',
                        marks: 3,
                        keywords: ['face', 'edge', 'vertex', 'square', '6', '12', '8'],
                        model: `A cube has 6 square faces, 12 edges, and 8 vertices.`
                    };
                } else {
                    return { text: `A triangle with one 90° angle is called a ______ triangle.`, type: 'short', answer: 'Right', marks: 1 };
                }
            },
            // Ch 8: Circles
            8: (isLong) => {
                if (isLong) {
                    return {
                        text: `If the Radius is 5cm, what is the Diameter? Explain the relationship.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['diameter', 'radius', 'double', 'twice', '2', '10'],
                        model: `Diameter = 2 x Radius. So, 2 x 5 = 10cm.`
                    };
                } else {
                    return { text: `The longest chord of a circle is called the ______?`, type: 'short', answer: 'Diameter', marks: 1 };
                }
            },
            // Ch 9: Measurement
            9: (isLong) => {
                const km = rInt(2, 9);
                if (isLong) {
                    return {
                        text: `Convert ${km}km 500m into meters. Explain the conversion.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['1000', 'multiply', 'add', 'meters', 'convert'],
                        model: `1 km = 1000m. So ${km}000 + 500 = ${km}500 meters.`
                    };
                } else {
                    return { text: `1 kg = ______ grams`, type: 'short', answer: '1000', marks: 1 };
                }
            },
            // Ch 10: Perimeter/Area
            10: (isLong) => {
                const s = rInt(4, 10);
                if (isLong) {
                    return {
                        text: `A square park has a side of ${s}m. Find its Perimeter and Area. Write formulas.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['perimeter', 'area', 'side', '4', 'multiply', 'square'],
                        model: `Perimeter = 4 x side = ${4*s}m. Area = side x side = ${s*s} sq m.`
                    };
                } else {
                    return { text: `Perimeter of rectangle with L=5, B=2 is?`, type: 'short', answer: '14', marks: 1 };
                }
            },
            // Ch 11: Time
            11: (isLong) => {
                if (isLong) {
                    return {
                        text: `A movie started at 2:00 PM and ended at 4:30 PM. How long was the movie? Explain logic.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['hours', 'minutes', 'subtract', 'duration', 'time'],
                        model: `Count from 2:00 to 4:30. It is 2 hours and 30 minutes.`
                    };
                } else {
                    return { text: `How many minutes in 3 hours?`, type: 'short', answer: '180', marks: 1 };
                }
            },
            // Ch 12: Data
            12: (isLong) => {
                if (isLong) {
                    return {
                        text: `If 1 smiley face represents 5 students, how many students do 4 smiley faces represent? Explain.`,
                        type: 'long',
                        marks: 3,
                        keywords: ['multiply', '5', '4', 'scale', 'pictograph', '20'],
                        model: `4 faces x 5 students each = 20 students.`
                    };
                } else {
                    return { text: `Total money: ₹50 + ₹20 + ₹5 = ?`, type: 'short', answer: '75', marks: 1 };
                }
            }
        };

        function checkPrime(num) {
            for(let i = 2; i < num; i++) if(num % i === 0) return false;
            return num > 1;
        }

        // --- MAIN GENERATION LOOP ---
        function generateAllQuestions() {
            let allQ = [];
            let longCount = 0;
            let shortCount = 0;
            let qId = 1;

            // We need 150 long total, so 15 per set
            // We need 350 short total, so 35 per set

            for (let set = 1; set <= TOTAL_SETS; set++) {
                let setQuestions = [];
                
                // 15 Long Questions for this set
                for (let i = 0; i < 15; i++) {
                    const ch = rInt(1, 12);
                    const q = generators[ch](true); // true = long
                    q.id = qId++;
                    q.set = set;
                    q.chapterId = ch;
                    setQuestions.push(q);
                    longCount++;
                }

                // 35 Short Questions for this set
                for (let i = 0; i < 35; i++) {
                    const ch = rInt(1, 12);
                    const q = generators[ch](false); // false = short
                    q.id = qId++;
                    q.set = set;
                    q.chapterId = ch;
                    setQuestions.push(q);
                    shortCount++;
                }
                
                // Shuffle set slightly so long questions aren't always first
                setQuestions.sort(() => Math.random() - 0.5);
                allQ = allQ.concat(setQuestions);
            }
            
            // Final Safety Check (Unlikely to fail logic, but ensures robust constraints)
            // If counts are off (due to randomness logic errors), we would fix here, but the loops guarantee 150/350.
            return allQ;
        }

        // --- UI RENDERING ---
        function renderQuestions() {
            state.questions = generateAllQuestions();
            const container = document.getElementById('main-container');
            container.innerHTML = ''; // Clear

            // Update Max Score
            state.totalMaxScore = state.questions.reduce((sum, q) => sum + q.marks, 0);
            updateScorePanel();

            // Render Sets
            for (let s = 1; s <= TOTAL_SETS; s++) {
                const setDiv = document.createElement('div');
                setDiv.className = 'set-section';
                setDiv.id = `set-${s}`;
                
                // Set Header
                const setHead = document.createElement('div');
                setHead.className = 'set-header';
                setHead.innerHTML = `<h2>Practice Set ${s}</h2><p>Questions ${(s-1)*50 + 1} to ${s*50}</p>`;
                setDiv.appendChild(setHead);

                // Filter questions for this set
                const setQs = state.questions.filter(q => q.set === s);
                
                setQs.forEach((q, index) => {
                    const card = document.createElement('div');
                    card.className = `question-card ${getDifficultyClass(q)}`;
                    card.innerHTML = buildQuestionHTML(q, index + 1 + ((s-1)*50));
                    setDiv.appendChild(card);
                });

                container.appendChild(setDiv);
            }
        }

        function getDifficultyClass(q) {
            // Simple mapping for visual variety based on marks/type
            if (q.type === 'long') return 'advanced';
            if (q.marks > 1) return 'medium';
            return 'basic';
        }

        function buildQuestionHTML(q, displayNum) {
            let inputHTML = '';
            
            if (q.type === 'long') {
                inputHTML = `<textarea id="input-${q.id}" placeholder="Type your answer here..."></textarea>`;
            } else {
                inputHTML = `<input type="text" id="input-${q.id}" placeholder="Answer..." autocomplete="off">`;
            }

            return `
                <div class="q-header">
                    <span>Q${displayNum} • ${CHAPTERS[q.chapterId-1].name}</span>
                    <span>${q.marks} Marks</span>
                </div>
                <div class="q-text">${q.text}</div>
                <div class="q-input-area">
                    ${inputHTML}
                </div>
                <button class="check-btn" onclick="checkAnswer(${q.id})" id="btn-${q.id}">Check Answer</button>
                <div class="feedback" id="feed-${q.id}"></div>
            `;
        }

        // --- INTERACTION LOGIC ---
        window.checkAnswer = function(id) {
            const q = state.questions.find(x => x.id === id);
            const inputEl = document.getElementById(`input-${id}`);
            const feedEl = document.getElementById(`feed-${id}`);
            const btnEl = document.getElementById(`btn-${id}`);
            
            if (!inputEl.value.trim()) {
                alert("Please write an answer first!");
                return;
            }

            const userVal = inputEl.value.trim().toLowerCase();
            let isCorrect = false;
            let earnedMarks = 0;
            let feedbackText = '';

            // Disable button
            btnEl.disabled = true;
            btnEl.style.opacity = "0.5";
            inputEl.disabled = true;

            // Logic
            if (q.type === 'short') {
                // Exact or approximate match for numbers
                const cleanAns = q.answer.toString().toLowerCase();
                if (userVal === cleanAns || userVal.replace(/\s/g, '') === cleanAns.replace(/\s/g, '')) {
                    isCorrect = true;
                    earnedMarks = q.marks;
                    feedbackText = `Excellent! ⭐ (+${q.marks})`;
                } else {
                    isCorrect = false;
                    feedbackText = `Try Again. Correct answer: ${q.answer}`;
                }
            } else {
                // LONG ANSWER LOGIC
                // Check keywords
                const foundKeywords = q.keywords.filter(k => userVal.includes(k.toLowerCase()));
                const coverage = foundKeywords.length / q.keywords.length;
                
                if (coverage > 0.3) { // 30% keywords found is pass for Class 4
                    isCorrect = true;
                    earnedMarks = q.marks;
                    feedbackText = `Well done! You covered key concepts. (+${q.marks})<br>Model Answer: ${q.model}`;
                } else {
                    isCorrect = false;
                    feedbackText = `Good try! But you missed some key points.<br><b>Look for:</b> ${q.keywords.join(', ')}.<br><b>Model Answer:</b> ${q.model}`;
                }
            }

            // Update State
            state.totalAttempted++;
            if (isCorrect) {
                state.correct++;
                state.totalScore += earnedMarks;
                feedEl.className = 'feedback correct';
            } else {
                state.wrong++;
                feedEl.className = 'feedback wrong';
            }

            feedEl.innerHTML = feedbackText;
            feedEl.style.display = 'block';

            updateScorePanel();
        };

        function updateScorePanel() {
            document.getElementById('attempted-count').innerText = state.totalAttempted;
            document.getElementById('correct-count').innerText = state.correct;
            document.getElementById('wrong-count').innerText = state.wrong;
            document.getElementById('score-total').innerText = state.totalScore + " / " + state.totalMaxScore;
            
            const acc = state.totalAttempted === 0 ? 0 : Math.round((state.correct / state.totalAttempted) * 100);
            document.getElementById('accuracy').innerText = acc;
        }

        window.scrollToSet1 = function() {
