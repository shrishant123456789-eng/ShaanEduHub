<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 - ShanEduHub</title>
    
    <!-- Google Fonts: Fredoka for English (handwritten style, non-cursive), Kalam for Hindi -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Color Palette */
            --color-hindi: #FF6B6B;      /* Red/Pink */
            --color-english: #4D96FF;    /* Blue */
            --color-maths: #6BCB77;      /* Green */
            --color-evs: #A8E6CF;        /* Pastel Green */
            --color-gk: #FFD93D;         /* Yellow/Golden */
            --color-computer: #4EFAFA;   /* Cyan */
            --color-moral: #FF9F45;      /* Orange */
            --color-art: #C780FA;        /* Purple */
            --text-dark: #2d3436;
            --bg-white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-white);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* No horizontal scroll */
        }

        /* --- Header Section --- */
        header {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); /* Fallback */
            background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%); /* Pastel Gradient */
            padding: 2rem 1rem;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
            animation: fadeInDown 1s ease-out;
        }

        header h1 {
            font-family: 'Kalam', cursive;
            font-size: 3.5rem;
            color: #d63031;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        header p {
            font-size: 1.4rem;
            color: #2d3436;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* --- Main Content --- */
        main {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 4rem 1rem; /* Bottom padding for footer space */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Grid Layout */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(1, 1fr); /* Mobile: 1 column */
            gap: 20px;
            width: 100%;
            margin-bottom: 30px;
        }

        @media (min-width: 500px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr); /* Tablet: 2 columns */
            }
        }

        @media (min-width: 850px) {
            .grid-container {
                grid-template-columns: repeat(3, 1fr); /* Desktop: 3 columns */
            }
        }

        @media (min-width: 1100px) {
            .grid-container {
                grid-template-columns: repeat(4, 1fr); /* Large Desktop: 4 columns */
            }
        }

        /* --- Subject Buttons --- */
        .subject-btn {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 160px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            position: relative;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1), 0 6px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0; /* Hidden initially for animation */
            border: 4px solid white;
        }

        /* Staggered animation delays handled in JS or simplified CSS nth-child */
        .subject-btn:nth-child(1) { animation-delay: 0.1s; }
        .subject-btn:nth-child(2) { animation-delay: 0.2s; }
        .subject-btn:nth-child(3) { animation-delay: 0.3s; }
        .subject-btn:nth-child(4) { animation-delay: 0.4s; }
        .subject-btn:nth-child(5) { animation-delay: 0.5s; }
        .subject-btn:nth-child(6) { animation-delay: 0.6s; }
        .subject-btn:nth-child(7) { animation-delay: 0.7s; }
        .subject-btn:nth-child(8) { animation-delay: 0.8s; }

        /* Button Hover Effects */
        .subject-btn:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 0 10px 10px rgba(0,0,0,0.22);
            z-index: 2;
        }

        .subject-btn:active {
            transform: scale(0.98);
        }

        /* Icon Styling */
        .subject-btn i {
            font-size: 3rem;
            margin-bottom: 10px;
            filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.1));
        }

        /* Text Styling */
        .subject-btn span {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            line-height: 1.2;
        }

        /* Individual Colors */
        .btn-hindi { background-color: var(--color-hindi); }
        .btn-english { background-color: var(--color-english); }
        .btn-maths { background-color: var(--color-maths); }
        .btn-evs { 
            background-color: var(--color-evs); 
            color: #2d3436; /* Dark text for light background */
        }
        .btn-evs i, .btn-evs span { text-shadow: none; } /* Remove shadow for legibility */
        
        .btn-gk { 
            background-color: var(--color-gk); 
            color: #2d3436;
        }
        .btn-gk i, .btn-gk span { text-shadow: none; }

        .btn-computer { 
            background-color: var(--color-computer); 
            color: #2d3436;
        }
        .btn-computer i, .btn-computer span { text-shadow: none; }

        .btn-moral { background-color: var(--color-moral); }
        .btn-art { background-color: var(--color-art); }

        /* --- Fun With All Subjects Button --- */
        .fun-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            animation: fadeInUp 1s ease-out forwards;
            animation-delay: 0.9s;
            opacity: 0;
        }

        .btn-fun {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            animation: rainbow-bg 20s linear infinite, border-pulse 2s infinite;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            position: relative;
            z-index: 1;
            transition: transform 0.3s;
        }

        .btn-fun:hover {
            transform: scale(1.05);
        }

        .btn-fun i {
            font-size: 2.2rem;
        }

        /* Tooltip style */
        .subject-btn::after {
            content: "Click to Learn";
            position: absolute;
            bottom: 10px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .subject-btn:hover::after {
            opacity: 1;
        }

        /* --- Footer --- */
        footer {
            background-color: #f1f2f6;
            padding: 1.5rem;
            text-align: center;
            border-top: 2px solid #e0e0e0;
            margin-top: auto;
        }

        footer p {
            font-size: 1.1rem;
            color: #7f8fa6;
            font-weight: 600;
            margin: 5px 0;
        }

        footer span {
            color: #FF6B6B;
        }

        /* --- Animations --- */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes border-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            header h1 { font-size: 2.5rem; }
            header p { font-size: 1rem; }
            .subject-btn { height: 120px; }
            .subject-btn span { font-size: 1.5rem; }
            .subject-btn i { font-size: 2.2rem; }
            .btn-fun { font-size: 1.5rem; padding: 20px; flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <h1>शालिनी दोभा</h1>
        <p>Learning is the key to your imagination</p>
    </header>

    <!-- Main Content -->
    <main>
        <div class="grid-container">
            <!-- Hindi -->
            <a href="class4-hindi.html" class="subject-btn btn-hindi" aria-label="Learn Hindi">
                <i class="fas fa-om"></i>
                <span>हिंदी</span>
            </a>

            <!-- English -->
            <a href="class4-english.html" class="subject-btn btn-english" aria-label="Learn English">
                <i class="fas fa-language"></i>
                <span>English</span>
            </a>

            <!-- Maths -->
            <a href="class4-maths.html" class="subject-btn btn-maths" aria-label="Learn Maths">
                <i class="fas fa-calculator"></i>
                <span>Maths</span>
            </a>

            <!-- EVS -->
            <a href="class4-evs.html" class="subject-btn btn-evs" aria-label="Learn EVS">
                <i class="fas fa-leaf"></i>
                <span>EVS</span>
            </a>

            <!-- GK -->
            <a href="class4-gk.html" class="subject-btn btn-gk" aria-label="Learn General Knowledge">
                <i class="fas fa-lightbulb"></i>
                <span>GK</span>
            </a>

            <!-- Computer -->
            <a href="class4-computer.html" class="subject-btn btn-computer" aria-label="Learn Computer">
                <i class="fas fa-laptop-code"></i>
                <span>Computer</span>
            </a>

            <!-- Moral Teaching -->
            <a href="class4-moral.html" class="subject-btn btn-moral" aria-label="Learn Moral Teaching">
                <i class="fas fa-heart"></i>
                <span>Moral Teaching</span>
            </a>

            <!-- Art & Craft -->
            <a href="class4-art.html" class="subject-btn btn-art" aria-label="Learn Art and Craft">
                <i class="fas fa-palette"></i>
                <span>Art & Craft</span>
            </a>
        </div>

        <!-- Fun with All Subjects Button -->
        <div class="fun-container">
            <a href="class4-fun-with-all-subject.html" class="btn-fun">
                <i class="fas fa-gamepad"></i>
                <span>Fun with All Subjects</span>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Designed & Created by <span>SHRISHANT YADAV</span></p>
        <p>ShanEduHub</p>
    </footer>

    <script>
        // Interactive Script
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.subject-btn, .btn-fun');

            buttons.forEach(button => {
                // Add click event for slight interaction feedback before navigation
                // Note: default <a> tag behavior handles the actual navigation
                button.addEventListener('click', function(e) {
                    // This creates a ripple effect or logging if needed in future
                    console.log(`Navigating to: ${this.getAttribute('href')}`);
                });

                // Add mouse enter sound effect placeholder (Optional - commented out for silence)
                // button.addEventListener('mouseenter', () => { /* Play sound */ });
            });
        });
    </script>
</body>
</html>
