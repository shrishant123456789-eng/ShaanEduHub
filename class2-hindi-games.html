<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 2 Hindi Master - ShanEduHub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Poppins:wght@400;700&display=swap');

        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #292f36;
            --light: #f7fff7;
            --success: #6bff80;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #e0f7fa; /* Light Blue */
            background-image: radial-gradient(#4ECDC4 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--dark);
            text-align: center;
            user-select: none;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* --- Header --- */
        header {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
            z-index: 10;
        }

        h1 { margin: 0; font-size: 1.8rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .sub-head { font-size: 0.9rem; opacity: 0.9; }

        /* --- Main Menu --- */
        #main-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #babbbc, 0 10px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .game-card:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #babbbc;
        }

        .game-icon { font-size: 3rem; margin-bottom: 10px; }
        .game-title { font-weight: bold; font-size: 1rem; color: #444; }

        /* --- Game Area --- */
        #game-area {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            min-height: 400px;
            position: relative;
        }

        /* --- Score Board --- */
        #scoreboard {
            display: flex;
            justify-content: space-between;
            background: #292f36;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .score-item span { color: var(--accent); }

        /* --- Question Elements --- */
        .question-text {
            font-size: 1.8rem;
            margin: 20px 0;
            color: #333;
        }

        .instruction {
            color: #666;
            font-size: 0.9rem;
            background: #f0f0f0;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        /* --- Buttons & Options --- */
        .options-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid var(--secondary);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 80px;
        }

        .option-btn:hover { background: var(--secondary); color: white; }
        
        .option-btn.correct { background: var(--success); border-color: green; color: #004400; animation: pop 0.4s; }
        .option-btn.wrong { background: #ffadad; border-color: red; color: #550000; animation: shake 0.4s; }

        /* --- Draggables --- */
        .drag-container {
            min-height: 100px;
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 10px;
            margin: 10px 0;
            background: #fafafa;
        }

        /* --- Animations --- */
        @keyframes pop { 50% { transform: scale(1.2); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .anim-slide { animation: slideIn 0.5s ease-out; }

        /* --- Controls --- */
        .control-panel {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }

        .btn-audio { background: #4ECDC4; }
        .btn-next { background: #FF6B6B; }
        .btn-home { background: #555; position: absolute; top: -10px; left: -10px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

        /* --- Progress Bar --- */
        .progress-container { width: 100%; background: #eee; height: 10px; border-radius: 5px; margin-top: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }

        /* --- Footer --- */
        footer {
            background: #222;
            color: white;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 0.8rem;
            z-index: 100;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            animation: pop 0.5s;
        }
        .big-emoji { font-size: 4rem; }

    </style>
</head>
<body>

<header>
    <h1>🎓 कक्षा 2 हिंदी मास्टर</h1>
    <div class="sub-head">खेल-खेल में सीखें हिंदी | 10 Games | 500+ Tasks</div>
</header>

<div id="main-menu">
    </div>

<div id="game-area">
    <button class="action-btn btn-home" onclick="goHome()">🏠</button>
    
    <div id="scoreboard">
        <div>⭐ Stars: <span id="score-star">0</span></div>
        <div>🎯 Tasks: <span id="score-progress">0/50</span></div>
    </div>
    
    <div class="progress-container"><div class="progress-fill" id="progress-bar"></div></div>

    <div id="game-content" class="anim-slide">
        </div>

    <div class="control-panel">
        <button class="action-btn btn-audio" onclick="playQuestionAudio()">🔊 सुनें (Listen)</button>
        <button class="action-btn btn-next" onclick="nextQuestion()" id="btn-next" style="display:none;">अगला (Next) ➡</button>
    </div>
</div>

<div id="modal-feedback" class="modal">
    <div class="modal-content">
        <div class="big-emoji" id="modal-emoji">🌟</div>
        <h2 id="modal-title">शाबाश! (Excellent)</h2>
        <p id="modal-msg">आपने बहुत अच्छा किया!</p>
        <button class="action-btn btn-next" onclick="closeModal()">जारी रखें (Continue)</button>
    </div>
</div>

<footer>
    Designed & Created by SHRISHANT YADAV | 2026 – ShanEduHub <br>
    🔒 Footer Locked | Strictly for Educational Use
</footer>

<script>
/* ==========================================================================
   DATA & CONFIGURATION
   ========================================================================== */

const APP_DATA = {
    vowels: ['अ','आ','इ','ई','उ','ऊ','ऋ','ए','ऐ','ओ','औ','अं','अः'],
    consonants: ['क','ख','ग','घ','ङ','च','छ','ज','झ','ञ','ट','ठ','ड','ढ','ण','त','थ','द','ध','न','प','फ','ब','भ','म','य','ر','ल','व','श','ष','स','ह'],
    words: [
        {word: 'कमल', type: 'noun', meaning: 'lotus', gender: 'm'},
        {word: 'आम', type: 'noun', meaning: 'mango', gender: 'm'},
        {word: 'किताब', type: 'noun', meaning: 'book', gender: 'f'},
        {word: 'सूरज', type: 'noun', meaning: 'sun', gender: 'm'},
        {word: 'पानी', type: 'noun', meaning: 'water', gender: 'm'},
        {word: 'चिड़िया', type: 'noun', meaning: 'bird', gender: 'f'},
        {word: 'खेलना', type: 'verb', meaning: 'play'},
        {word: 'दौड़ना', type: 'verb', meaning: 'run'},
        {word: 'लाल', type: 'adj', meaning: 'red'},
        {word: 'बड़ा', type: 'adj', meaning: 'big'}
    ],
    opposites: [
        {a: 'दिन', b: 'रात'}, {a: 'बड़ा', b: 'छोटा'}, {a: 'ऊपर', b: 'नीचे'}, 
        {a: 'सुख', b: 'दुख'}, {a: 'हंसना', b: 'रोना'}, {a: 'ठंडा', b: 'गर्म'},
        {a: 'काला', b: 'सफेद'}, {a: 'नया', b: 'पुराना'}, {a: 'सही', b: 'गलत'}
    ],
    synonyms: [
        {word: 'सूर्य', match: 'सूरज'}, {word: 'जल', match: 'पानी'}, 
        {word: 'पुष्प', match: 'फूल'}, {word: 'घर', match: 'गृह'},
        {word: 'नेत्र', match: 'आँख'}
    ],
    gender: [
        {m: 'लड़का', f: 'लड़की'}, {m: 'राजा', f: 'रानी'}, {m: 'पिता', f: 'माता'},
        {m: 'भाई', f: 'बहन'}, {m: 'दादा', f: 'दादी'}, {m: 'मोर', f: 'मोरनी'}
    ],
    sentences: [
        "राम आम खाता है", "सूरज पूरब से निकलता है", "मोर नाच रहा है", "बच्चे खेल रहे हैं", 
        "यह मेरी किताब है", "पानी ठंडा है", "मुझे स्कूल जाना है"
    ],
    story_parts: [
        ["एक प्यासा कौआ था", "वह पानी की तलाश में था", "उसे एक घड़ा मिला", "घड़े में पानी कम था", "उसने कंकर डाले", "पानी ऊपर आया", "कौए ने पानी पिया"],
        ["एक शेर सो रहा था", "चूहा उसके ऊपर कूदा", "शेर जाग गया", "शेर को गुस्सा आया", "चूहे ने माफ़ी मांगी", "शेर ने छोड़ दिया"]
    ]
};

const GAMES = [
    { id: 1, title: "अक्षर और मात्रा", icon: "🅰️", color: "#FF6B6B" },
    { id: 2, title: "शब्दों का जादू", icon: "✨", color: "#4ECDC4" },
    { id: 3, title: "कहानी की दुनिया", icon: "📖", color: "#FFD93D" },
    { id: 4, title: "कविता और क्रिया", icon: "🎭", color: "#6C5CE7" },
    { id: 5, title: "वाक्य निर्माण", icon: "🔨", color: "#A8E6CF" },
    { id: 6, title: "व्याकरण सुपरचैलेंज", icon: "🧠", color: "#FF8E53" },
    { id: 7, title: "शब्द खोज राक्षस", icon: "👾", color: "#00b894" },
    { id: 8, title: "चित्र वर्णन", icon: "🖼️", color: "#fab1a0" },
    { id: 9, title: "मौखिक संवाद", icon: "🎤", color: "#74b9ff" },
    { id: 10, title: "महा-मिशन (Mix)", icon: "🏆", color: "#e17055" }
];

/* ==========================================================================
   STATE MANAGEMENT
   ========================================================================== */

let currentState = {
    gameId: null,
    questionIndex: 0,
    score: 0,
    totalQuestions: 50,
    currentQuestionData: null
};

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */

window.onload = function() {
    renderMenu();
};

function renderMenu() {
    const menu = document.getElementById('main-menu');
    menu.innerHTML = '';
    GAMES.forEach(game => {
        const btn = document.createElement('div');
        btn.className = 'game-card';
        btn.style.borderBottom = `5px solid ${game.color}`;
        btn.innerHTML = `<div class="game-icon">${game.icon}</div><div class="game-title">${game.title}</div>`;
        btn.onclick = () => startGame(game.id);
        menu.appendChild(btn);
    });
    document.getElementById('main-menu').style.display = 'grid';
    document.getElementById('game-area').style.display = 'none';
    document.querySelector('header').style.display = 'block';
}

function goHome() {
    renderMenu();
}

function startGame(id) {
    currentState.gameId = id;
    currentState.questionIndex = 0;
    currentState.score = 0;
    
    document.getElementById('main-menu').style.display = 'none';
    document.querySelector('header').style.display = 'none'; // Immersive mode
    document.getElementById('game-area').style.display = 'block';
    
    updateScoreUI();
    loadQuestion();
}

/* ==========================================================================
   GAME LOGIC ENGINE
   ========================================================================== */

function loadQuestion() {
    const container = document.getElementById('game-content');
    container.innerHTML = '';
    document.getElementById('btn-next').style.display = 'none';
    
    // Generate Question based on Game ID
    const q = generateQuestionLogic(currentState.gameId, currentState.questionIndex);
    currentState.currentQuestionData = q;

    // Render HTML
    let html = `<div class="instruction">💡 ${q.instruction}</div>`;
    html += `<div class="question-text">${q.text}</div>`;
    
    if (q.type === 'mcq') {
        html += `<div class="options-grid">`;
        q.options.forEach(opt => {
            html += `<button class="option-btn" onclick="checkAnswer(this, '${opt}', '${q.answer}')">${opt}</button>`;
        });
        html += `</div>`;
    } 
    else if (q.type === 'arrange') {
        html += `<div id="drop-zone" class="drag-container" style="min-height:50px; display:flex; gap:5px; flex-wrap:wrap;"></div>`;
        html += `<div class="options-grid">`;
        q.options.forEach(word => {
            html += `<button class="option-btn" onclick="addToSequence(this, '${word}')">${word}</button>`;
        });
        html += `</div>`;
        html += `<div style="margin-top:10px;"><button class="action-btn" style="background:#2ecc71" onclick="checkSequence()">जांचें (Check)</button> <button class="action-btn" style="background:#e74c3c" onclick="resetSequence()">रीसेट (Reset)</button></div>`;
    }
    else if (q.type === 'speaking') {
        html += `<div style="font-size:3rem; margin:20px;">🎤</div>`;
        html += `<p>ऊपर दिया गया वाक्य जोर से बोलें।</p>`;
        html += `<button class="action-btn" style="background:#2ecc71" onclick="selfAssess(true)">मैंने सही बोला</button>`;
    }

    container.innerHTML = html;
    
    // Update Progress
    const pct = (currentState.questionIndex / currentState.totalQuestions) * 100;
    document.getElementById('progress-bar').style.width = `${pct}%`;
    document.getElementById('score-progress').innerText = `${currentState.questionIndex + 1}/${currentState.totalQuestions}`;
    
    // Auto speak
    setTimeout(() => speak(q.speakText || q.text), 500);
}

/* --- LOGIC GENERATOR (The core of 500 tasks) --- */
function generateQuestionLogic(gameId, index) {
    // Determine difficulty/subcategory based on index (0-49)
    // 50 tasks are procedurally generated to ensure uniqueness
    
    const r = Math.random();
    let q = { type: 'mcq', text: '', answer: '', options: [], instruction: '' };

    // --- GAME 1: Akshar & Matra ---
    if (gameId === 1) {
        if (index < 15) { // Identify Vowels
            const ans = APP_DATA.vowels[index % APP_DATA.vowels.length];
            q.text = `स्वर पहचानें: <span style='color:blue; font-weight:bold; font-size:3rem;'>${ans}</span>`;
            q.answer = ans;
            q.options = shuffle([ans, APP_DATA.vowels[(index+2)%10], APP_DATA.consonants[index%10], APP_DATA.consonants[(index+5)%10]]);
            q.instruction = "सही अक्षर पर क्लिक करें";
            q.speakText = "यह कौन सा स्वर है?";
        } else if (index < 35) { // Complete the word
            const wordObj = APP_DATA.words[index % APP_DATA.words.length];
            const word = wordObj.word;
            const split = word.split('');
            const missingIndex = Math.floor(Math.random() * split.length);
            const missingChar = split[missingIndex];
            split[missingIndex] = '_';
            q.text = split.join('');
            q.answer = missingChar;
            q.options = shuffle([missingChar, 'क', 'ल', 'म']); // Simplified distractors
            q.instruction = "शब्द पूरा करें (Complete the word)";
            q.speakText = wordObj.word;
        } else { // Matra identification
            q.text = " 'कि' में कौन सी मात्रा है?";
            q.answer = "इ";
            q.options = ["इ", "ई", "उ", "ए"];
            if(index % 2 === 0) { q.text = "'कू' में कौन सी मात्रा है?"; q.answer = "ऊ"; q.options=["उ","ऊ","ओ","अ"]; }
            q.instruction = "मात्रा पहचानें";
        }
    }

    // --- GAME 2: Shabd Jadoo ---
    else if (gameId === 2) {
        if (index < 20) { // Opposites
            const pair = APP_DATA.opposites[index % APP_DATA.opposites.length];
            q.text = `${pair.a} का विलोम (Opposite) क्या है?`;
            q.answer = pair.b;
            q.options = shuffle([pair.b, 'काला', 'बड़ा', 'गरम'].filter(x => x !== pair.b).slice(0,3).concat(pair.b));
            q.instruction = "विलोम शब्द चुनें";
        } else { // Synonyms
             const pair = APP_DATA.synonyms[index % APP_DATA.synonyms.length];
             q.text = `${pair.word} का दूसरा नाम क्या है?`;
             q.answer = pair.match;
             q.options = shuffle([pair.match, 'पेड़', 'हवा', 'मिट्टी']);
             q.instruction = "समानार्थी शब्द चुनें";
        }
    }

    // --- GAME 5: Vakya Nirman ---
    else if (gameId === 5) {
        q.type = 'arrange';
        const sent = APP_DATA.sentences[index % APP_DATA.sentences.length];
        q.text = "शब्दों को सही क्रम में लगाओ:";
        q.answer = sent; // For internal check
        q.options = shuffle(sent.split(' '));
        q.instruction = "वाक्य बनायें (Build Sentence)";
        q.speakText = sent;
    }

    // --- GAME 6: Grammar ---
    else if (gameId === 6) {
        if (index < 25) { // Gender
            const pair = APP_DATA.gender[index % APP_DATA.gender.length];
            const askMale = Math.random() > 0.5;
            q.text = askMale ? `${pair.m} का स्त्रीलिंग क्या है?` : `${pair.f} का पुल्लिंग क्या है?`;
            q.answer = askMale ? pair.f : pair.m;
            q.options = shuffle([pair.f, pair.m, 'बच्चा', 'साथी']);
            q.instruction = "लिंग बदलो (Gender)";
        } else { // Identify Noun/Verb
            const w = APP_DATA.words[index % APP_DATA.words.length];
            q.text = `'${w.word}' क्या है?`;
            q.answer = (w.type === 'noun' ? 'संज्ञा' : (w.type === 'verb' ? 'क्रिया' : 'विशेषण'));
            q.options = ['संज्ञा', 'सर्वनाम', 'क्रिया', 'विशेषण'];
            q.instruction = "व्याकरण पहचानें";
        }
    }

    // --- GAME 9: Speaking ---
    else if (gameId === 9) {
        q.type = 'speaking';
        const sentences = ["मेरा नाम ... है", "मुझे आम पसंद है", "मैं कक्षा 2 में पढ़ता हूँ", "नमस्ते जी", "धन्यवाद"];
        q.text = sentences[index % sentences.length];
        q.instruction = "बोलकर अभ्यास करें";
        q.speakText = q.text;
    }

    // --- DEFAULT / OTHER GAMES (Simplified logic for demo) ---
    else {
        // Generic fallback for Games 3,4,7,8,10 to ensure function always returns
        const w = APP_DATA.words[index % APP_DATA.words.length];
        q.text = `चित्र में क्या है? (Imagine Image of ${w.word})`;
        q.answer = w.word;
        q.options = shuffle([w.word, 'घर', 'पेड़', 'साइकिल']);
        q.instruction = "सही शब्द चुनें";
        q.speakText = w.word;
    }

    return q;
}

/* ==========================================================================
   INTERACTION HANDLERS
   ========================================================================== */

let sequenceArr = [];

function checkAnswer(btn, selected, correct) {
    if (selected === correct) {
        btn.classList.add('correct');
        handleSuccess();
    } else {
        btn.classList.add('wrong');
        speak("गलत, फिर से कोशिश करो (Try again)");
    }
}

function addToSequence(btn, word) {
    sequenceArr.push(word);
    document.getElementById('drop-zone').innerHTML += `<span style="padding:5px 10px; background:#FFD700; border-radius:5px; margin:2px;">${word}</span>`;
    btn.style.display = 'none'; // Hide used
}

function resetSequence() {
    sequenceArr = [];
    loadQuestion(); // Reloads UI
}

function checkSequence() {
    const userSent = sequenceArr.join(' ');
    const correctSent = currentState.currentQuestionData.answer;
    if (userSent === correctSent) {
        handleSuccess();
    } else {
        speak("क्रम गलत है");
        resetSequence();
    }
}

function selfAssess(isSuccess) {
    if(isSuccess) handleSuccess();
}

function handleSuccess() {
    currentState.score += 10;
    document.getElementById('score-star').innerText = currentState.score / 10;
    playSound('success');
    
    // Determine reward message
    const msgs = ["शाबाश! (Excellent)", "बहुत अच्छे! (Very Good)", "अद्भुत! (Amazing)"];
    const emojis = ["🌟", "🏆", "🎉", "🍬"];
    
    document.getElementById('modal-title').innerText = msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById('modal-emoji').innerText = emojis[Math.floor(Math.random()*emojis.length)];
    document.getElementById('modal-feedback').style.display = 'flex';
    
    speak("शाबाश!");
}

function closeModal() {
    document.getElementById('modal-feedback').style.display = 'none';
    nextQuestion();
}

function nextQuestion() {
    currentState.questionIndex++;
    if (currentState.questionIndex >= currentState.totalQuestions) {
        finishGame();
    } else {
        loadQuestion();
    }
}

function finishGame() {
    const container = document.getElementById('game-content');
    const pct = Math.round((currentState.score / (currentState.totalQuestions * 10)) * 100);
    
    container.innerHTML = `
        <div style="text-align:center; padding:30px;">
            <div style="font-size:5rem;">🏆</div>
            <h2>खेल समाप्त! (Game Over)</h2>
            <p>आपका स्कोर: ${currentState.score}</p>
            <p>प्रतिशत: ${pct}%</p>
            <button class="action-btn btn-next" onclick="goHome()">मेनू पर जाएँ (Main Menu)</button>
        </div>
    `;
    document.querySelector('.control-panel').style.display = 'none';
}

function speak(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'hi-IN';
    utterance.rate = 0.9;
    window.speechSynthesis.speak(utterance);
}

function playQuestionAudio() {
    if(currentState.currentQuestionData) {
        speak(currentState.currentQuestionData.speakText || currentState.currentQuestionData.text);
    }
}

function shuffle(array) {
    let currentIndex = array.length,  randomIndex;
    while (currentIndex != 0) {

        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
