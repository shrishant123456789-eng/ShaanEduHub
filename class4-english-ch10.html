    <style>
        /* GLOBAL TYPOGRAPHY & RESET */
        @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');

        :root {
            --bg-color: #fff9e6; /* Paper Yellow */

        }

        * {

            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Patrick Hand', 'Comic Sans MS', 'Chalkboard SE', sans-serif;

            color: var(--text-color);

            font-weight: 700; /* STRICT RULE: ALL TEXT BOLD */

            overflow-x: hidden;
            font-size: 18px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #4834d4;
            transition: transform 0.1s;
            margin-top: 10px;
            display: inline-block;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-secondary {
            background-color: var(--accent-color);
            color: #2d3436;
            box-shadow: 0 4px 0 #e17055;
        }

        .section-title {
            text-align: center;
            font-size: 2rem;
            color: var(--primary-color);
            margin: 40px 0 20px;

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

            position: sticky;
            top: 10px;
            z-index: 100;
            background: var(--card-bg);
            border: 3px solid var(--text-color);
            border-radius: 15px;
            padding: 10px;
            margin: 20px auto;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            max-width: 90%;
            flex-wrap: wrap;
        }

        .score-item {
            text-align: center;
            padding: 5px 10px;
        }

        .score-value {
            font-size: 1.5rem;
            color: var(--primary-color);
            display: block;
        }

        .score-label {
            font-size: 0.9rem;
            color: #636e72;
        }

        /* NOTES SECTION */
        .note-card {
            background: var(--card-bg);
            border: 2px dashed var(--primary-color);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.05);
        }

        .note-topic {
            background: var(--accent-color);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .definition-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 5px solid #2196f3;
        }

            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 5px solid #4caf50;
        }

        .memory-tip {
            background: #fff3e0;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-style: italic;
        }

        .image-placeholder {
            width: 100%;
            height: 150px;
            background-color: #dfe6e9;
            border: 2px solid #b2bec3;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            color: #636e72;
            text-align: center;
            padding: 10px;
        }

        /* QUESTIONS */
        .question-card {
            background: white;
            border: 2px solid var(--text-color);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }

        .q-tag {
            background: var(--primary-color);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            position: absolute;
            top: -10px;
            left: 10px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.2s;
        }

        .option-btn:hover {
            background: #f1f2f6;
            border-color: var(--primary-color);
        }

        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .feedback-correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .feedback-wrong {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* PRACTICE SECTION */
        #practice-container {
            min-height: 400px;
        }

        /* LONG ANSWER */
        .long-answer-area {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 2px solid #b2bec3;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            margin: 10px 0;
            resize: vertical;
        }

        /* REVISION */
        .revision-point {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .revision-bullet {
            color: var(--primary-color);
            margin-right: 10px;
            font-size: 1.5rem;
            line-height: 1;
        }

        /* FOOTER */
        footer {
            background: #2d3436;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            font-size: 0.9rem;
        }

        /* MOBILE OPTIMIZATIONS */
        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .hidden { display: none; }
    </style>
</head>

    <script>

                    img: "Picture of a drum and musical notes showing rhythm."

                {

            const practiceQuestions = [
                // TOPIC 1: Rhyme & Rhythm (1-8)

                { t: "MCQ", q: "Which is a poem activity?", o: ["Drawing the scene", "Sleeping"], a: "Drawing the scene", e: "Visualizing helps understanding." },
                { t: "Fill", q: "Drawing a picture helps us ______ the poem.", a: "visualize", e: "See it in our mind." },
                { t: "TF", q: "You cannot sing a poem.", a: "False", e: "Songs are just musical poems." },
                { t: "OneWord", q: "Changing a poem into a play.", a: "adaptation", e: "Adapting the text." },
                { t: "Thinking", q: "Finding new rhymes is:", o: ["Boring", "Creative"], a: "Creative", e: "It builds vocabulary." },
                { t: "Short", q: "Can we dance to a poem?", a: "yes", e: "Rhythm makes it danceable." },

                // TOPIC 8: Plays (57-63)
                { t: "Fill", q: "The text actors read is a ______.", a: "script", e: "The written play." },
                { t: "MCQ", q: "People in a play are called:", o: ["Characters", "Audience"], a: "Characters", e: "The roles played by actors." },
                { t: "OneWord", q: "What comes before a line in a script?", a: "name", e: "Character Name: Dialogue." },
                { t: "TF", q: "In a play, you read the names aloud.", a: "False", e: "You only say the dialogue." },
                { t: "Visual", q: "🎭 What art form is this?", o: ["Painting", "Drama"], a: "Drama", e: "Masks of comedy and tragedy." },
                { t: "Thinking", q: "Without dialogue, it is a:", o: ["Mime", "Song"], a: "Mime", e: "Acting without words." },
                { t: "MCQ", q: "A short play is a:", o: ["Skit", "Novel"], a: "Skit", e: "A short performance." },

                // TOPIC 9: Expressions (64-70)
                { t: "MCQ", q: "To show anger, you:", o: ["Smile", "Frown"], a: "Frown", e: "Eyebrows down, mouth down." },
                { t: "Fill", q: "Body language is part of ______.", a: "acting", e: "How you move." },
                { t: "TF", q: "Voice and face must match.", a: "True", e: "You can't say 'I'm happy' while crying." },
                { t: "Visual", q: "😢 This emotion is:", o: ["Joy", "Sadness"], a: "Sadness", e: "Tears and frown." },
                { t: "Visual", q: "😡 This emotion is:", o: ["Anger", "Fear"], a: "Anger", e: "Red face, angry eyes." },
                { t: "Thinking", q: "If you win a prize, you show:", o: ["Excitement", "Boredom"], a: "Excitement", e: "Jumping, smiling." },
                { t: "OneWord", q: "Showing feelings without words.", a: "gesture", e: "Or expression." }
            ];

            // --- DATA: LONG QUESTIONS (10 Exact) ---
            const longQuestions = [
                {
                    id: "l1",
                    q: "Explain how 'The Little Seed' shows the importance of teamwork in nature.",
                    keywords: ["sun", "rain", "help", "grow", "together", "work"],
                    model: "The seed cannot grow alone. The Sun provides warmth and light ('Hello'). The Rain provides water ('helped it grow'). Both nature elements work together like a team to wake the seed up."
                },
                {
                    id: "l2",
                    q: "Imagine you are the seed deep underground. Describe your feelings before and after waking up.",
                    keywords: ["dark", "cold", "scared", "warm", "happy", "light"],
                    model: "Before: It was dark, cold, and lonely. I felt sleepy and maybe a bit scared. After: I saw the bright sun. I felt warm, happy, and excited to see the world."
                },
                {
                    id: "l3",
                    q: "Why do poets use personification (giving human habits to things)? Use examples from the poem.",
                    keywords: ["human", "alive", "interesting", "talk", "sun said", "friend"],
                    model: "Poets use it to make things feel alive. Example: 'The Sun said Hello'. The sun cannot talk, but this makes the sun feel friendly and caring, like a person."
                },
                {
                    id: "l4",
                    q: "Write a short dialogue between the Rain and the Seed.",
                    keywords: ["rain", "seed", "drink", "grow", "thank", "water"],
                    model: "Rain: Here is some water, little seed.\nSeed: Thank you! I was so thirsty.\nRain: Now you can grow big and strong."
                },
                {
                    id: "l5",
                    q: "How is reading a poem different from reading a story?",
                    keywords: ["rhyme", "rhythm", "lines", "short", "music", "stanzas"],
                    model: "A poem has rhyme and rhythm (music). It is written in short lines and stanzas. A story is written in sentences and paragraphs and is usually longer."
                },
                {
                    id: "l6",
                    q: "Describe the 'Rhyme Scheme' of the poem 'The Little Seed'.",
                    keywords: ["aabb", "deep", "sleep", "hello", "grow", "pairs"],
                    model: "The scheme is AABB. The first two lines rhyme (Deep-Sleep). The next two lines rhyme (Hello-Grow). They rhyme in pairs."
                },
                {
                    id: "l7",
                    q: "Why is 'Voice Modulation' important when acting in a play?",
                    keywords: ["feeling", "emotion", "boring", "loud", "soft", "understand"],
                    model: "If we speak in one tone, it is boring (robot voice). Changing volume (loud/soft) and speed helps the audience understand if the character is happy, sad, or angry."
                },
                {
                    id: "l8",
                    q: "What does the line 'Woke up from its long winter sleep' mean scientifically?",
                    keywords: ["germination", "spring", "season", "sprout", "dormant", "warmth"],
                    model: "It refers to 'Germination'. Seeds stay dormant (sleeping) in Winter because it is cold. In Spring, warmth makes them sprout (wake up) and start growing."
                },
                {
                    id: "l9",
                    q: "List three things you need to prepare for a classroom play.",
                    keywords: ["script", "costume", "prop", "dialogue", "practice", "team"],
                    model: "1. Script (to know lines).\n2. Costumes/Props (to look the part).\n3. Practice/Rehearsal (to act well)."
                },
                {
                    id: "l10",
                    q: "Create a new title for the poem 'The Little Seed' and explain why you chose it.",
                    keywords: ["journey", "life", "wake", "grow", "magic", "nature"],
                    model: "Example Title: 'The Magic of Spring'. Reason: Because the poem is about the magical moment when winter ends and the seed turns into a plant."
                }
            ];

            // --- RENDER NOTES ---
            const notesContainer = document.getElementById('notes-container');
            const revisionList = document.getElementById('revision-list');
            
            notesData.forEach((note, index) => {
                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <div class="note-topic">${note.topic}</div>
                    <div class="definition-box"><b>Definition:</b> ${note.def}</div>
                    <p><b>Explanation:</b> ${note.expl}</p>
                    <div class="example-box"><b>Example:</b> ${note.example}</div>
                    <div class="image-placeholder">🖼️ ${note.img}</div>
                    <div class="memory-tip">💡 <b>Tip:</b> ${note.tip}</div>
                    <p style="margin-top:10px; color:var(--primary-color);">❓ <b>Check:</b> ${note.check}</p>
                `;
                notesContainer.appendChild(card);

                // Add to revision
                const revItem = document.createElement('div');
                revItem.className = 'revision-point';
                revItem.innerHTML = `<span class="revision-bullet">•</span><span><b>${note.topic.split('.')[1]}:</b> ${note.def}</span>`;
                revisionList.appendChild(revItem);
            });

            // --- RENDER IMPORTANT QUESTIONS ---
            const impContainer = document.getElementById('imp-questions-container');
            impQuestions.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.style.background = i % 2 === 0 ? '#fdfdfd' : '#f8f9fa';
                div.innerHTML = `
                    <span class="q-tag">Q${i+1}</span>
                    <p style="margin-bottom:10px;"><b>Question:</b> ${item.q}</p>
                    <p style="color:var(--success-color);"><b>Answer:</b> ${item.a}</p>
                `;
                impContainer.appendChild(div);
            });

            // --- RENDER PRACTICE QUESTIONS ---
            // Render one by one logic
            
            function renderPractice() {
                const wrapper = document.getElementById('current-question-wrapper');
                const feedback = document.getElementById('practice-feedback');
                const nextBtn = document.getElementById('next-btn');
                
                if (state.practiceIndex >= practiceQuestions.length) {
                    wrapper.innerHTML = `<div class="question-card" style="text-align:center; background:#d4edda;">
                        <h3>Practice Complete! 🎉</h3>
                        <p>You attempted all 70 questions.</p>
                        <p>Check your final score above.</p>
                    </div>`;
                    feedback.style.display = 'none';
                    nextBtn.style.display = 'none';
                    return;
                }

                const q = practiceQuestions[state.practiceIndex];
                feedback.style.display = 'none';
                feedback.className = 'feedback-box';
                nextBtn.classList.add('hidden');
                
                let inputHtml = '';
                
                if (q.t === 'MCQ' || q.t === 'Thinking' || q.t === 'Visual') {
                    // Handle array options or specific options
                    let options = Array.isArray(q.o) ? q.o : ["True", "False"]; // Fallback, though data is structured
                    inputHtml = `<div class="options-grid">
                        ${options.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.replace(/'/g, "\\'")}')">${opt}</button>`).join('')}
                    </div>`;
                } else if (q.t === 'TF') {
                    inputHtml = `<div class="options-grid">
                        <button class="option-btn" onclick="checkAnswer('True')">True</button>
                        <button class="option-btn" onclick="checkAnswer('False')">False</button>
                    </div>`;
                } else {
                    // Text input for fill, one word, short
                    inputHtml = `<div style="margin-top:15px;">
                        <input type="text" id="ans-input" placeholder="Type answer here..." style="padding:10px; width:70%; border:2px solid #ccc; border-radius:8px;">
                        <button class="btn" onclick="checkAnswer(document.getElementById('ans-input').value)">Submit</button>
                    </div>`;
                }

                wrapper.innerHTML = `
                    <div class="question-card">
                        <span class="q-tag">Question ${state.practiceIndex + 1} / 70</span>
                        <p><b>${q.q}</b></p>
                        ${inputHtml}
                    </div>
                `;
            }

            window.checkAnswer = (userAns) => {
                if (!userAns) return;
                const q = practiceQuestions[state.practiceIndex];
                const feedback = document.getElementById('practice-feedback');
                const nextBtn = document.getElementById('next-btn');
                
                // Normalization
                const cleanUser = userAns.toString().trim().toLowerCase();
                const cleanCorrect = q.a.toString().trim().toLowerCase();
                
                let isCorrect = false;
                if (cleanUser === cleanCorrect) isCorrect = true;
                // Soft check for sentences
                if (q.t === 'Thinking' && userAns.length > 5) isCorrect = true; // Subjective, give points for trying in practice mode if selected
                if (Array.isArray(q.o) && cleanUser === cleanCorrect) isCorrect = true;
                
                // Update State
                state.totalAttempted++;
                if (isCorrect) {
                    state.correct++;
                    feedback.className = 'feedback-box feedback-correct';
                    feedback.innerHTML = `<b>Excellent ⭐</b><br>${q.e}`;
                } else {
                    state.wrong++;
                    feedback.className = 'feedback-box feedback-wrong';
                    feedback.innerHTML = `<b>Try Again!</b><br>Correct Answer: ${q.a}<br>Reason: ${q.e}`;
                }
                
                feedback.style.display = 'block';
                updateScoreBoard();
                
                // Disable buttons
                const btns = document.querySelectorAll('.option-btn');
                btns.forEach(b => b.disabled = true);
                
                nextBtn.classList.remove('hidden');
            };

            document.getElementById('next-btn').addEventListener('click', () => {
                state.practiceIndex++;
                renderPractice();
            });

            // --- RENDER LONG QUESTIONS ---
            const longContainer = document.getElementById('long-questions-container');
            longQuestions.forEach((lq, i) => {
                const div = document.createElement('div');
                div.className = 'question-card';
                div.innerHTML = `
                    <span class="q-tag">Long Answer ${i+1}</span>
                    <p><b>${lq.q}</b></p>
                    <textarea id="long-ans-${i}" class="long-answer-area" placeholder="Write your answer here in detail..."></textarea>
                    <button class="btn" onclick="checkLongAnswer(${i})">Check Answer</button>
                    <div id="long-feedback-${i}" class="feedback-box"></div>
                `;
                longContainer.appendChild(div);
            });

            window.checkLongAnswer = (index) => {
                const q = longQuestions[index];
                const input = document.getElementById(`long-ans-${index}`);
                const feedback = document.getElementById(`long-feedback-${index}`);
                const text = input.value.toLowerCase().trim();

                if (text.length < 10) {
                    alert("Please write a longer answer.");
                    return;
                }

                // Logic: Check for keywords
                const found = q.keywords.filter(k => text.includes(k.toLowerCase()));
                const score = found.length;
                const total = q.keywords.length;
                
                state.totalAttempted++;
                
                if (score >= 2) { // Threshold for pass
                    state.correct++;
                    feedback.className = 'feedback-box feedback-correct';
                    feedback.innerHTML = `
                        <b>Good Job!</b><br>
                        You used key concepts like: ${found.join(", ")}.<br>
                        <b>Model Answer Key Points:</b> ${q.model}
                    `;
                    input.disabled = true;
                } else {
                    state.wrong++;
                    feedback.className = 'feedback-box feedback-wrong';
                    feedback.innerHTML = `
                        <b>Needs Improvement</b><br>
                        Your answer is missing key concepts.<br>
                        <b>Correct Explanation:</b> ${q.model}
                    `;
                }
                
                feedback.style.display = 'block';
                updateScoreBoard();
            };

            // --- SCORE UPDATE ---
            function updateScoreBoard() {
                document.getElementById('score-correct').innerText = state.correct;
                document.getElementById('score-wrong').innerText = state.wrong;
                document.getElementById('score-total').innerText = `${state.totalAttempted} / 80`; // 70 practice + 10 long
                
                const percent = state.totalAttempted === 0 ? 0 : Math.round((state.correct / state.totalAttempted) * 100);
                document.getElementById('score-percent').innerText = `${percent}%`;
            }

            // Init
            renderPractice();

        });
    </script>
