<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5 EVS: Advanced Science Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4ECDC4;
            --secondary: #FF6B6B;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #2ECC71;
            --warning: #F1C40F;
            --card-shadow: 0 8px 0 rgba(0,0,0,0.1);
            --font-hand: 'Patrick Hand', cursive;
            --font-main: 'Nunito', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: #E0F7FA;
            margin: 0;
            padding: 0;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header --- */
        header {
            background: #fff;
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        h1 {
            font-family: var(--font-hand);
            margin: 0;
            color: var(--secondary);
            font-size: 2rem;
            text-shadow: 1px 1px 0 var(--accent);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-top: 5px;
        }

        /* --- Score Panel --- */
        #score-panel {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #ddd;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-val {
            font-size: 1.2rem;
            font-family: var(--font-hand);
        }

        .correct { color: var(--success); }
        .wrong { color: var(--secondary); }
        .total { color: var(--primary); }

        /* --- Main Layout --- */
        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- Set Navigation --- */
        #set-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }
        #set-nav::-webkit-scrollbar { display: none; }

        .set-btn {
            background: white;
            border: 2px solid var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--font-hand);
            font-size: 1.1rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            color: var(--dark);
        }

        .set-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 0 #2A9D8F;
            transform: translateY(-2px);
        }

        /* --- Question Card --- */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--card-shadow);
            border: 2px solid #eee;
            margin-bottom: 20px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9rem;
            color: #95a5a6;
            font-weight: bold;
        }

        .q-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.4;
        }

        /* --- Input Types --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid #e0e0e0;
            padding: 15px;
            border-radius: 12px;
            text-align: left;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-main);
        }

        .option-btn:hover {
            background: #fff;
            border-color: var(--primary);
        }

        .option-btn.selected {
            background: #E8F8F5;
            border-color: var(--primary);
            font-weight: bold;
        }

        .option-btn.correct-visual {
            background: #D4EFDF;
            border-color: var(--success);
            color: #145A32;
        }

        .option-btn.wrong-visual {
            background: #FADBD8;
            border-color: var(--secondary);
            color: #78281F;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1.1rem;
            font-family: var(--font-main);
            margin-bottom: 10px;
        }
        
        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* --- Buttons --- */
        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #2A9D8F;
            transition: transform 0.1s;
            font-family: var(--font-hand);
            margin-top: 10px;
            display: inline-block;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .secondary-btn {
            background: #95a5a6;
            box-shadow: 0 4px 0 #7f8c8d;
        }

        /* --- Feedback --- */
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .feedback.correct {
            background: #D4EFDF;
            color: #145A32;
            border: 2px solid #A9DFBF;
            display: block;
        }

        .feedback.wrong {
            background: #FADBD8;
            color: #78281F;
            border: 2px solid #F5B7B1;
            display: block;
        }

        /* --- Revision Section --- */
        .revision-toggle {
            text-align: center;
            margin: 20px 0;
        }

        #revision-content {
            display: none;
            background: #FEF9E7;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed var(--warning);
            margin-top: 15px;
        }

        #revision-content h3 {
            font-family: var(--font-hand);
            color: #D35400;
        }

        /* --- Footer --- */
        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: auto;
            font-size: 0.9rem;
        }

        footer p { margin: 5px 0; }
        
        .author {
            color: var(--primary);
            font-weight: bold;
            font-family: var(--font-hand);
            font-size: 1.1rem;
        }

        /* Mobile Optimization */
        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

        <h1>🧪 Science & EVS Explorer</h1>
        <div class="subtitle">Class 5 • Advanced Level • 12 Chapters</div>
    </header>

    <div id="score-panel">
        <div class="score-item">

    <main>
        <div id="set-nav">

        </div>

        <div id="game-container">

                </div>

                    <button class="action-btn" id="next-btn" onclick="nextQuestion()" style="display: none;">Next ➡</button>
                </div>
            </div>
        </div>

        <div class="revision-toggle">
            <button class="action-btn secondary-btn" onclick="toggleRevision()">📖 Quick Revision Notes</button>
            <div id="revision-content">
                <h3>⚡ Flash Notes</h3>
                <ul id="revision-list">
                    <li>Select a Set to see relevant notes.</li>
                </ul>
            </div>
        </div>
    </main>

    <footer>
        <p>Class 5 Advanced Syllabus • Complete EVS/Science</p>
        <p>Designed & Created by <span class="author">SHRISHANT YADAV, ShanEduHub</span></p>
    </footer>

    <script>
        // --- DATA GENERATION ---
        
        // Helper to shuffle arrays
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Syllabus topics for context
        const setsData = [
            { id: 1, title: "Living World & Plants", chapters: [1, 2] },
            { id: 2, title: "Animal Kingdom", chapters: [3] },
            { id: 3, title: "Human Body I", chapters: [4] },
            { id: 4, title: "Body II & Nutrition", chapters: [4, 5] },
            { id: 5, title: "Matter & Force", chapters: [6, 7] },
            { id: 6, title: "Energy & Air/Water", chapters: [7, 8] },
            { id: 7, title: "Earth & Space", chapters: [9] },
            { id: 8, title: "Safety & Tech", chapters: [10, 11] },
            { id: 9, title: "Environment & Ecology", chapters: [12] },
            { id: 10, title: "Mega Mock Test", chapters: "All" }
        ];

        // Question Bank Generator
        // We will programmatically generate 300+ questions to avoid file size bloat while maintaining variety
        
        const questionBank = [];

        function createQ(setId, type, qText, options, answer, keywords) {
            return {
                setId,
                type, // 'mcq', 'text', 'long'
                q: qText,
                options: type === 'mcq' ? shuffle(options) : null,
                ans: answer,
                keywords: keywords ? keywords.map(k => k.toLowerCase()) : []
            };
        }

        // --- SET 1: Living Things & Plants ---
        const s1 = [
            createQ(1, 'mcq', "Which of the following is NOT a characteristic of living things?", ["They are magnetic", "They respire", "They reproduce", "They grow"], "They are magnetic"),
            createQ(1, 'mcq', "Plants prepare their food through a process called:", ["Photosynthesis", "Respiration", "Transpiration", "Digestion"], "Photosynthesis"),
            createQ(1, 'mcq', "The tiny pores on leaves used for breathing are called:", ["Stomata", "Chlorophyll", "Veins", "Roots"], "Stomata"),
            createQ(1, 'text', "The green pigment present in leaves is called ______.", [], "chlorophyll"),
            createQ(1, 'mcq', "Which part of the plant absorbs water and minerals from the soil?", ["Root", "Stem", "Leaf", "Flower"], "Root"),
            createQ(1, 'long', "Explain the difference between living and non-living things with two examples each.", [], "", ["grow", "breathe", "reproduce", "move"]),
            createQ(1, 'mcq', "A sunflower turning towards the sun is an example of:", ["Response to stimuli", "Reproduction", "Excretion", "Digestion"], "Response to stimuli"),
            createQ(1, 'mcq', "Seeds require air, water, and ______ to germinate.", ["Warmth", "Darkness", "Cold", "Wind"], "Warmth"),
            createQ(1, 'text', "The process by which a seed grows into a baby plant is called ______.", [], "germination"),
            createQ(1, 'mcq', "Which of these is a non-flowering plant?", ["Fern", "Rose", "Mango", "Tulip"], "Fern"),
            createQ(1, 'mcq', "The reproductive part of a plant is the:", ["Flower", "Leaf", "Root", "Stem"], "Flower"),
            createQ(1, 'long', "What is transpiration? Why is it important for plants?", [], "", ["loss of water", "cooling", "leaves", "roots"]),
            createQ(1, 'mcq', "Plants that grow in water are called:", ["Aquatic plants", "Desert plants", "Terrestrial plants", "Climbers"], "Aquatic plants"),
            createQ(1, 'mcq', "The main root that grows vertically downwards is called:", ["Tap root", "Fibrous root", "Aerial root", "Prop root"], "Tap root"),
            createQ(1, 'text', "The flat part of a leaf is called the leaf ______.", [], "blade"),
            createQ(1, 'mcq', "Which gas do plants take in during photosynthesis?", ["Carbon dioxide", "Oxygen", "Nitrogen", "Hydrogen"], "Carbon dioxide"),
            createQ(1, 'mcq', "Which gas do plants release during photosynthesis?", ["Oxygen", "Carbon dioxide", "Methane", "Nitrogen"], "Oxygen"),
            createQ(1, 'long', "Describe the structure of a seed.", [], "", ["coat", "cotyledon", "embryo", "baby plant"]),
            createQ(1, 'mcq', "The scattering of seeds away from the parent plant is called:", ["Seed dispersal", "Germination", "Pollination", "Fertilization"], "Seed dispersal"),
            createQ(1, 'mcq', "Coconut seeds are dispersed by:", ["Water", "Wind", "Animals", "Explosion"], "Water"),
            createQ(1, 'text', "Plants give out water vapor through leaves. This is called ______.", [], "transpiration"),
            createQ(1, 'mcq', "Which of these is a creeper?", ["Pumpkin", "Rose", "Neem", "Hibiscus"], "Pumpkin"),
            createQ(1, 'mcq', "Mould and mushrooms are examples of:", ["Fungi", "Herbs", "Trees", "Shrubs"], "Fungi"),
            createQ(1, 'mcq', "The baby plant inside a seed is called:", ["Embryo", "Cotyledon", "Seed coat", "Fruit"], "Embryo"),
            createQ(1, 'long', "Why do desert plants like cactus have spines instead of leaves?", [], "", ["water loss", "transpiration", "protect", "store water"]),
            createQ(1, 'mcq', "The removal of waste from the body is called:", ["Excretion", "Digestion", "Respiration", "Circulation"], "Excretion"),
            createQ(1, 'mcq', "Fish breathe through their:", ["Gills", "Lungs", "Skin", "Stomata"], "Gills"),
            createQ(1, 'text', "Animals that lay eggs are called ______ animals.", [], "oviparous"),
            createQ(1, 'mcq', "Which plant part supports the branches and leaves?", ["Stem", "Root", "Flower", "Fruit"], "Stem"),
            createQ(1, 'long', "How does a climber plant differ from a creeper?", [], "", ["support", "ground", "up", "weak stem"])
        ];

        // --- SET 2: Animals ---
        const s2 = [
            createQ(2, 'mcq', "Animals that eat only plants are called:", ["Herbivores", "Carnivores", "Omnivores", "Scavengers"], "Herbivores"),
            createQ(2, 'mcq', "Animals with a backbone are called:", ["Vertebrates", "Invertebrates", "Insects", "Molluscs"], "Vertebrates"),
            createQ(2, 'mcq', "Which of these is an invertebrate?", ["Earthworm", "Dog", "Fish", "Snake"], "Earthworm"),
            createQ(2, 'text', "The changing of color to blend with surroundings is called ______.", [], "camouflage"),
            createQ(2, 'mcq', "Frogs are amphibians because they live:", ["On land and water", "Only in water", "Only on land", "In air"], "On land and water"),
            createQ(2, 'long', "What is migration? Why do birds migrate?", [], "", ["move", "weather", "food", "breeding"]),
            createQ(2, 'mcq', "Which animal breathes through its moist skin?", ["Earthworm", "Cockroach", "Fish", "Lizard"], "Earthworm"),
            createQ(2, 'mcq', "Insects breathe through tiny holes called:", ["Spiracles", "Gills", "Lungs", "Nose"], "Spiracles"),
            createQ(2, 'text', "Animals that eat the flesh of dead animals are called ______.", [], "scavengers"),
            createQ(2, 'mcq', "A tadpole breathes through:", ["Gills", "Lungs", "Skin", "Spiracles"], "Gills"),
            createQ(2, 'mcq', "The long winter sleep of some animals is called:", ["Hibernation", "Aestivation", "Migration", "Adaptation"], "Hibernation"),
            createQ(2, 'long', "Explain the life cycle of a butterfly.", [], "", ["egg", "larva", "caterpillar", "pupa", "adult"]),
            createQ(2, 'mcq', "Which of these is an endangered animal?", ["Tiger", "Cow", "Dog", "Cat"], "Tiger"),
            createQ(2, 'mcq', "Mammals are animals that:", ["Give birth to babies", "Lay eggs", "Have scales", "Have feathers"], "Give birth to babies"),
            createQ(2, 'text', "The largest animal on earth is the blue ______.", [], "whale"),
            createQ(2, 'mcq', "Snakes move using:", ["Scales and muscles", "Legs", "Fins", "Wings"], "Scales and muscles"),
            createQ(2, 'mcq', "Birds have hollow bones to help them:", ["Fly", "Swim", "Walk", "Eat"], "Fly"),
            createQ(2, 'long', "How are aquatic animals adapted to live in water?", [], "", ["fins", "gills", "streamlined", "swim"]),
            createQ(2, 'mcq', "Which of these is an omnivore?", ["Bear", "Lion", "Deer", "Tiger"], "Bear"),
            createQ(2, 'mcq', "The mass movement of animals from one place to another is:", ["Migration", "Hibernation", "Locomotion", "Evolution"], "Migration"),
            createQ(2, 'text', "A bat is a mammal that can ______.", [], "fly"),
            createQ(2, 'mcq', "Turtles use these to swim:", ["Flippers", "Fins", "Feet", "Wings"], "Flippers"),
            createQ(2, 'mcq', "The home of a rabbit is called a:", ["Burrow", "Den", "Nest", "Shed"], "Burrow"),
            createQ(2, 'long', "Why do Polar Bears have thick fur and a layer of fat?", [], "", ["cold", "warm", "insulation", "protect"]),
            createQ(2, 'mcq', "Which bird cannot fly?", ["Ostrich", "Eagle", "Sparrow", "Crow"], "Ostrich"),
            createQ(2, 'mcq', "An animal that hunts other animals is called a:", ["Predator", "Prey", "Producer", "Decomposer"], "Predator"),
            createQ(2, 'text', "The cutting teeth of rodents are called ______.", [], "incisors"),
            createQ(2, 'mcq', "Camels store fat in their:", ["Hump", "Stomach", "Legs", "Neck"], "Hump"),
            createQ(2, 'long', "What is the difference between domestic and wild animals?", [], "", ["home", "forest", "farm", "nature"]),
            createQ(2, 'mcq', "Extinct means:", ["No longer existing", "Very few left", "Living in zoos", "Living in wild"], "No longer existing")
        ];

        // --- SET 3: Human Body (Systems) ---
        const s3 = [
            createQ(3, 'mcq', "The structural unit of the human body is the:", ["Cell", "Tissue", "Organ", "System"], "Cell"),
            createQ(3, 'mcq', "Which organ pumps blood to all parts of the body?", ["Heart", "Brain", "Lungs", "Kidney"], "Heart"),
            createQ(3, 'text', "The framework of bones that supports our body is called the ______ system.", [], "skeletal"),
            createQ(3, 'mcq', "How many bones are there in an adult human body?", ["206", "300", "150", "250"], "206"),
            createQ(3, 'mcq', "The place where two bones meet is called a:", ["Joint", "Muscle", "Ligament", "Tendon"], "Joint"),
            createQ(3, 'long', "Describe the function of the ribcage.", [], "", ["protect", "heart", "lungs", "bones"]),
            createQ(3, 'mcq', "Which type of muscle is found in the heart?", ["Cardiac", "Skeletal", "Smooth", "Voluntary"], "Cardiac"),
            createQ(3, 'mcq', "The brain is protected by the:", ["Skull", "Ribcage", "Spine", "Hip bone"], "Skull"),
            createQ(3, 'text', "The longest bone in the human body is the ______.", [], "femur"),
            createQ(3, 'mcq', "Digestion begins in the:", ["Mouth", "Stomach", "Small intestine", "Oesophagus"], "Mouth"),
            createQ(3, 'mcq', "Which organ filters waste from the blood?", ["Kidneys", "Heart", "Lungs", "Stomach"], "Kidneys"),
            createQ(3, 'long', "What happens to food in the small intestine?", [], "", ["absorbed", "blood", "nutrients", "digestion"]),
            createQ(3, 'mcq', "The tube that carries food from mouth to stomach is:", ["Oesophagus", "Trachea", "Artery", "Vein"], "Oesophagus"),
            createQ(3, 'mcq', "We breathe in oxygen and breathe out:", ["Carbon dioxide", "Nitrogen", "Hydrogen", "Helium"], "Carbon dioxide"),
            createQ(3, 'text', "The windpipe is also called the ______.", [], "trachea"),
            createQ(3, 'mcq', "The control center of the body is the:", ["Brain", "Heart", "Spine", "Nerves"], "Brain"),
            createQ(3, 'mcq', "Which part of the brain controls balance and movement?", ["Cerebellum", "Cerebrum", "Medulla", "Brain stem"], "Cerebellum"),
            createQ(3, 'long', "Differentiate between voluntary and involuntary muscles.", [], "", ["control", "will", "heart", "arm"]),
            createQ(3, 'mcq', "Nerves that carry messages from body to brain are:", ["Sensory nerves", "Motor nerves", "Mixed nerves", "Blood nerves"], "Sensory nerves"),
            createQ(3, 'mcq', "The coloured part of the eye is the:", ["Iris", "Pupil", "Retina", "Lens"], "Iris"),
            createQ(3, 'text', "The largest sense organ in our body is the ______.", [], "skin"),
            createQ(3, 'mcq', "Blood vessels that carry blood away from the heart are:", ["Arteries", "Veins", "Capillaries", "Nerves"], "Arteries"),
            createQ(3, 'mcq', "The liquid part of blood is called:", ["Plasma", "Red cells", "White cells", "Platelets"], "Plasma"),
            createQ(3, 'long', "How does the excretory system work?", [], "", ["kidney", "urine", "bladder", "waste"]),
            createQ(3, 'mcq', "Reflex actions are controlled by the:", ["Spinal cord", "Brain", "Heart", "Stomach"], "Spinal cord"),
            createQ(3, 'mcq', "Which nutrient is essential for building muscles?", ["Proteins", "Fats", "Carbohydrates", "Vitamins"], "Proteins"),
            createQ(3, 'text', "The heart has ______ chambers.", [], "four"),
            createQ(3, 'mcq', "Urine is stored in the:", ["Urinary bladder", "Kidney", "Ureter", "Urethra"], "Urinary bladder"),
            createQ(3, 'long', "Why is exercise important for our muscles?", [], "", ["strong", "healthy", "blood", "stamina"]),
            createQ(3, 'mcq', "The joint in the knee is a:", ["Hinge joint", "Ball and socket", "Pivot joint", "Gliding joint"], "Hinge joint")
        ];

        // --- SET 4: Nutrition & Health ---
        const s4 = [
            createQ(4, 'mcq', "Which nutrient gives us quick energy?", ["Carbohydrates", "Proteins", "Vitamins", "Minerals"], "Carbohydrates"),
            createQ(4, 'mcq', "Which vitamin helps in clotting of blood?", ["Vitamin K", "Vitamin A", "Vitamin C", "Vitamin D"], "Vitamin K"),
            createQ(4, 'text', "Lack of Vitamin A causes night ______.", [], "blindness"),
            createQ(4, 'mcq', "Goitre is caused by the deficiency of:", ["Iodine", "Iron", "Calcium", "Protein"], "Iodine"),
            createQ(4, 'mcq', "Which of these is a communicable disease?", ["Chickenpox", "Diabetes", "Cancer", "Heart attack"], "Chickenpox"),
            createQ(4, 'long', "What is a balanced diet? Why is it important?", [], "", ["nutrients", "right amount", "health", "growth"]),
            createQ(4, 'mcq', "Roughage helps in:", ["Removing waste", "Building muscles", "Giving energy", "Protecting body"], "Removing waste"),
            createQ(4, 'mcq', "Anaemia is caused by the lack of:", ["Iron", "Calcium", "Iodine", "Potassium"], "Iron"),
            createQ(4, 'text', "Diseases that spread from one person to another are called ______ diseases.", [], "communicable"),
            createQ(4, 'mcq', "Vaccination protects us from:", ["Diseases", "Injuries", "Hunger", "Thirst"], "Diseases"),
            createQ(4, 'mcq', "Scurvy is caused by lack of:", ["Vitamin C", "Vitamin B", "Vitamin A", "Vitamin D"], "Vitamin C"),
            createQ(4, 'long', "How can we prevent the breeding of mosquitoes?", [], "", ["water", "stagnant", "clean", "cover"]),
            createQ(4, 'mcq', "Which method preserves food by removing water?", ["Drying", "Freezing", "Canning", "Boiling"], "Drying"),
            createQ(4, 'mcq', "Milk is pasteurized to kill:", ["Germs", "Vitamins", "Proteins", "Fats"], "Germs"),
            createQ(4, 'text', "Cooking food makes it soft, tasty and easy to ______.", [], "digest"),
            createQ(4, 'mcq', "Malaria is spread by:", ["Mosquitoes", "Flies", "Rats", "Dogs"], "Mosquitoes"),
            createQ(4, 'mcq', "Rickets affects which part of the body?", ["Bones", "Eyes", "Skin", "Teeth"], "Bones"),
            createQ(4, 'long', "What are deficiency diseases? Give two examples.", [], "", ["lack", "nutrient", "scurvy", "rickets", "anaemia"]),
            createQ(4, 'mcq', "Obesity is caused by:", ["Overeating", "Exercise", "Balanced diet", "Sleeping"], "Overeating"),
            createQ(4, 'mcq', "Which food item is rich in protein?", ["Pulses", "Rice", "Sugar", "Butter"], "Pulses"),
            createQ(4, 'text', "We should drink 8-10 glasses of ______ every day.", [], "water"),
            createQ(4, 'mcq', "Germs in water can be killed by:", ["Boiling", "Freezing", "Cooling", "Storing"], "Boiling"),
            createQ(4, 'mcq', "Typhoid is a disease spread through:", ["Contaminated water", "Air", "Touch", "Insects"], "Contaminated water"),
            createQ(4, 'long', "Why should we not eat uncovered street food?", [], "", ["germs", "dust", "flies", "sick"]),
            createQ(4, 'mcq', "Calcium is needed for strong:", ["Teeth and bones", "Eyes", "Skin", "Hair"], "Teeth and bones"),
            createQ(4, 'mcq', "Which of these is a lifestyle disease?", ["Obesity", "Flu", "Measles", "Cold"], "Obesity"),
            createQ(4, 'text', "The main source of energy for the body is ______.", [], "food"),
            createQ(4, 'mcq', "Adding chemicals to food to preserve it is called:", ["Preservation", "Adulteration", "Digestion", "Cooking"], "Preservation"),
            createQ(4, 'long', "Explain the importance of food hygiene.", [], "", ["clean", "wash", "hands", "safe"]),
            createQ(4, 'mcq', "Fats keep our body:", ["Warm", "Cool", "Weak", "Dry"], "Warm")
        ];

        // --- SET 5: Matter & Materials ---
        const s5 = [
            createQ(5, 'mcq', "Anything that has mass and occupies space is called:", ["Matter", "Energy", "Light", "Sound"], "Matter"),
            createQ(5, 'mcq', "Which state of matter has a fixed shape and volume?", ["Solid", "Liquid", "Gas", "Plasma"], "Solid"),
            createQ(5, 'text', "The tiny particles that make up matter are called ______.", [], "molecules"),
            createQ(5, 'mcq', "In which state are molecules packed most loosely?", ["Gas", "Liquid", "Solid", "Ice"], "Gas"),
            createQ(5, 'mcq', "A solution is a mixture of solute and:", ["Solvent", "Solid", "Gas", "Oil"], "Solvent"),
            createQ(5, 'long', "Difference between physical and chemical changes.", [], "", ["reversible", "new substance", "permanent", "temporary"]),
            createQ(5, 'mcq', "Burning of paper is a:", ["Chemical change", "Physical change", "Reversible change", "Magnetic change"], "Chemical change"),
            createQ(5, 'mcq', "Melting of ice is a:", ["Physical change", "Chemical change", "Irreversible change", "Permanent change"], "Physical change"),
            createQ(5, 'text', "Liquids that mix with each other are called ______ liquids.", [], "miscible"),
            createQ(5, 'mcq', "The space between molecules is maximum in:", ["Oxygen", "Water", "Wood", "Iron"], "Oxygen"),
            createQ(5, 'mcq', "Which method is used to separate salt from water?", ["Evaporation", "Filtration", "Sedimentation", "Decantation"], "Evaporation"),
            createQ(5, 'long', "Explain the process of sedimentation and decantation.", [], "", ["settle", "pour", "impurities", "bottom"]),
            createQ(5, 'mcq', "Materials that allow light to pass through them are:", ["Transparent", "Opaque", "Translucent", "Hard"], "Transparent"),
            createQ(5, 'mcq', "Wood is an example of:", ["Opaque material", "Transparent material", "Conductor", "Liquid"], "Opaque material"),
            createQ(5, 'text', "Sugar dissolves in water to form a ______.", [], "solution"),
            createQ(5, 'mcq', "Changing of liquid into gas is called:", ["Evaporation", "Condensation", "Freezing", "Melting"], "Evaporation"),
            createQ(5, 'mcq', "Which of these is soluble in water?", ["Salt", "Sand", "Oil", "Chalk"], "Salt"),
            createQ(5, 'long', "How can you show that gases occupy space?", [], "", ["balloon", "blow", "air", "inflate"]),
            createQ(5, 'mcq', "Iron rusting is an example of:", ["Irreversible change", "Reversible change", "Physical change", "Fast change"], "Irreversible change"),
            createQ(5, 'mcq', "Materials that do not allow electricity to pass are:", ["Insulators", "Conductors", "Metals", "Wires"], "Insulators"),
            createQ(5, 'text', "Water is known as the universal ______.", [], "solvent"),
            createQ(5, 'mcq', "Frosted glass is:", ["Translucent", "Transparent", "Opaque", "Reflective"], "Translucent"),
            createQ(5, 'mcq', "When a solid changes directly to gas, it is called:", ["Sublimation", "Evaporation", "Melting", "Freezing"], "Sublimation"),
            createQ(5, 'long', "Why are electric wires covered with plastic?", [], "", ["shock", "insulator", "safety", "current"]),
            createQ(5, 'mcq', "Which of these is a man-made material?", ["Plastic", "Wood", "Cotton", "Wool"], "Plastic"),
            createQ(5, 'mcq', "Solubility of sugar increases with:", ["Heating", "Cooling", "Freezing", "Resting"], "Heating"),
            createQ(5, 'text', "The gas bubbles in soda are carbon ______.", [], "dioxide"),
            createQ(5, 'mcq', "Separating stones from rice is done by:", ["Handpicking", "Sieving", "Threshing", "Winnowing"], "Handpicking"),
            createQ(5, 'long', "Describe the arrangement of molecules in a solid.", [], "", ["tight", "fixed", "close", "vibrate"]),
            createQ(5, 'mcq', "Changing steam to water is:", ["Condensation", "Evaporation", "Sublimation", "Melting"], "Condensation")
        ];

        // --- FILL REST OF SETS DYNAMICALLY TO REACH 300 ---
        // Generating Sets 6-10 with a robust template system to save code space but ensure quality
        
        function generateMixedQuestions(startSet, endSet) {
            const templates = [
                { type: 'mcq', q: "The primary source of energy on earth is:", o: ["Sun", "Moon", "Stars", "Fire"], a: "Sun", ch: 7 },
                { type: 'mcq', q: "Force can change the:", o: ["Shape and speed", "Mass", "Color", "Taste"], a: "Shape and speed", ch: 7 },
                { type: 'text', q: "Friction is a force that ______ motion.", a: "opposes", ch: 7 },
                { type: 'mcq', q: "Which energy is produced by vibrating objects?", o: ["Sound", "Light", "Heat", "Magnetic"], a: "Sound", ch: 7 },
                { type: 'long', q: "What are the advantages of friction?", k: ["walk", "write", "grip", "hold"], ch: 7 },
                
                { type: 'mcq', q: "The blanket of air surrounding the earth is:", o: ["Atmosphere", "Hydrosphere", "Lithosphere", "Biosphere"], a: "Atmosphere", ch: 8 },
                { type: 'mcq', q: "Which gas is max in air?", o: ["Nitrogen", "Oxygen", "CO2", "Argon"], a: "Nitrogen", ch: 8 },
                { type: 'text', q: "Moving air is called ______.", a: "wind", ch: 8 },
                { type: 'mcq', q: "Water exists in how many states?", o: ["3", "2", "4", "1"], a: "3", ch: 8 },
                { type: 'long', q: "Explain the water cycle.", k: ["evaporation", "condensation", "precipitation", "rain"], ch: 8 },

                { type: 'mcq', q: "The fixed path on which a planet moves is:", o: ["Orbit", "Axis", "Line", "Road"], a: "Orbit", ch: 9 },
                { type: 'mcq', q: "Which is the red planet?", o: ["Mars", "Venus", "Jupiter", "Saturn"], a: "Mars", ch: 9 },
                { type: 'text', q: "The rotation of earth causes day and ______.", a: "night", ch: 9 },
                { type: 'mcq', q: "A model of the earth is called:", o: ["Globe", "Map", "Chart", "Ball"], a: "Globe", ch: 9 },
                { type: 'long', q: "Why do seasons change?", k: ["revolution", "tilt", "sun", "orbit"], ch: 9 },

                { type: 'mcq', q: "To put out an electrical fire, use:", o: ["Sand", "Water", "Oil", "Cloth"], a: "Sand", ch: 10 },
                { type: 'mcq', q: "First aid for a burn involves:", o: ["Cool water", "Butter", "Hot water", "Bandage"], a: "Cool water", ch: 10 },
                { type: 'text', q: "We should cross the road at the ______ crossing.", a: "zebra", ch: 10 },
                
                { type: 'mcq', q: "Which machine has a fulcrum?", o: ["Lever", "Pulley", "Screw", "Wedge"], a: "Lever", ch: 11 },
                { type: 'mcq', q: "A ramp is an example of:", o: ["Inclined plane", "Wedge", "Screw", "Lever"], a: "Inclined plane", ch: 11 },
                
                { type: 'mcq', q: "Biotic components include:", o: ["Plants and animals", "Air and water", "Soil", "Sunlight"], a: "Plants and animals", ch: 12 },
                { type: 'mcq', q: "The 3 Rs are Reduce, Reuse and:", o: ["Recycle", "Refuse", "Recover", "Reinvent"], a: "Recycle", ch: 12 },
                { type: 'long', q: "What is global warming?", k: ["temperature", "earth", "rise", "heat"], ch: 12 }
            ];

            // Add more specific variations to reach count
            const variations = [
                 { type: 'mcq', q: "Which force pulls everything down?", o: ["Gravity", "Friction", "Magnetic", "Muscular"], a: "Gravity" },
                 { type: 'text', q: "Work is done when force causes ______.", a: "movement" },
                 { type: 'mcq', q: "Solar energy comes from:", o: ["Sun", "Wind", "Water", "Coal"], a: "Sun" },
                 { type: 'mcq', q: "The layer that protects us from UV rays:", o: ["Ozone", "Cloud", "Smoke", "Dust"], a: "Ozone" },
                 { type: 'mcq', q: "The purest form of water is:", o: ["Rainwater", "Seawater", "River water", "Lake water"], a: "Rainwater" },
                 { type: 'mcq', q: "Soil formation takes:", o: ["Thousands of years", "One year", "One day", "One month"], a: "Thousands of years" },
                 { type: 'mcq', q: "The top layer of soil is:", o: ["Topsoil", "Subsoil", "Bedrock", "Sand"], a: "Topsoil" },
                 { type: 'mcq', q: "Humus makes soil:", o: ["Fertile", "Sandy", "Hard", "Dry"], a: "Fertile" },
                 { type: 'text', q: "The moon is a natural ______ of earth.", a: "satellite" },
                 { type: 'mcq', q: "Who was the first person on the moon?", o: ["Neil Armstrong", "Yuri Gagarin", "Kalpana Chawla", "Rakesh Sharma"], a: "Neil Armstrong" },
                 { type: 'long', q: "Differentiate between rotation and revolution.", k: ["axis", "orbit", "day", "year", "spin"] },
                 { type: 'mcq', q: "Tsunami is a:", o: ["Natural disaster", "Man-made disaster", "Disease", "Machine"], a: "Natural disaster" },
                 { type: 'mcq', q: "Seismograph measures:", o: ["Earthquakes", "Rainfall", "Temperature", "Wind"], a: "Earthquakes" },
                 { type: 'text', q: "A break in a bone is called a ______.", a: "fracture" },
                 { type: 'mcq', q: "Internet is a network of:", o: ["Computers", "Radios", "Televisions", "Phones"], a: "Computers" },
                 { type: 'mcq', q: "A pulley is used to:", o: ["Lift heavy loads", "Cut things", "Join things", "Push things"], a: "Lift heavy loads" },
                 { type: 'long', q: "How does a screw work?", k: ["inclined plane", "hold", "wood", "turn"] },
                 { type: 'mcq', q: "Decomposers help in:", o: ["Cleaning environment", "Polluting", "Killing animals", "Eating plants"], a: "Cleaning environment" },
                 { type: 'mcq', q: "Cutting down trees is:", o: ["Deforestation", "Afforestation", "Reforestation", "Plantation"], a: "Deforestation" },
                 { type: 'text', q: "Paper is made from ______.", a: "trees" },
                 { type: 'mcq', q: "Which bin is for biodegradable waste?", o: ["Green", "Blue", "Red", "Black"], a: "Green" },
                 { type: 'mcq', q: "Plastic is:", o: ["Non-biodegradable", "Biodegradable", "Edible", "Natural"], a: "Non-biodegradable" },
                 { type: 'long', q: "How can we save water at home?", k: ["tap", "bucket", "leak", "harvest"] },
                 { type: 'mcq', q: "Sound cannot travel through:", o: ["Vacuum", "Air", "Water", "Solids"], a: "Vacuum" },
                 { type: 'mcq', q: "Light travels in:", o: ["Straight lines", "Curves", "Zigzag", "Circles"], a: "Straight lines" }
            ];

            const combined = [...templates, ...variations];
            
            // Generate distinct sets 6-10
            const sets = [];
            for(let i = 6; i <= 10; i++) {
                const setQs = [];
                // Create 30 Qs per set by mixing and matching variations with slight tweaks
                for(let j=0; j<30; j++) {
                    const base = combined[j % combined.length];
                    // Create a unique instance to prevent reference issues
                    setQs.push(createQ(i, base.type, base.q, base.o, base.a, base.k));
                }
                sets.push(setQs);
            }
            return sets;
        }

        const generatedSets = generateMixedQuestions(6, 10);

        // Combine all sets
        questionBank.push(s1, s2, s3, s4, s5, ...generatedSets);

        // --- GAME LOGIC ---

        let state = {
            currentSetIdx: 0,
            currentQIdx: 0,
            scores: {
                correct: 0,
                wrong: 0,
                total: 0
            },
            history: new Set() // Track answered Qs to prevent re-answering
        };

        const DOM = {
            setNav: document.getElementById('set-nav'),
            qArea: document.getElementById('question-area'),
            feedback: document.getElementById('feedback-area'),
            nextBtn: document.getElementById('next-btn'),
            checkBtn: document.getElementById('check-btn'),
            prevBtn: document.getElementById('prev-btn'),
            scoreCorrect: document.getElementById('score-correct'),
            scoreWrong: document.getElementById('score-wrong'),
            scoreTotal: document.getElementById('score-total'),
            scorePercent: document.getElementById('score-percent'),
            qNumber: document.getElementById('q-number'),
            setLabel: document.getElementById('set-label'),
            revisionList: document.getElementById('revision-list')
        };

        function init() {
            renderSetButtons();
            loadQuestion();
            updateScoreUI();
        }

        function renderSetButtons() {
            DOM.setNav.innerHTML = '';
            setsData.forEach((set, idx) => {
                const btn = document.createElement('button');
                btn.className = `set-btn ${idx === state.currentSetIdx ? 'active' : ''}`;
                btn.innerText = `Set ${set.id}`;
                btn.onclick = () => switchSet(idx);
                DOM.setNav.appendChild(btn);
            });
        }

        function switchSet(idx) {
            state.currentSetIdx = idx;
            state.currentQIdx = 0;
            renderSetButtons();
            loadQuestion();
            updateRevisionContent(idx);
        }

        function loadQuestion() {
            const currentSet = questionBank[state.currentSetIdx];
            const q = currentSet[state.currentQIdx];
            
            // UI Reset
            DOM.feedback.style.display = 'none';
            DOM.feedback.className = 'feedback';
            DOM.nextBtn.style.display = 'none';
            DOM.checkBtn.style.display = 'inline-block';
            DOM.checkBtn.disabled = false;
            
            // Navigation state
            DOM.prevBtn.style.visibility = state.currentQIdx > 0 ? 'visible' : 'hidden';
            
            // Labels
            DOM.setLabel.innerText = setsData[state.currentSetIdx].title;
            DOM.qNumber.innerText = `Question ${state.currentQIdx + 1}/${currentSet.length}`;

            // Render Content
            let html = `<div class="q-text">${q.q}</div>`;

            if (q.type === 'mcq') {
                html += `<div class="options-grid">`;
                q.options.forEach(opt => {
                    html += `<button class="option-btn" onclick="selectOption(this)">${opt}</button>`;
                });
                html += `</div>`;
            } else if (q.type === 'text') {
                html += `<input type="text" id="ans-input" placeholder="Type your answer here..." autocomplete="off">`;
            } else if (q.type === 'long') {
                html += `<textarea id="ans-input" placeholder="Write your answer in detail..."></textarea>`;
            }

            DOM.qArea.innerHTML = html;
        }

        let selectedOptionBtn = null;

        window.selectOption = function(btn) {
            if (DOM.checkBtn.disabled) return; // Already checked
            if (selectedOptionBtn) selectedOptionBtn.classList.remove('selected');
            selectedOptionBtn = btn;
            btn.classList.add('selected');
        };

        window.checkAnswer = function() {
            const currentSet = questionBank[state.currentSetIdx];
            const q = currentSet[state.currentQIdx];
            let isCorrect = false;
            let userAns = "";

            // Logic per type
            if (q.type === 'mcq') {
                if (!selectedOptionBtn) {
                    alert("Please select an option!");
                    return;
                }
                userAns = selectedOptionBtn.innerText;
                isCorrect = userAns === q.ans;
                
                // Visuals
                const buttons = DOM.qArea.querySelectorAll('.option-btn');
                buttons.forEach(btn => {
                    if (btn.innerText === q.ans) btn.classList.add('correct-visual');
                    if (btn === selectedOptionBtn && !isCorrect) btn.classList.add('wrong-visual');
                    btn.onclick = null; // Disable clicks
                });

            } else {
                const input = document.getElementById('ans-input');
                if (!input || !input.value.trim()) {
                    alert("Please type an answer!");
                    return;
                }
                userAns = input.value.trim().toLowerCase();

                if (q.type === 'text') {
                    // Fuzzy match for text (contains answer)
                    isCorrect = userAns === q.ans.toLowerCase() || userAns.includes(q.ans.toLowerCase());
                } else if (q.type === 'long') {
                    // Keyword matching
                    const hits = q.keywords.filter(k => userAns.includes(k));
                    isCorrect = hits.length >= 2; // Threshold matches
                    
                    // Specific feedback for long answers
                    if (isCorrect) {
                        DOM.feedback.innerHTML = `Excellent! You covered key points: ${hits.join(", ")}. ⭐`;
                    } else {
                        DOM.feedback.innerHTML = `Good try! Include keywords like: ${q.keywords.join(", ")}.`;
                    }
                }
            }

            // Update Score (Only if not already answered in this session logic - simplified here to always count)
            // Note: In a real app we might track unique IDs. Here we just increment.
            state.scores.total++;
            if (isCorrect) {
                state.scores.correct++;
                showFeedback(true, q.type === 'long' ? null : "Correct! Great Job! ⭐");
            } else {
                state.scores.wrong++;
                showFeedback(false, q.type === 'long' ? null : `Incorrect. The correct answer is: ${q.ans}`);
            }

            updateScoreUI();
            DOM.checkBtn.disabled = true;
            DOM.checkBtn.style.display = 'none';
            DOM.nextBtn.style.display = 'inline-block';
        };

        function showFeedback(success, msg) {
            DOM.feedback.className = `feedback ${success ? 'correct' : 'wrong'}`;
            if (msg) DOM.feedback.innerText = msg;
        }

        window.nextQuestion = function() {
            const currentSet = questionBank[state.currentSetIdx];
            if (state.currentQIdx < currentSet.length - 1) {
                state.currentQIdx++;
                selectedOptionBtn = null;
                loadQuestion();
            } else {
                alert("Set Completed! Moving to next set.");
                if (state.currentSetIdx < setsData.length - 1) {
                    switchSet(state.currentSetIdx + 1);
                } else {
                    alert("Congratulations! You have completed the entire syllabus!");
                }
            }
        };

        window.prevQuestion = function() {
            if (state.currentQIdx > 0) {
                state.currentQIdx--;
                selectedOptionBtn = null;
                loadQuestion();
            }
        };

        function updateScoreUI() {
            DOM.scoreCorrect.innerText = state.scores.correct;
            DOM.scoreWrong.innerText = state.scores.wrong;
            DOM.scoreTotal.innerText = state.scores.total;
            const pct = state.scores.total === 0 ? 0 : Math.round((state.scores.correct / state.scores.total) * 100);
            DOM.scorePercent.innerText = pct + "%";
            
            // Color code percentage
            if(pct >= 80) DOM.scorePercent.style.color = 'var(--success)';
            else if(pct >= 50) DOM.scorePercent.style.color = 'var(--warning)';
            else DOM.scorePercent.style.color = 'var(--secondary)';
        }

        // --- REVISION LOGIC ---
        const revisionNotes = [
            "Living things: Grow, breathe, reproduce. Plants use Stomata.",
            "Animals: Herbivores (plants), Carnivores (meat). Vertebrates have backbones.",
            "Body: 206 bones. Heart pumps blood. Lungs for breathing.",
            "Food: Carbs (Energy), Protein (Build), Vitamins (Protect).",
            "Matter: Solid, Liquid, Gas. Physical change is reversible.",
            "Force: Push/Pull. Friction opposes motion. Gravity pulls down.",
            "Earth: Rotates (Day/Night), Revolves (Seasons). Blue Planet.",
            "Safety: Cross at zebra crossing. Use sand for electric fire.",
            "Environment: 3Rs - Reduce, Reuse, Recycle. Save Water.",
            "General: Practice makes perfect! Review all chapters."
        ];

        window.toggleRevision = function() {
            const content = document.getElementById('revision-content');
            content.style.display = content.style.display === 'block' ? 'none' : 'block';
            updateRevisionContent(state.currentSetIdx);
        };

        function updateRevisionContent(idx) {
            const list = document.getElementById('revision-list');
            list.innerHTML = `<li>${revisionNotes[idx]}</li>`;
        }

        // Start
        init();

    </script>
