<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कक्षा 4 हिंदी - पाठ 12: भाषा गतिविधियाँ</title>
    
    <!-- Google Fonts: Kalam for Handwritten Hindi Style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-color: #FF9F1C;
            --secondary-color: #2EC4B6;
            --accent-color: #FFBF69;
            --text-color: #2B2D42;
            --bg-color: #CBF3F0;
            --paper-color: #FFFFFF;
            --wrong-color: #EF476F;
            --correct-color: #06D6A0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Kalam', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            font-weight: 700; /* GLOBAL BOLD RULE */
            font-size: 18px;
            background-image: radial-gradient(#2EC4B6 0.5px, transparent 0.5px), radial-gradient(#2EC4B6 0.5px, #CBF3F0 0.5px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HERO SECTION */
        header {
            text-align: center;
            background: var(--primary-color);
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            border: 3px solid var(--text-color);
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 2px 2px 0px #000;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 10px;
        }

        /* SCORE PANEL */
        .score-panel {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: var(--paper-color);
            border: 3px solid var(--text-color);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-label {
            font-size: 0.9rem;
            color: #666;
        }

        .score-value {
            font-size: 1.4rem;
            color: var(--secondary-color);
        }

        /* SECTIONS */
        section {
            background: var(--paper-color);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 2px solid var(--text-color);
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
        }

        .section-title {
            background: var(--secondary-color);
            color: white;
            display: inline-block;
            padding: 5px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 1.5rem;
            transform: rotate(-2deg);
            border: 2px solid var(--text-color);
        }

        /* NOTES STYLE */
        .topic-card {
            background: #fff;
            border-left: 5px solid var(--primary-color);
            padding: 20px;
            margin-bottom: 25px;
            position: relative;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 1.5em;
            line-height: 1.5em;
        }

        .topic-header {
            color: var(--primary-color);
            font-size: 1.4rem;
            margin-bottom: 10px;
            background: white;
            display: inline-block;
            padding: 0 5px;
        }

        .example-box {
            background: #FFF3CD;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px dashed #FFC107;
        }

        .tip-box {
            background: #E2F0CB;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
            border: 2px dashed #8DB600;
        }

        .image-placeholder {
            width: 100%;
            height: 150px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin: 15px 0;
            border: 2px dotted #ccc;
            color: #888;
        }

        /* QUESTIONS */
        .question-card {
            display: none; /* Only show active */
            animation: fadeIn 0.5s;
        }

        .question-card.active {
            display: block;
        }

        .q-text {
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--text-color);
            padding: 15px;
            text-align: left;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .option-btn:hover {
            background: #f9f9f9;
            transform: scale(1.01);
        }

        .option-btn.correct {
            background: var(--correct-color);
            color: white;
            border-color: #04ad80;
        }

        .option-btn.wrong {
            background: var(--wrong-color);
            color: white;
            border-color: #d6335a;
        }

        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        /* LONG ANSWERS */
        .long-q-card {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px dashed #ccc;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-top: 10px;
            padding: 10px;
            border: 2px solid var(--text-color);
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
        }

        .check-btn {
            background: var(--primary-color);
            color: white;
            border: 2px solid var(--text-color);
            padding: 10px 25px;
            border-radius: 50px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }

        .check-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* REVISION */
        .revision-point {
            margin-bottom: 10px;
            display: flex;
            align-items: start;
        }

        .bullet {
            color: var(--primary-color);
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 20px;
            background: var(--text-color);
            color: white;
            margin-top: 40px;
            border-radius: 15px 15px 0 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .score-panel { grid-template-columns: repeat(3, 1fr); font-size: 0.8rem; }
            .section-title { font-size: 1.2rem; }
        }
        
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .nav-btn {
            background: var(--secondary-color);
            color: white;
            border: 2px solid var(--text-color);
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .imp-q-item {
            background: #fdfdfd;
            border: 2px solid #ddd;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 10px;
        }
        .imp-q-head {
            color: var(--secondary-color);
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>कक्षा 4 – हिंदी</h1>
        <h2>पाठ 12: भाषा गतिविधियाँ, परियोजना एवं मूल्यांकन</h2>
    </header>

    <!-- LIVE SCORE PANEL -->
    <div class="score-panel">
        <div class="score-item">
            <span class="score-label">सही</span>
            <span class="score-value" id="score-correct">0</span>
        </div>
        <div class="score-item">
            <span class="score-label">गलत</span>
            <span class="score-value" id="score-wrong">0</span>
        </div>
        <div class="score-item">
            <span class="score-label">प्रयास</span>
            <span class="score-value" id="score-total">0</span>
        </div>
        <div class="score-item">
            <span class="score-label">प्रतिशत</span>
            <span class="score-value" id="score-percent">0%</span>
        </div>
        <div class="score-item">
            <span class="score-label">अंक</span>
            <span class="score-value" id="score-points">0</span>
        </div>
    </div>

    <!-- NOTES SECTION -->
    <section id="notes-section">
        <div class="section-title">अध्ययन नोट्स</div>
        <div id="notes-container"></div>
    </section>

    <!-- IMPORTANT QUESTIONS -->
    <section>
        <div class="section-title">महत्वपूर्ण प्रश्न (परीक्षा के लिए)</div>
        <div id="imp-questions-container"></div>
    </section>

    <!-- PRACTICE QUESTIONS (70) -->
    <section>
        <div class="section-title">अभ्यास प्रश्नोत्तरी (क्विज़)</div>
        <div id="practice-quiz-container">
            <div id="quiz-wrapper"></div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="prevQuestion()" id="btn-prev" disabled>पीछे</button>
                <div style="margin-top:10px;">प्रश्न <span id="current-q-num">1</span> / 70</div>
                <button class="nav-btn" onclick="nextQuestion()" id="btn-next">अगला</button>
            </div>
        </div>
    </section>

    <!-- ADVANCED LONG QUESTIONS -->
    <section>
        <div class="section-title">दीर्घ उत्तरीय प्रश्न (सोच-विचार)</div>
        <div id="long-questions-container"></div>
    </section>

    <!-- REVISION -->
    <section>
        <div class="section-title">तेज़ दोहराव</div>
        <button class="check-btn" onclick="toggleRevision()" style="margin-bottom:20px;">सारांश दिखाएँ/छिपाएँ</button>
        <div id="revision-container" style="display:none;"></div>
    </section>

    <footer>
        Designed & Created by SHRISHANT YADAV<br>ShanEduHub
    </footer>
</div>

<script>
    // DATA STORE

    const notesData = [

        const totalAttempts = scoreCorrect + scoreWrong;
        const percent = totalAttempts === 0 ? 0 : Math.round((scoreCorrect / totalAttempts) * 100);
        
        document.getElementById('score-correct').innerText = scoreCorrect;
        document.getElementById('score-wrong').innerText = scoreWrong;

    // LOGIC FUNCTIONS

    window.checkAnswer = function(qIndex, selectedOptIndex, btnElement) {
        // Prevent multiple clicks
        if (btnElement.parentElement.classList.contains('answered')) return;
        
        const qData = practiceQuestionsData[qIndex];
        const feedbackBox = document.getElementById(`feedback-${qIndex}`);
        const parentGrid = btnElement.parentElement;
        
        parentGrid.classList.add('answered'); // Lock options

        if (selectedOptIndex === qData.ans) {
            // Correct
            btnElement.classList.add('correct');
            feedbackBox.innerHTML = `<strong>बहुत बढ़िया! ⭐</strong><br>${qData.exp}`;
            feedbackBox.style.backgroundColor = '#d1e7dd';
            feedbackBox.style.color = '#0f5132';
            feedbackBox.style.border = '1px solid #badbcc';
            scoreCorrect++;
            scorePoints += 10;
        } else {
            // Wrong
            btnElement.classList.add('wrong');
            // Highlight correct one
            parentGrid.children[qData.ans].classList.add('correct');
            
            feedbackBox.innerHTML = `<strong>गलत जवाब। फिर से प्रयास करें।</strong><br>सही उत्तर: ${qData.opts[qData.ans]}<br>व्याख्या: ${qData.exp}`;
            feedbackBox.style.backgroundColor = '#f8d7da';
            feedbackBox.style.color = '#842029';
            feedbackBox.style.border = '1px solid #f5c2c7';
            scoreWrong++;
        }
        
        feedbackBox.classList.add('show');
        updateScoreBoard();
    };

    window.nextQuestion = function() {
        if (currentQIndex < totalQuestions - 1) {
            document.getElementById(`q-card-${currentQIndex}`).classList.remove('active');
            currentQIndex++;
            document.getElementById(`q-card-${currentQIndex}`).classList.add('active');
            updateNav();
        }
    };

    window.prevQuestion = function() {
        if (currentQIndex > 0) {
            document.getElementById(`q-card-${currentQIndex}`).classList.remove('active');
            currentQIndex--;
            document.getElementById(`q-card-${currentQIndex}`).classList.add('active');
            updateNav();
        }
    };

    function updateNav() {
        document.getElementById('current-q-num').innerText = currentQIndex + 1;
        document.getElementById('btn-prev').disabled = (currentQIndex === 0);
        document.getElementById('btn-next').disabled = (currentQIndex === totalQuestions - 1);
        if (currentQIndex === totalQuestions - 1) {
            document.getElementById('btn-next').innerText = "समाप्त";
        } else {
            document.getElementById('btn-next').innerText = "अगला";
        }
    }

    window.checkLongAnswer = function(index) {
        const input = document.getElementById(`long-ans-${index}`).value.trim();
        const feedbackBox = document.getElementById(`long-feedback-${index}`);
        const data = longQuestionsData[index];
        
        if (input.length < 5) {
            alert("कृपया थोड़ा बड़ा उत्तर लिखें।");
            return;
        }

        let matchCount = 0;
        data.keywords.forEach(word => {
            if (input.includes(word)) matchCount++;
        });

        let points = 0;
        let msg = "";
        let colorClass = "";

        if (matchCount >= 2) {
            points = 50; // Full marks for long q
            msg = "शानदार! आपने मुख्य बिंदु शामिल किए हैं। ⭐⭐⭐";
            colorClass = "#d1e7dd";
            scoreCorrect++;
            scorePoints += points;
        } else if (matchCount >= 1) {
            points = 20;
            msg = "अच्छा प्रयास! लेकिन थोड़ा और विस्तार से लिखें। ⭐";
            colorClass = "#fff3cd";
            scorePoints += points;
            scoreCorrect++; // Count as correct attempt partially
        } else {
            msg = "उत्तर अपूर्ण है। मुख्य शब्दों का प्रयोग करें।";
            colorClass = "#f8d7da";
            scoreWrong++;
        }

        feedbackBox.style.backgroundColor = colorClass;
        feedbackBox.style.display = 'block';
        feedbackBox.innerHTML = `
            <p><strong>${msg}</strong> (अंक मिले: ${points})</p>
            <div style="margin-top:10px; background:white; padding:10px; border-radius:5px; border:1px solid #ccc;">
                <strong>मॉडल उत्तर (मुख्य बिंदु):</strong><br>
                <pre style="white-space: pre-wrap; font-family:inherit;">${data.model}</pre>
            </div>
        `;
        
        // Disable button after check
        event.target.disabled = true;
        event.target.innerText = "जाँच हो गई";
        updateScoreBoard();
    };

    window.toggleRevision = function() {
        const div = document.getElementById('revision-container');
        if (div.style.display === 'none') {
            div.style.display = 'block';
        } else {
            div.style.display = 'none';
        }
    };

</script>

</body>
