/* ================= LOGIC & RENDERING ================= */

let score = { correct: 0, wrong: 0, total: 0 };
let attemptedQ = new Set(); // To prevent re-answering practice Qs

// Initialization
window.onload = function() {
    renderTopics();
    renderImportantQuestions();
    renderPracticeQuestions();
    renderLongQuestions();
    renderRevision();
};

function renderTopics() {
    const container = document.getElementById('notes-container');
    topics.forEach((t, index) => {
        container.innerHTML += `
            <div class="topic-card">
                <div class="topic-title">${t.title}</div>
                <div class="image-box">${t.icon}</div>
                <div class="topic-section"><span class="label">Definition:</span> ${t.def}</div>
                <div class="topic-section"><span class="label">Explanation:</span> ${t.expl}</div>
                <div class="topic-section"><span class="label">Indian Example:</span> ${t.ex}</div>
                <div class="topic-section" style="background:#fffdd0; padding:5px; border-radius:5px;">
                    💡 <b>Memory Tip:</b> ${t.tip}
                </div>
                <div style="margin-top:10px; border-top:1px dashed #ccc; padding-top:5px; font-size:0.9rem;">
                    ❓ <b>Check:</b> ${t.q} <br>
                    ✔️ <b>Ans:</b> ${t.a}
                </div>
            </div>
        `;
    });
}

function renderImportantQuestions() {
    const container = document.getElementById('important-questions-container');
    importantQuestions.forEach((item, index) => {
        container.innerHTML += `
            <div class="imp-q-item">
                <b>Q${index+1}: ${item.q}</b><br>
                <span style="color:green">Ans: ${item.a}</span>
            </div>
        `;
    });
}

function renderPracticeQuestions() {
    const container = document.getElementById('practice-questions-container');
    qData.forEach((q, index) => {
        // Balance options roughly - Logic handled in data generation
        let optsHtml = '';
        q.opts.forEach((opt, oIndex) => {
            optsHtml += `<button class="option-btn" id="q${index}_opt${oIndex}" onclick="checkPracticeAnswer(${index}, ${oIndex}, ${q.ans})">${opt}</button>`;
        });

        container.innerHTML += `
            <div class="question-box" id="qbox_${index}">
                <div><b>Q${index+1}:</b> ${q.q}</div>
                <div class="options-grid">${optsHtml}</div>
                <div class="feedback" id="feedback_${index}"></div>
            </div>
        `;
    });
}

function checkPracticeAnswer(qIndex, selectedOpt, correctOpt) {
    if (attemptedQ.has(qIndex)) return; // Prevent multiple attempts
    attemptedQ.add(qIndex);

    const feedbackEl = document.getElementById(`feedback_${qIndex}`);
    const correctBtn = document.getElementById(`q${qIndex}_opt${correctOpt}`);
    const selectedBtn = document.getElementById(`q${qIndex}_opt${selectedOpt}`);

    // UI Updates
    if (selectedOpt === correctOpt) {
        selectedBtn.classList.add('correct');
        selectedBtn.innerHTML += " ✅";
        feedbackEl.innerHTML = "<b>Excellent ⭐</b> Well done!";
        feedbackEl.style.background = "#dff9fb";
        feedbackEl.style.color = "green";
        score.correct++;
    } else {
        selectedBtn.classList.add('wrong');
        selectedBtn.innerHTML += " ❌";
        correctBtn.classList.add('correct'); // Show correct one
        correctBtn.innerHTML += " ✅";
        
        feedbackEl.innerHTML = `<b>Try Again.</b><br>Why wrong? ${qData[qIndex].exp}`;
        feedbackEl.style.background = "#ffcccc";
        feedbackEl.style.color = "#d63031";
        score.wrong++;
    }

    feedbackEl.classList.add('show');
    score.total++;
    updateScoreUI();
}

function renderLongQuestions() {
    const container = document.getElementById('long-questions-container');
    longQuestions.forEach((lq, index) => {
        container.innerHTML += `
            <div class="question-box">
                <div><b>LQ ${index+1}:</b> ${lq.q}</div>
                <textarea id="la_input_${index}" placeholder="Type your answer here..."></textarea>
                <button class="btn btn-check" id="la_btn_${index}" onclick="checkLongAnswer(${index})">Check Answer</button>
                <div class="feedback" id="la_feedback_${index}"></div>
            </div>
        `;
    });
}

function checkLongAnswer(index) {
    const btn = document.getElementById(`la_btn_${index}`);
    if(btn.disabled) return;
    
    const input = document.getElementById(`la_input_${index}`).value.toLowerCase();
    const feedback = document.getElementById(`la_feedback_${index}`);
    const q = longQuestions[index];
    
    if (input.trim().length < 5) {
        alert("Please write a longer answer.");
        return;
    }

    // Keyword matching logic
    let hits = 0;
    q.keywords.forEach(k => {
        if (input.includes(k)) hits++;
    });

    // Evaluation
    let isCorrect = hits >= 2; // Loose check for Class 5
    
    btn.disabled = true;
    btn.style.opacity = "0.6";

    score.total++;
    
    let modelHtml = `<b>Key Points needed:</b><pre>${q.model}</pre>`;

    if (isCorrect) {
        score.correct++;
        feedback.innerHTML = `<b>Good Attempt! ⭐</b><br>You covered key concepts.<br>${modelHtml}`;
        feedback.style.background = "#dff9fb";
        feedback.style.color = "green";
    } else {
        score.wrong++;
        feedback.innerHTML = `<b>Needs Improvement.</b><br>Try to include words like: ${q.keywords.slice(0,3).join(", ")}.<br>${modelHtml}`;
        feedback.style.background = "#ffcccc";
        feedback.style.color = "#d63031";
    }
    feedback.classList.add('show');
    updateScoreUI();
}

function renderRevision() {
    const list = document.getElementById('revision-list');
    topics.forEach(t => {
        list.innerHTML += `<li><b>${t.title.split('.')[1]}:</b> ${t.def}</li>`;
    });
}

function toggleRevision() {
    const box = document.getElementById('revision-content');
    if (box.style.display === "block") {
        box.style.display = "none";
    } else {
        box.style.display = "block";
        window.location.hash = "revision-content";
    }
}

function updateScoreUI() {
    document.getElementById('score-correct').innerText = score.correct;
    document.getElementById('score-wrong').innerText = score.wrong;
    document.getElementById('score-total').innerText = score.total;
    
    let percent = score.total === 0 ? 0 : Math.round((score.correct / score.total) * 100);
    document.getElementById('score-percent').innerText = percent + "%";
}
