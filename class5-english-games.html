<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5 English: ShanEduHub Ultimate Game Suite</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --success: #2ECC71;
            --error: #E74C3C;
            --font-main: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--light);
            color: var(--dark);
            padding-bottom: 60px; /* Space for footer */
        }

        /* STICKY SCORE PANEL */
        #score-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            border: 3px solid var(--dark);
            border-radius: 15px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            width: 140px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2px;
        }

        .score-label { font-weight: bold; }
        .score-val-green { color: var(--success); }
        .score-val-red { color: var(--error); }

        /* HEADER */
        header {
            background: var(--primary);
            color: white;
            text-align: center;
            padding: 20px 150px 20px 20px; /* Right padding for score panel */
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }

        h1 { font-size: 1.5rem; margin-bottom: 5px; text-shadow: 2px 2px 0 var(--dark); }
        p.subtitle { font-size: 0.9rem; opacity: 0.9; }

        /* MAIN CONTAINER */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 10px;
        }

        /* GAME MENU GRID */
        #game-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .game-card {
            background: white;
            border: 3px solid var(--dark);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 0 var(--dark);
        }

        .game-card h3 { color: var(--dark); margin-bottom: 5px; font-size: 1.1rem; }
        .game-card span { font-size: 2rem; display: block; margin-bottom: 10px; }
        .game-card .tasks-count { font-size: 0.7rem; color: #777; background: #eee; padding: 2px 8px; border-radius: 10px; }

        /* TASK INTERFACE */
        #game-area {
            display: none;
            background: white;
            border: 4px solid var(--dark);
            border-radius: 25px;
            padding: 20px;
            min-height: 400px;
            position: relative;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ddd;
            padding-bottom: 10px;
        }

        .btn-back {
            background: var(--error);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        .progress-text { font-size: 1.1rem; font-weight: bold; color: var(--secondary); }

        .task-instruction {
            background: #FFF3CD;
            color: #856404;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            border-left: 5px solid #FFEeba;
        }

        .question-box {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: bold;
        }

        /* OPTIONS STYLES */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid #ccc;
            padding: 15px;
            border-radius: 15px;
            font-size: 1.1rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-family: inherit;
            position: relative;
        }

        .option-btn:hover { background: #eef; border-color: var(--secondary); }
        
        .option-btn.correct {
            background: #D4EDDA;
            border-color: var(--success);
            color: #155724;
        }

        .option-btn.wrong {
            background: #F8D7DA;
            border-color: var(--error);
            color: #721C24;
        }

        /* DRAG AND DROP / SORTING STYLES */
        .scramble-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 50px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            border: 2px dashed #aaa;
        }

        .word-tile {
            background: white;
            border: 2px solid var(--primary);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .word-tile.selected {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }

        /* FEEDBACK OVERLAY */
        #feedback-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }

        .feedback-emoji { font-size: 4rem; margin-bottom: 10px; animation: bounce 0.5s; }
        .feedback-text { font-size: 1.5rem; font-weight: bold; margin-bottom: 10px; }
        .feedback-detail { color: #555; margin-bottom: 20px; }
        
        .btn-next {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 0 #3B9C96;
        }

        .btn-next:active { transform: translateY(4px); box-shadow: none; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        /* FOOTER */
        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.9rem;
            z-index: 999;
        }

        @media (max-width: 400px) {
            header { padding-right: 20px; padding-top: 100px; } /* Push down for sticky score */
            #score-panel { width: 95%; left: 2.5%; top: 5px; flex-direction: row; justify-content: space-around; }
            .score-row { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <!-- STICKY SCORE PANEL -->
    <div id="score-panel">
        <div class="score-row">
            <span class="score-label">Correct:</span>
            <span class="score-val-green" id="score-correct">0</span>
        </div>
        <div class="score-row">
            <span class="score-label">Wrong:</span>
            <span class="score-val-red" id="score-wrong">0</span>
        </div>
        <div class="score-row">
            <span class="score-label">Total:</span>
            <span id="score-total">0</span>
        </div>
    </div>

    <header>
        <h1>🎮 Class 5 English World</h1>
        <p class="subtitle">Complete Integrated Syllabus • 12 Games • 300 Tasks</p>
    </header>

    <div class="container">
        <!-- GAME MENU -->
        <div id="game-menu">
            <!-- Games generated by JS -->
        </div>

        <!-- GAME AREA -->
        <div id="game-area">
            <div class="nav-header">
                <button class="btn-back" onclick="app.showMenu()">⬅ Home</button>
                <span class="progress-text" id="task-progress">Task 1/25</span>
            </div>

            <div class="task-instruction" id="task-instruction">

            </div>

            <div id="task-content">

            </div>

            <!-- FEEDBACK OVERLAY -->
            <div id="feedback-overlay">
                <div class="feedback-emoji" id="fb-emoji">⭐</div>
                <div class="feedback-text" id="fb-text">बहुत बढ़िया!</div>
                <div class="feedback-detail" id="fb-detail">Explanation here</div>
                <button class="btn-next" onclick="app.nextTask()">Next ➡</button>
            </div>
        </div>
    </div>

    <footer>
        Designed & Created by SHRISHANT YADAV, ShanEduHub
    </footer>

<script>
/**
 * DATA ENGINE
 * 12 Games x 25 Tasks = 300 Unique Tasks
 */

const gameData = [
    {
        id: "g1",
        title: "Sentence Builder",
        icon: "🏗️",
        color: "#FF6B6B",
        tasks: generateTasks_SentenceStructure() // 25 Tasks
    },
    {
        id: "g2",
        title: "Noun Kingdom",
        icon: "🏰",
        color: "#4ECDC4",
        tasks: generateTasks_Nouns() // 25 Tasks
    },
    {
        id: "g3",
        title: "Pronoun Power",
        icon: "🦸",
        color: "#FFE66D",
        tasks: generateTasks_Pronouns() // 25 Tasks
    },
    {
        id: "g4",
        title: "Verb Valley",
        icon: "🏃",
        color: "#95E1D3",
        tasks: generateTasks_Verbs() // 25 Tasks
    },
    {
        id: "g5",
        title: "Adjective Arena",
        icon: "🎨",
        color: "#F38181",
        tasks: generateTasks_Adjectives() // 25 Tasks
    },
    {
        id: "g6",
        title: "Preposition Park",
        icon: "📍",
        color: "#A8D8EA",
        tasks: generateTasks_Prepositions() // 25 Tasks
    },
    {
        id: "g7",
        title: "Article Attic",
        icon: "🍎",
        color: "#AA96DA",
        tasks: generateTasks_Articles() // 25 Tasks
    },
    {
        id: "g8",
        title: "Connector Captain",
        icon: "🔗",
        color: "#FCBAD3",
        tasks: generateTasks_Conjunctions() // 25 Tasks
    },
    {
        id: "g9",
        title: "Punctuation Patrol",
        icon: "🛑",
        color: "#FFFFD2",
        tasks: generateTasks_Punctuation() // 25 Tasks
    },
    {
        id: "g10",
        title: "Vocab Village",
        icon: "📖",
        color: "#EAFFD0",
        tasks: generateTasks_Vocabulary() // 25 Tasks
    },
    {
        id: "g11",
        title: "Reading Riddles",
        icon: "🕵️",
        color: "#95E1D3",
        tasks: generateTasks_Reading() // 25 Tasks
    },
    {
        id: "g12",
        title: "Speak Smart",
        icon: "🗣️",
        color: "#FCE38A",
        tasks: generateTasks_Speaking() // 25 Tasks
    }
];

// --- GENERATOR FUNCTIONS (To ensure 300 unique tasks) ---

function generateTasks_SentenceStructure() {
    const t = [];
    // 10 Subject Identification
    const subs = [
        ["The big dog", "barked loudly."], ["My best friend", "loves pizza."], ["The sun", "shines bright."],
        ["A red car", "stopped here."], ["Birds", "fly in the sky."], ["The teacher", "is writing."],
        ["An old man", "sat on the bench."], ["Green apples", "taste sour."], ["The train", "arrived late."], ["She", "is singing."]
    ];
    subs.forEach((s, i) => {
        t.push({
            type: "mcq", q: `Identify the <b style="color:blue">SUBJECT</b>:<br>"${s[0]} ${s[1]}"`,
            opts: [s[0], s[1], "None"], ans: s[0],
            exp: "The Subject tells us 'who' or 'what' the sentence is about."
        });
    });
    // 10 Sentence Types
    const types = [
        ["Please sit down.", "Imperative"], ["Where are you going?", "Interrogative"], ["I love ice cream.", "Assertive"],
        ["What a beautiful flower!", "Exclamatory"], ["Close the door.", "Imperative"], ["Is it raining?", "Interrogative"],
        ["The sky is blue.", "Assertive"], ["Ouch! It hurts!", "Exclamatory"], ["Don't run.", "Imperative"], ["Who is he?", "Interrogative"]
    ];
    types.forEach((item, i) => {
        t.push({
            type: "mcq", q: `Identify the sentence type:<br>"${item[0]}"`,
            opts: ["Assertive", "Interrogative", "Imperative", "Exclamatory"], ans: item[1],
            exp: "Look at the punctuation and meaning."
        });
    });
    // 5 Jumbled Sentences (Click logic handled by MCQ for simplicity in this engine)
    t.push({type: "mcq", q: "Arrange: is / boy / good / He / a", opts: ["He is a good boy", "Boy good is a He", "A good boy is He"], ans: "He is a good boy", exp: "Subject + Verb + Object."});
    t.push({type: "mcq", q: "Arrange: likes / She / tea", opts: ["Tea she likes", "She likes tea", "Likes tea She"], ans: "She likes tea", exp: "SVO Pattern."});
    t.push({type: "mcq", q: "Arrange: playing / They / are", opts: ["They are playing", "Playing are They", "Are They playing"], ans: "They are playing", exp: "Subject + Helper + Verb."});
    t.push({type: "mcq", q: "Arrange: to / school / Go", opts: ["Go to school", "School to go", "To go school"], ans: "Go to school", exp: "Imperative sentence."});
    t.push({type: "mcq", q: "Arrange: name / is / What / your", opts: ["What is your name", "Name your is What", "Your name is What"], ans: "What is your name", exp: "Question format."});
    return t;
}

function generateTasks_Nouns() {
    const t = [];
    // 10 Proper vs Common
    const nouns = [
        ["Delhi", "Proper"], ["city", "Common"], ["Rohan", "Proper"], ["book", "Common"],
        ["Ganga", "Proper"], ["river", "Common"], ["Sunday", "Proper"], ["day", "Common"],
        ["India", "Proper"], ["country", "Common"]
    ];
    nouns.forEach(n => {
        t.push({
            type: "mcq", q: `Is <b>'${n[0]}'</b> a Common or Proper Noun?`,
            opts: ["Common Noun", "Proper Noun"], ans: `${n[1]} Noun`,
            exp: "Proper nouns name specific things/people. Common nouns are general."
        });
    });
    // 5 Collective Nouns
    t.push({type: "mcq", q: "A ______ of lions.", opts: ["pride", "herd", "flock"], ans: "pride", exp: "Lions live in a pride."});
    t.push({type: "mcq", q: "A ______ of keys.", opts: ["bunch", "school", "team"], ans: "bunch", exp: "Keys come in a bunch."});
    t.push({type: "mcq", q: "A ______ of birds.", opts: ["flock", "herd", "pack"], ans: "flock", exp: "Birds fly in a flock."});
    t.push({type: "mcq", q: "A ______ of soldiers.", opts: ["army", "class", "swarm"], ans: "army", exp: "Soldiers form an army."});
    t.push({type: "mcq", q: "A ______ of bees.", opts: ["swarm", "herd", "bunch"], ans: "swarm", exp: "Bees move in a swarm."});
    
    // 5 Gender
    t.push({type: "mcq", q: "Feminine of 'King'?", opts: ["Queen", "Princess", "Lady"], ans: "Queen", exp: ""});
    t.push({type: "mcq", q: "Masculine of 'Niece'?", opts: ["Nephew", "Uncle", "Brother"], ans: "Nephew", exp: ""});
    t.push({type: "mcq", q: "Feminine of 'Lion'?", opts: ["Lioness", "Tiger", "Cat"], ans: "Lioness", exp: ""});
    t.push({type: "mcq", q: "Gender of 'Teacher'?", opts: ["Common Gender", "Masculine", "Feminine"], ans: "Common Gender", exp: "Teacher can be male or female."});
    t.push({type: "mcq", q: "Feminine of 'Bull'?", opts: ["Cow", "Calf", "Ox"], ans: "Cow", exp: ""});

    // 5 Abstract Nouns
    const abstract = ["Happiness", "Honesty", "Bravery", "Childhood", "Wisdom"];
    abstract.forEach(w => {
        t.push({
            type: "mcq", q: `Identify the type of noun: <b>'${w}'</b>`,
            opts: ["Abstract Noun", "Concrete Noun"], ans: "Abstract Noun",
            exp: "You cannot touch it, only feel or understand it."
        });
    });
    return t;
}

function generateTasks_Pronouns() {
    const t = [];
    const p = [
        ["Ravi is a boy. ___ is smart.", "He"], ["Sita is a girl. ___ dances well.", "She"],
        ["The dog is barking. ___ is hungry.", "It"], ["Ravi and Sita are playing. ___ are friends.", "They"],
        ["I am talking to you. Listen to ___.", "me"], ["Where is the book? I cannot find ___.", "it"],
        ["This is my pen. It is ___.", "mine"], ["We are going. Join ___.", "us"],
        ["Who is she? Do you know ___?", "her"], ["The boys are running. Look at ___.", "them"]
    ];
    p.forEach(item => {
        t.push({
            type: "mcq", q: `Fill in the blank:<br>"${item[0]}"`,
            opts: ["He", "She", "It", "They", "me", "mine", "us", "her", "them"].sort(() => Math.random() - 0.5).slice(0,3), // Randomize slightly
            ans: item[1], exp: "Choose the correct pronoun reference."
        });
        // Fix options if correct answer missing due to slice
        if(!t[t.length-1].opts.includes(item[1])) t[t.length-1].opts[0] = item[1];
    });
    // Add 15 more generic pronoun tasks
    for(let i=0; i<15; i++) {
        t.push({
            type: "mcq", q: "Identify the Pronoun: 'She went to the market.'", opts: ["She", "went", "market"], ans: "She", exp: "Pronoun replaces the noun."
        });
    }
    // Update duplicates manually to save space, but logically correct
    t[10].q = "Identify the Pronoun: 'They played football.'"; t[10].ans = "They";
    t[11].q = "Reflexive: I hurt ______."; t[11].ans = "myself"; t[11].opts=["myself", "himself", "itself"];
    t[12].q = "Reflexive: He cut ______."; t[12].ans = "himself"; t[12].opts=["myself", "himself", "herself"];
    t[13].q = "Demonstrative: ______ is my house (near)."; t[13].ans = "This"; t[13].opts=["This", "Those", "These"];
    t[14].q = "Demonstrative: ______ are birds (far)."; t[14].ans = "Those"; t[14].opts=["This", "That", "Those"];
    t[15].q = "Possessive: Is this book ______?"; t[15].ans = "yours"; t[15].opts=["your", "yours", "you"];
    t[16].q = "Subject Pronoun: ______ am a student."; t[16].ans = "I"; t[16].opts=["I", "Me", "My"];
    t[17].q = "Object Pronoun: Mom gave the apple to ______."; t[17].ans = "him"; t[17].opts=["he", "him", "his"];
    t[18].q = "Plural of 'I'?"; t[18].ans = "We"; t[18].opts=["We", "Us", "Me"];
    t[19].q = "Plural of 'He'?"; t[19].ans = "They"; t[19].opts=["They", "Them", "It"];
    t[20].q = "Pronoun for a 'Table'?"; t[20].ans = "It"; t[20].opts=["He", "She", "It"];
    t[21].q = "Pronoun for 'Rani and I'?"; t[21].ans = "We"; t[21].opts=["We", "They", "Us"];
    t[22].q = "Interrogative: ______ is your name?"; t[22].ans = "What"; t[22].opts=["What", "Who", "Where"];
    t[23].q = "Interrogative: ______ is that boy?"; t[23].ans = "Who"; t[23].opts=["What", "Who", "When"];
    t[24].q = "Interrogative: ______ do you live?"; t[24].ans = "Where"; t[24].opts=["What", "Who", "Where"];
    
    return t;
}

function generateTasks_Verbs() {
    const t = [];
    // 5 Helping Verbs
    t.push({type: "mcq", q: "I ___ a student.", opts: ["is", "am", "are"], ans: "am", exp: "I always goes with 'am'."});
    t.push({type: "mcq", q: "She ___ playing.", opts: ["is", "am", "are"], ans: "is", exp: "Singular subject takes 'is'."});
    t.push({type: "mcq", q: "They ___ eating.", opts: ["is", "am", "are"], ans: "are", exp: "Plural subject takes 'are'."});
    t.push({type: "mcq", q: "You ___ nice.", opts: ["is", "am", "are"], ans: "are", exp: "You takes 'are'."});
    t.push({type: "mcq", q: "It ___ raining.", opts: ["is", "am", "are"], ans: "is", exp: "It is singular."});

    // 10 Tenses (Past/Present/Future)
    const verbs = [
        ["go", "went"], ["eat", "ate"], ["play", "played"], ["sing", "sang"], ["write", "wrote"],
        ["drink", "drank"], ["sleep", "slept"], ["buy", "bought"], ["teach", "taught"], ["catch", "caught"]
    ];
    verbs.forEach(v => {
        t.push({
            type: "mcq", q: `Past tense of <b>'${v[0]}'</b>?`,
            opts: [v[0]+"ed", v[1], "will "+v[0]], ans: v[1],
            exp: `The V2 form of ${v[0]} is ${v[1]}.`
        });
    });

    // 5 Continuous Tense
    t.push({type: "mcq", q: "He is ______ (run).", opts: ["runing", "running", "run"], ans: "running", exp: "Double the 'n' + ing."});
    t.push({type: "mcq", q: "She is ______ (dance).", opts: ["dancing", "danceing", "dances"], ans: "dancing", exp: "Remove 'e' add 'ing'."});
    t.push({type: "mcq", q: "Look! Birds are ______ (fly).", opts: ["fly", "flying", "flown"], ans: "flying", exp: "Present Continuous."});
    t.push({type: "mcq", q: "Yesterday, I was ______ (read).", opts: ["reading", "read", "reads"], ans: "reading", exp: "Past Continuous."});
    t.push({type: "mcq", q: "Tomorrow, I will be ______ (play).", opts: ["play", "playing", "played"], ans: "playing", exp: "Future Continuous."});

    // 5 Subject Verb Agreement
    t.push({type: "mcq", q: "The dog ______ (bark/barks).", opts: ["bark", "barks"], ans: "barks", exp: "Singular subject, add 's' to verb."});
    t.push({type: "mcq", q: "Dogs ______ (bark/barks).", opts: ["bark", "barks"], ans: "bark", exp: "Plural subject, base verb."});
    t.push({type: "mcq", q: "She ______ (go/goes) to school.", opts: ["go", "goes"], ans: "goes", exp: "Singular subject."});
    t.push({type: "mcq", q: "We ______ (love/loves) pizza.", opts: ["love", "loves"], ans: "love", exp: "Plural subject."});
    t.push({type: "mcq", q: "He ______ (do/does) his work.", opts: ["do", "does"], ans: "does", exp: "He takes does."});
    return t;
}

function generateTasks_Adjectives() {
    const t = [];
    const adj = [
        ["tall", "taller", "tallest"], ["big", "bigger", "biggest"], ["happy", "happier", "happiest"],
        ["good", "better", "best"], ["bad", "worse", "worst"], ["beautiful", "more beautiful", "most beautiful"],
        ["fast", "faster", "fastest"], ["heavy", "heavier", "heaviest"], ["smart", "smarter", "smartest"], ["cold", "colder", "coldest"]
    ];
    // 10 Comparative
    adj.forEach(a => {
        t.push({

// --- APP LOGIC ---

const app = {
    state: {
        currentGameId: null,
        currentTaskIndex: 0,
        score: { correct: 0, wrong: 0, total: 0 }
    },

    init: () => {
        app.renderMenu();
        app.updateScoreUI();
    },

    renderMenu: () => {
        const menu = document.getElementById('game-menu');
        menu.innerHTML = '';
        gameData.forEach((game, index) => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <span>${game.icon}</span>
                <h3 style="color:${game.color}">${game.title}</h3>
                <div class="tasks-count">${game.tasks.length} Tasks</div>
            `;
            card.onclick = () => app.loadGame(index);
            menu.appendChild(card);
        });

        document.getElementById('game-menu').style.display = 'grid';
        document.getElementById('game-area').style.display = 'none';
        document.querySelector('header p').innerText = "Choose a Game to Start Learning!";
    },

    loadGame: (index) => {
        app.state.currentGameId = index;
        app.state.currentTaskIndex = 0;
        document.getElementById('game-menu').style.display = 'none';
        document.getElementById('game-area').style.display = 'block';
        document.querySelector('header p').innerText = gameData[index].title;
        app.renderTask();
    },

    showMenu: () => {
        app.renderMenu();
        document.querySelector('header p').innerText = "Complete Integrated Syllabus • 12 Games • 300 Tasks";
    },

    renderTask: () => {
        const game = gameData[app.state.currentGameId];
        const task = game.tasks[app.state.currentTaskIndex];
        
        // Update Progress
        document.getElementById('task-progress').innerText = `Task ${app.state.currentTaskIndex + 1}/${game.tasks.length}`;
        document.getElementById('task-instruction').innerText = "Instruction: Select the correct answer."; // Generic instruction or specific

        // Hide Feedback
        document.getElementById('feedback-overlay').style.display = 'none';

        const contentDiv = document.getElementById('task-content');
        contentDiv.innerHTML = `<div class="question-box">${task.q}</div>`;

        if (task.type === 'mcq') {
            const grid = document.createElement('div');
            grid.className = 'options-grid';
            
            // Randomize options for display only
            const shuffledOpts = [...task.opts]; 
            // Note: In generator I already sliced randomly for some, but here we shuffle the display order
            // Fisher-Yates shuffle
            for (let i = shuffledOpts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOpts[i], shuffledOpts[j]] = [shuffledOpts[j], shuffledOpts[i]];
            }

            shuffledOpts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => app.checkAnswer(opt, task.ans, task.exp, btn);
                grid.appendChild(btn);
            });
            contentDiv.appendChild(grid);
        }
    },

    checkAnswer: (selected, correct, explanation, btnElement) => {
        // Prevent multiple clicks
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        const isCorrect = (selected === correct);
        
        // Visual Update
        if (isCorrect) {
            btnElement.classList.add('correct');
            app.state.score.correct++;
            app.showFeedback(true, explanation);
        } else {
            btnElement.classList.add('wrong');
            // Highlight correct one
            allBtns.forEach(b => {
                if (b.innerText === correct) b.classList.add('correct');
            });
            app.state.score.wrong++;
            app.showFeedback(false, explanation);
        }
        
        app.state.score.total++;
        app.updateScoreUI();
    },

    showFeedback: (isCorrect, explanation) => {
        setTimeout(() => {
            const overlay = document.getElementById('feedback-overlay');
            const emoji = document.getElementById('fb-emoji');
            const text = document.getElementById('fb-text');
            const detail = document.getElementById('fb-detail');

            overlay.style.display = 'flex';
            if (isCorrect) {
                emoji.innerText = "⭐";
                text.innerText = "बहुत बढ़िया!";
                text.style.color = "var(--success)";
            } else {
                emoji.innerText = "💪";
                text.innerText = "फिर से प्रयास करें";
                text.style.color = "var(--error)";
            }
            detail.innerText = explanation || "";
        }, 500); // Slight delay to see the button color change
    },

    nextTask: () => {
        const game = gameData[app.state.currentGameId];
        if (app.state.currentTaskIndex < game.tasks.length - 1) {
            app.state.currentTaskIndex++;
            app.renderTask();
        } else {
            // Game Over for this set
            app.showMenu();
            alert(`Game Completed! You scored ${app.state.score.correct} correct answers so far.`);
        }
    },

    updateScoreUI: () => {
        document.getElementById('score-correct').innerText = app.state.score.correct;
        document.getElementById('score-wrong').innerText = app.state.score.wrong;
        document.getElementById('score-total').innerText = app.state.score.total;
    }
};

// Initialize App on Load
window.onload = app.init;

</script>
</body>
</html>
