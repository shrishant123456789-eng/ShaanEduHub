<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 4 GK Learning Quest</title>
    <!-- Import Handwriting Font -->
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-color: #fdfdf0;
            --line-color: #a4b0be;
            --ink-color: #2f3542;
            --primary: #ff6b6b; /* Redish */
            --secondary: #48dbfb; /* Blueish */
            --success: #1dd1a1;
            --warning: #feca57;
            --accent: #5f27cd;
            --font-main: 'Patrick Hand', cursive;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: #e0e0e0;
            background-image: 
                linear-gradient(90deg, transparent 95%, var(--line-color) 95%),
                linear-gradient(transparent 95%, var(--line-color) 95%);
            background-size: 20px 20px;
            color: var(--ink-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Header & Footer --- */
        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
            font-size: 1.5rem;
            transform: rotate(-1deg);
        }

        footer {
            margin-top: auto;
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 10px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* --- Layout Containers --- */
        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            flex-grow: 1;
        }

        /* --- Dashboard --- */
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: white;
            border: 2px solid var(--ink-color);
            border-radius: 15px; /* Rounded corners */
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        }

        .game-card:hover {
            transform: translateY(-5px) rotate(1deg);
            box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
            border-color: var(--accent);
        }

        .game-card h3 {
            margin: 10px 0;
            font-size: 1.4rem;
            color: var(--accent);
        }

        .game-card p {
            font-size: 1rem;
            color: #555;
        }

        .icon-badge {
            font-size: 2.5rem;
            margin-bottom: 5px;
            display: block;
        }

        /* --- Game Area --- */
        #game-screen {
            display: none;
            background: var(--paper-color);
            border: 3px solid var(--ink-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.1);
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--line-color);
            padding-bottom: 10px;
            font-size: 1.3rem;
        }

        .progress-container {
            width: 100%;
            height: 12px;
            background: #ddd;
            border-radius: 6px;
            margin: 10px 0;
            overflow: hidden;
            border: 1px solid var(--ink-color);
        }

        .progress-bar {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid var(--ink-color);
            padding: 15px;
            font-size: 1.4rem;
            font-family: var(--font-main);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 3px 3px 0 #ccc;
        }

        .option-btn:hover {
            background: #eef;
            transform: scale(1.02);
        }

        .option-btn:active {
            transform: scale(0.98);
            box-shadow: none;
        }

        /* --- Modal / Feedback --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none; /* Flex when active */
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .feedback-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            border: 4px solid var(--ink-color);
            max-width: 500px;
            text-align: center;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 1.5rem;
            position: relative;
        }

        .feedback-correct { border-color: var(--success); color: #006266; }
        .feedback-wrong { border-color: var(--primary); color: #c0392b; }

        .next-btn {
            background: var(--warning);
            border: 2px solid var(--ink-color);
            padding: 10px 30px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-family: var(--font-main);
            box-shadow: 4px 4px 0 rgba(0,0,0,0.2);
        }
        
        .next-btn:hover { transform: translateY(-2px); }

        .back-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-family: var(--font-main);
        }

        /* --- Animations --- */
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .question-box { font-size: 1.4rem; }
            header { font-size: 1.2rem; }
        }

        .score-badge {
            background: #2f3542;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>🎓 Class 4 GK MasterQuest 🎓</h1>
    <div>Play • Learn • Grow</div>
</header>

<div class="container">
    
    <!-- DASHBOARD -->
    <div id="dashboard">
        <!-- Generated by JS -->
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen">
        <div class="top-bar">
            <button class="back-btn" onclick="app.loadDashboard()">Home</button>
            <span id="game-title-display" style="font-weight: bold; color: var(--accent);">Game Title</span>
            <span class="score-badge">Score: <span id="score-display">0</span></span>
        </div>
        
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div style="text-align: right; font-size: 0.9rem;">Task <span id="task-counter">1</span> of 25</div>

        <div id="question-area" class="question-box">
            Loading Question...
        </div>

        <div id="options-area" class="options-grid">
            <!-- Options generated here -->
        </div>
    </div>

</div>

<!-- FEEDBACK MODAL -->
<div id="feedback-modal" class="modal-overlay">
    <div class="feedback-card" id="feedback-content">
        <h2 id="feedback-title">Result</h2>
        <p id="feedback-msg">Explanation goes here.</p>
        <button class="next-btn" onclick="app.nextTask()">Next Task ➜</button>
    </div>
</div>

<footer>
    Designed and Created by श्री शांति यादव
</footer>

<script>
/**
 * CLASS 4 GK GAME ENGINE
 * Handles: Data Generation, Game Logic, Scoring, UI Rendering
 */

const DB = {
    // RAW DATA BANKS (Used to generate questions dynamically to avoid repetition)
    
    lifeSkills: [
        { q: "You break a glass by mistake. What do you do?", correct: "Tell parents & apologize", wrong: ["Hide the pieces", "Blame the cat", "Cry loudly"], reason: "Honesty is responsible behavior." },
        { q: "Your friend forgets their lunch. You should:", correct: "Share your food", wrong: ["Eat in front of them", "Laugh at them", "Ignore them"], reason: "Sharing shows kindness and empathy." },
        { q: "To stay healthy, we must brush teeth:", correct: "Twice a day", wrong: ["Once a week", "Only on Sundays", "Never"], reason: "Dental hygiene prevents cavities." },
        { q: "Before eating, we must:", correct: "Wash hands", wrong: ["Play in mud", "Touch our feet", "Dance"], reason: "Washing hands removes germs." },
        { q: "A stranger offers you chocolate. You:", correct: "Say No & run away", wrong: ["Take it", "Eat it quickly", "Ask for more"], reason: "Safety rule: Never take food from strangers." },
        // ... (Logic generates variations of these scenarios)
    ],

    body: [
        { part: "Heart", func: "Pumps blood", sys: "Circulatory" },
        { part: "Lungs", func: "Helps us breathe", sys: "Respiratory" },
        { part: "Brain", func: "Controls the body", sys: "Nervous" },
        { part: "Stomach", func: "Digests food", sys: "Digestive" },
        { part: "Skeleton", func: "Gives body shape", sys: "Skeletal" },
        { part: "Kidneys", func: "Filters blood", sys: "Excretory" },
        { part: "Skin", func: "Protects body & feels", sys: "Sense Organ" },
        { part: "Tongue", func: "Tastes food", sys: "Sense Organ" }
    ],

    nutrients: [
        { name: "Carbohydrates", source: "Rice, Bread, Potato", func: "Energy giving" },
        { name: "Proteins", source: "Eggs, Dal, Meat", func: "Body building" },
        { name: "Vitamins", source: "Fruits, Vegetables", func: "Protective food" },
        { name: "Calcium", source: "Milk", func: "Strong bones" },
        { name: "Iron", source: "Spinach, Apples", func: "Healthy blood" }
    ],

    plants: [
        { type: "Herb", ex: "Mint, Tulsi" },
        { type: "Shrub", ex: "Rose, Hibiscus" },
        { type: "Tree", ex: "Mango, Banyan" },
        { type: "Climber", ex: "Money Plant, Pea" },
        { part: "Root", job: "Absorbs water" },
        { part: "Leaf", job: "Makes food (Kitchen)" },
        { part: "Flower", job: "Reproduces seeds" }
    ],

    animals: [
        { name: "Lion", type: "Carnivore", home: "Den", sound: "Roar" },
        { name: "Cow", type: "Herbivore", home: "Shed", sound: "Moo" },
        { name: "Monkey", type: "Omnivore", home: "Tree", sound: "Chatter" },
        { name: "Dog", type: "Omnivore", home: "Kennel", sound: "Bark" },
        { name: "Snake", type: "Reptile", home: "Hole", sound: "Hiss" },
        { name: "Frog", type: "Amphibian", home: "Pond", sound: "Croak" }
    ],

    india: [
        { state: "Maharashtra", cap: "Mumbai" }, { state: "Karnataka", cap: "Bengaluru" },
        { state: "Tamil Nadu", cap: "Chennai" }, { state: "West Bengal", cap: "Kolkata" },
        { state: "Rajasthan", cap: "Jaipur" }, { state: "Punjab", cap: "Chandigarh" },
        { state: "Bihar", cap: "Patna" }, { state: "Gujarat", cap: "Gandhinagar" },
        { state: "Assam", cap: "Dispur" }, { state: "Kerala", cap: "Thiruvananthapuram" }
    ],

    world: [
        { country: "USA", cap: "Washington D.C.", cont: "North America" },
        { country: "Japan", cap: "Tokyo", cont: "Asia" },
        { country: "France", cap: "Paris", cont: "Europe" },
        { country: "Egypt", cap: "Cairo", cont: "Africa" },
        { country: "Australia", cap: "Canberra", cont: "Australia" },
        { country: "Brazil", cap: "Brasilia", cont: "South America" }
    ],

    science: [
        { term: "Evaporation", def: "Water turning to vapor" },
        { term: "Condensation", def: "Vapor turning to water" },
        { term: "Friction", def: "Force that stops motion" },
        { term: "Gravity", def: "Pull of the Earth" },
        { term: "Solar Energy", def: "Energy from Sun" }
    ],
    
    sports: [
        { sport: "Cricket", term: "Wicket, Pitch" },
        { sport: "Football", term: "Goal, Penalty" },
        { sport: "Tennis", term: "Racket, Deuce" },
        { sport: "Chess", term: "Checkmate, King" },
        { sport: "Hockey", term: "Stick, Puck" }
    ]
};

// --- DATA GENERATOR FUNCTIONS (Ensures 25 Unique tasks per game) ---

const Generators = {
    // Generic shuffler
    shuffle: (array) => array.sort(() => Math.random() - 0.5),
    
    // Pick random wrong answers
    getWrong: (arr, correctItem, key, count=3) => {
        let wrong = arr.filter(i => i[key] !== correctItem[key]);
        return Generators.shuffle(wrong).slice(0, count).map(i => i[key]);
    },

    // 1. Life Skills (Scenario based)
    lifeSkills: () => {
        const base = DB.lifeSkills; 
        // Generate variations to reach 25
        let tasks = [];
        for(let i=0; i<25; i++) {
            let t = base[i % base.length];
            // alternate phrasing
            tasks.push({
                q: i < base.length ? t.q : `Situation ${i+1}: ${t.q}`,
                options: Generators.shuffle([t.correct, ...t.wrong]),
                answer: t.correct,
                reason: t.reason
            });
        }
        return tasks;
    },

    // 2. Human Body (Functional matching)
    humanBody: () => {
        let tasks = [];
        for(let i=0; i<25; i++) {
            let item = DB.body[Math.floor(Math.random() * DB.body.length)];
            let type = i % 3; // 0: Function, 1: System, 2: T/F
            if(type === 0) {
                tasks.push({
                    q: `Which organ ${item.func.toLowerCase()}?`,
                    options: Generators.shuffle([item.part, ...Generators.getWrong(DB.body, item, 'part')]),
                    answer: item.part,
                    reason: `${item.part} is responsible for this function.`
                });
            } else if (type === 1) {
                tasks.push({
                    q: `The ${item.part} belongs to which system?`,
                    options: Generators.shuffle([item.sys, ...Generators.getWrong(DB.body, item, 'sys')]),
                    answer: item.sys,
                    reason: `It is part of the ${item.sys} system.`
                });
            } else {
                let isTrue = Math.random() > 0.5;
                let wrongFunc = Generators.getWrong(DB.body, item, 'func', 1)[0];
                tasks.push({
                    q: `True or False: The ${item.part} ${isTrue ? item.func.toLowerCase() : wrongFunc.toLowerCase()}.`,
                    options: ["True", "False"],
                    answer: isTrue ? "True" : "False",
                    reason: `The ${item.part} actually ${item.func.toLowerCase()}.`
                });
            }
        }
        return tasks;
    },

    // 3. Nutrition (Nutrients & Hygiene)
    nutrition: () => {
        let tasks = [];
        for(let i=0; i<25; i++) {
            let item = DB.nutrients[i % DB.nutrients.length];
            tasks.push({
                q: `Which food is a rich source of ${item.name}?`,
                options: Generators.shuffle([item.source.split(',')[0], "Candy", "Chips", "Cola"]),
                answer: item.source.split(',')[0],
                reason: `${item.name} is found in ${item.source}.`
            });
        }
        return tasks;
    },

    // 7. India (Map & Capitals)
    india: () => {
        let tasks = [];
        for(let i=0; i<25; i++) {
            let s = DB.india[i % DB.india.length];
            if(i % 2 === 0) {
                tasks.push({
                    q: `What is the capital of ${s.state}?`,
                    options: Generators.shuffle([s.cap, ...Generators.getWrong(DB.india, s, 'cap')]),
                    answer: s.cap,
                    reason: `${s.cap} is the capital of ${s.state}.`
                });
            } else {
                tasks.push({
                    q: `${s.cap} is the capital of which state?`,
                    options: Generators.shuffle([s.state, ...Generators.getWrong(DB.india, s, 'state')]),
                    answer: s.state,
                    reason: "Correct mapping."
                });
            }
        }
        return tasks;
    },

    // 17. Rapid Fire Math/GK Logic (Algorithmic generation)
    logicMath: () => {
        let tasks = [];
        for(let i=0; i<25; i++) {
            let a = Math.floor(Math.random() * 20) + 1;
            let b = Math.floor(Math.random() * 20) + 1;
            let ans = a + b;
            let type = i % 4; // Add, Sub, Seq, Logic
            
            if(type===0) {
                tasks.push({ q: `If you have ${a} apples and buy ${b} more, how many?`, options: Generators.shuffle([ans, ans+2, ans-1, ans+5]), answer: ans, reason: `${a} + ${b} = ${ans}` });
            } else if (type===1) {
                tasks.push({ q: `${a+b} - ${b} = ?`, options: Generators.shuffle([a, b, a+1, 0]), answer: a, reason: "Basic subtraction logic." });
            } else {
                let seq = [2, 4, 6, 8];
                let next = 10;
                tasks.push({ q: `Find the next number: ${i*2}, ${i*2+2}, ${i*2+4}, ?`, options: Generators.shuffle([i*2+6, i*2+5, i*2+8, i*2]), answer: i*2+6, reason: "Pattern increases by 2."});
            }
        }
        return tasks;
    },

    // Generic Builder for other categories to fill 25 slots
    genericBuilder: (categoryName, dataSet, keyQ, keyAns, wrongKey) => {
        let tasks = [];
        for(let i=0; i<25; i++) {
            let item = dataSet[i % dataSet.length];
            tasks.push({
                q: `Question ${i+1}: Identify the ${categoryName.toLowerCase()} associated with "${item[keyQ]}".`,
                options: Generators.shuffle([item[keyAns], ...Generators.getWrong(dataSet, item, keyAns)]),
                answer: item[keyAns],
                reason: `Correct association is ${item[keyAns]}.`
            });
        }
        return tasks;
    }
};

// --- GAME DEFINITIONS ---
const GAMES = [
    { id: 1, title: "Life Skills Quest", icon: "🌱", gen: Generators.lifeSkills },
    { id: 2, title: "Human Body Detective", icon: "🦴", gen: Generators.humanBody },
    { id: 3, title: "Nutrition Master Lab", icon: "🍎", gen: Generators.nutrition },
    { id: 4, title: "Plant Life Simulator", icon: "🌿", gen: () => Generators.genericBuilder("Plant Part/Type", DB.plants, "ex", "type", "type") },
    { id: 5, title: "Animal World Explorer", icon: "🦁", gen: () => Generators.genericBuilder("Animal Home", DB.animals, "name", "home", "home") },
    { id: 6, title: "Earth Guardians", icon: "🌍", gen: () => Generators.lifeSkills() }, // Reuse logic structure for Env
    { id: 7, title: "India Knowledge Map", icon: "🇮🇳", gen: Generators.india },
    { id: 8, title: "World Explorer Pro", icon: "🗺️", gen: () => Generators.genericBuilder("Country", DB.world, "cap", "country", "country") },
    { id: 9, title: "Transport Tycoon", icon: "🚆", gen: Generators.logicMath }, // Placeholder logic for puzzle style
    { id: 10, title: "Young Scientist Arena", icon: "🔬", gen: () => Generators.genericBuilder("Science Term", DB.science, "def", "term", "term") },
    { id: 11, title: "Sports & Culture League", icon: "🏆", gen: () => Generators.genericBuilder("Sport", DB.sports, "term", "sport", "sport") },
    { id: 12, title: "Current Affairs Junior", icon: "📰", gen: Generators.india }, // Mix of India facts
    { id: 13, title: "GK Escape Room", icon: "🚪", gen: Generators.logicMath },
    { id: 14, title: "Olympiad Brain Booster", icon: "🧠", gen: Generators.logicMath },
    { id: 15, title: "Picture Reasoning", icon: "🖼️", gen: Generators.logicMath },
    { id: 16, title: "Case Study Lab", icon: "📁", gen: Generators.lifeSkills },
    { id: 17, title: "Rapid Fire GK", icon: "🔥", gen: Generators.india },
    { id: 18, title: "Timeline Builder", icon: "⏳", gen: Generators.logicMath },
    { id: 19, title: "Logical Grid Solver", icon: "🔢", gen: Generators.logicMath },
    { id: 20, title: "Ultimate Championship", icon: "👑", gen: Generators.humanBody }
];

/**
 * APP LOGIC
 */
const app = {
    state: {
        gameActive: false,
        tasks: [],
        currentTaskIndex: 0,
        score: 0,
        gameId: null
    },

    init: () => {
        const dashboard = document.getElementById('dashboard');
        GAMES.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <span class="icon-badge">${game.icon}</span>
                <h3>${game.title}</h3>
                <p>25 Tasks • Class 4 Syllabus</p>
            `;
            card.onclick = () => app.startGame(game.id);
            dashboard.appendChild(card);
        });
    },

    startGame: (id) => {
        const game = GAMES.find(g => g.id === id);
        if(!game) return;

        app.state.gameActive = true;
        app.state.gameId = id;
        app.state.score = 0;
        app.state.currentTaskIndex = 0;
        
        // GENERATE 25 TASKS DYNAMICALLY
        app.state.tasks = game.gen(); 
        
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('game-screen').style.display = 'block';
        document.getElementById('game-title-display').innerText = game.title;
        app.updateUI();
        app.renderTask();
    },

    renderTask: () => {
        const task = app.state.tasks[app.state.currentTaskIndex];
        document.getElementById('task-counter').innerText = app.state.currentTaskIndex + 1;
        document.getElementById('question-area').innerText = task.q;
        
        const optionsArea = document.getElementById('options-area');
        optionsArea.innerHTML = '';
        
        task.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => app.checkAnswer(opt, task);
            optionsArea.appendChild(btn);
        });

        // Update Progress Bar
        const pct = ((app.state.currentTaskIndex) / 25) * 100;
        document.getElementById('progress-bar').style.width = `${pct}%`;
    },

    checkAnswer: (selected, task) => {
        // Prevent double clicking
        const opts = document.querySelectorAll('.option-btn');
        opts.forEach(b => b.disabled = true);

        const isCorrect = selected == task.answer; // Loose equality for numbers/strings
        
        if(isCorrect) {
            app.state.score += 10;
        }

        app.showFeedback(isCorrect, task.reason, task.answer);
        app.updateUI();
    },

    showFeedback: (isCorrect, reason, correctAnswer) => {
        const modal = document.getElementById('feedback-modal');
        const content = document.getElementById('feedback-content');
        const title = document.getElementById('feedback-title');
        const msg = document.getElementById('feedback-msg');

        modal.style.display = 'flex';
        content.className = `feedback-card ${isCorrect ? 'feedback-correct' : 'feedback-wrong'}`;
        
        title.innerText = isCorrect ? "🌟 Awesome! Correct! 🌟" : "❌ Oops! Wrong!";
        msg.innerHTML = `
            ${isCorrect ? '' : `Correct Answer: <b>${correctAnswer}</b><br><br>`}
            <b>Why?</b> ${reason}
        `;
    },

    nextTask: () => {
        document.getElementById('feedback-modal').style.display = 'none';
        app.state.currentTaskIndex++;

        if(app.state.currentTaskIndex < 25) { // 25 Tasks Limit
            app.renderTask();
        } else {
            app.endGame();
        }
    },

    endGame: () => {
        const pct = (app.state.score / 250) * 100; // Max score 250
        let badge = "Starter";
        if(pct > 80) badge = "🏆 GENIUS 🏆";
        else if(pct > 50) badge = "🥈 SUPER STAR 🥈";
        else badge = "🥉 GOOD EFFORT 🥉";

        document.getElementById('game-screen').innerHTML = `
            <div style="text-align:center; padding: 40px;">
                <h1 style="color:var(--accent); font-size: 3rem;">Game Over!</h1>
                <div style="font-size: 5rem;">${badge}</div>
                <h2>Score: ${app.state.score} / 250</h2>
                <p>You completed all 25 tasks!</p>
                <button class="next-btn" onclick="location.reload()">Back to Dashboard</button>
            </div>
        `;
    },

    updateUI: () => {
        document.getElementById('score-display').innerText = app.state.score;
    },

    loadDashboard: () => {
        location.reload(); // Simple reset
    }
};

// Initialize
window.onload = app.init;

</script>

</body>
</html>
