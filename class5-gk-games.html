<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5 GK Interactive Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: #ffffff;
            color: #333;
            padding: 20px;
            max-width: 100%;
            overflow-x: hidden;
        }
        
        .header {
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .score-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 150px;
        }
        
        .score-panel div {
            margin: 3px 0;
        }
        
        .game-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .game-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        .game-btn:hover {
            transform: scale(1.05);
        }
        
        .game-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .game-container {
            display: none;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .game-container.active {
            display: block;
        }
        
        .game-title {
            text-align: center;
            font-size: 22px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .task-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .task-question {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            line-height: 1.5;
        }
        
        .option-btn {
            display: block;
            width: 100%;
            background: #e3f2fd;
            border: 2px solid #2196f3;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }
        
        .option-btn:hover {
            background: #bbdefb;
            transform: translateX(5px);
        }
        
        .option-btn.correct {
            background: #c8e6c9;
            border-color: #4caf50;
        }
        
        .option-btn.wrong {
            background: #ffcdd2;
            border-color: #f44336;
        }
        
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        
        .feedback.show {
            display: block;
        }
        
        .feedback.correct {
            background: #c8e6c9;
            color: #2e7d32;
        }
        
        .feedback.wrong {
            background: #ffcdd2;
            color: #c62828;
        }
        
        .nav-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .nav-btn {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .nav-btn:hover {
            transform: scale(1.05);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .input-answer {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #2196f3;
            border-radius: 8px;
            margin: 10px 0;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            opacity: 0.9;
        }
        
        .drag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 15px 0;
        }
        
        .drag-item {
            background: #fff3e0;
            border: 2px solid #ff9800;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: move;
            font-size: 13px;
            user-select: none;
        }
        
        .drop-zone {
            min-height: 50px;
            background: #f5f5f5;
            border: 2px dashed #9e9e9e;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        
        .drop-zone.filled {
            background: #e8f5e9;
            border-color: #4caf50;
        }
        
        .match-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }
        
        .match-item {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #2196f3;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        
        .match-item.selected {
            background: #ffd54f;
            border-color: #ffa000;
        }
        
        .match-item.matched {
            background: #c8e6c9;
            border-color: #4caf50;
            pointer-events: none;
        }
        
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 10px;
            font-size: 12px;
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 25px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #11998e 0%, #38ef7d 100%);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .hint-btn {
            background: #fff9c4;
            border: 2px solid #fbc02d;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            margin: 10px 0;
        }
        
        .hint-text {
            background: #fff9c4;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            display: none;
            font-size: 13px;
        }
        
        .hint-text.show {
            display: block;
        }
        
        .tf-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
        }
        
        .tf-btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tf-btn.true {
            background: #e8f5e9;
            border-color: #4caf50;
            color: #2e7d32;
        }
        
        .tf-btn.false {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }
        
        .tf-btn:hover {
            transform: scale(1.05);
        }
        
        .image-task {
            text-align: center;
            margin: 15px 0;
        }
        
        .image-task img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 360px) {
            .score-panel {
                font-size: 9px;
                padding: 8px;
                max-width: 120px;
            }
            
            .game-title {
                font-size: 18px;
            }
            
            .task-question {
                font-size: 14px;
            }
            
            .option-btn {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>

        let globalScore = {
            correct: 0,
            wrong: 0,
            notAttempted: 500,
            totalAttempted: 0,
            marks: 0
        };

        let currentGame = 0;
        let currentTask = 0;
        let taskAttempted = {};
        let draggedElement = null;
        let selectedMatches = [];

        function updateScorePanel() {
            document.getElementById('correctCount').textContent = globalScore.correct;
            document.getElementById('wrongCount').textContent = globalScore.wrong;
            document.getElementById('notAttemptedCount').textContent = globalScore.notAttempted;
            document.getElementById('totalAttempted').textContent = globalScore.totalAttempted;
            const percentage = globalScore.totalAttempted > 0 ? 
                Math.round((globalScore.correct / globalScore.totalAttempted) * 100) : 0;
            document.getElementById('percentage').textContent = percentage;
            document.getElementById('marks').textContent = globalScore.marks;
        }

        function recordAnswer(isCorrect) {
            const taskId = `${currentGame}-${currentTask}`;
            if (taskAttempted[taskId]) return;
            
            taskAttempted[taskId] = true;
            globalScore.totalAttempted++;
            globalScore.notAttempted--;
            
            if (isCorrect) {
                globalScore.correct++;
                globalScore.marks += 10;
            } else {
                globalScore.wrong++;
                globalScore.marks -= 2;
            }
            
            updateScorePanel();
        }

        function showFeedback(isCorrect, explanation) {
            const feedback = document.querySelector(`#game${currentGame} .task-container.active .feedback`);
            feedback.className = 'feedback show ' + (isCorrect ? 'correct' : 'wrong');
            feedback.textContent = (isCorrect ? '✅ Great Job! ' : '❌ Try Again! ') + explanation;
        }

        function renderMCQ(task, container) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'task-question';
            questionDiv.textContent = task.question;
            container.appendChild(questionDiv);

            task.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.onclick = () => {
                    if (btn.classList.contains('correct') || btn.classList.contains('wrong')) return;
                    
                    const isCorrect = index === task.correct;
                    btn.classList.add(isCorrect ? 'correct' : 'wrong');
                    recordAnswer(isCorrect);
                    showFeedback(isCorrect, task.explanation);
                    
                    Array.from(container.querySelectorAll('.option-btn')).forEach(b => b.style.pointerEvents = 'none');
                };
                container.appendChild(btn);
            });
        }

        function renderInput(task, container) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'task-question';
            questionDiv.textContent = task.question;
            container.appendChild(questionDiv);

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'input-answer';
            input.placeholder = 'Type your answer here...';
            container.appendChild(input);

            const submitBtn = document.createElement('button');
            submitBtn.className = 'submit-btn';
            submitBtn.textContent = 'Submit Answer';
            submitBtn.onclick = () => {
                const userAnswer = input.value.trim().toLowerCase();
                const isCorrect = task.answer.some(ans => userAnswer.includes(ans));
                
                input.style.borderColor = isCorrect ? '#4caf50' : '#f44336';
                input.disabled = true;
                submitBtn.disabled = true;
                
                recordAnswer(isCorrect);
                showFeedback(isCorrect, task.explanation);
            };
            container.appendChild(submitBtn);
        }

        function renderTrueFalse(task, container) {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'task-question';
            questionDiv.textContent = task.question;
            container.appendChild(questionDiv);

            const tfContainer = document.createElement('div');
            tfContainer.className = 'tf-container';

            const trueBtn = document.createElement('button');
            trueBtn.className = 'tf-btn true';
            trueBtn.textContent = 'TRUE ✓';
            trueBtn.onclick = () => handleTFClick(true, task, tfContainer);

            const falseBtn = document.createElement('button');
            falseBtn.className = 'tf-btn false';
            falseBtn.textContent = 'FALSE ✗';
            falseBtn.onclick = () => handleTFClick(false, task, tfContainer);

            tfContainer.appendChild(trueBtn);
            tfContainer.appendChild(falseBtn);
            container.appendChild(tfContainer);
        }

        function handleTFClick(userChoice, task, tfContainer) {
            const isCorrect = userChoice === task.answer;
            Array.from(tfContainer.children).forEach(btn => btn.disabled = true);
            recordAnswer(isCorrect);
            showFeedback(isCorrect, task.explanation);
        }

        function renderTask(gameIndex, taskIndex) {
            const game = gameData[gameIndex];
            const task = game.tasks[taskIndex];
            const gameContainer = document.getElementById(`game${gameIndex}`);
            
            const existingTasks = gameContainer.querySelectorAll('.task-container');
            existingTasks.forEach(t => t.classList.remove('active'));

            let taskContainer = gameContainer.querySelector(`.task-${taskIndex}`);
            if (!taskContainer) {
                taskContainer = document.createElement('div');
                taskContainer.className = `task-container task-${taskIndex}`;
                
                if (task.type === 'mcq') {
                    renderMCQ(task, taskContainer);
                } else if (task.type === 'input') {
                    renderInput(task, taskContainer);
                } else if (task.type === 'tf') {
                    renderTrueFalse(task, taskContainer);
                }

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                taskContainer.appendChild(feedback);

                gameContainer.appendChild(taskContainer);
            }
            
            taskContainer.classList.add('active');
        }

        function createNavigationButtons(gameIndex) {
            const gameContainer = document.getElementById(`game${gameIndex}`);
            const navDiv = document.createElement('div');
            navDiv.className = 'nav-btns';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'nav-btn';
            prevBtn.textContent = '← Previous';
            prevBtn.onclick = () => {
                if (currentTask > 0) {
                    currentTask--;
                    renderTask(gameIndex, currentTask);
                    updateNavButtons(gameIndex);
                }
            };

            const nextBtn = document.createElement('button');
            nextBtn.className = 'nav-btn';
            nextBtn.textContent = 'Next →';
            nextBtn.onclick = () => {
                if (currentTask < gameData[gameIndex].tasks.length - 1) {
                    currentTask++;
                    renderTask(gameIndex, currentTask);
                    updateNavButtons(gameIndex);
                }
            };

            navDiv.appendChild(prevBtn);
            navDiv.appendChild(nextBtn);
            gameContainer.appendChild(navDiv);
        }

        function updateNavButtons(gameIndex) {
            const gameContainer = document.getElementById(`game${gameIndex}`);
            const prevBtn = gameContainer.querySelector('.nav-btns button:first-child');
            const nextBtn = gameContainer.querySelector('.nav-btns button:last-child');

            prevBtn.disabled = currentTask === 0;
            nextBtn.disabled = currentTask === gameData[gameIndex].tasks.length - 1;
        }

        function initGames() {
            const menuContainer = document.getElementById('gameMenu');
            const gamesContainer = document.getElementById('gamesContainer');

            gameData.forEach((game, index) => {
                const menuBtn = document.createElement('button');
                menuBtn.className = 'game-btn';
                menuBtn.textContent = game.name;
                menuBtn.onclick = () => {
                    document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
                    menuBtn.classList.add('active');
                    
                    document.querySelectorAll('.game-container').forEach(g => g.classList.remove('active'));
                    document.getElementById(`game${index}`).classList.add('active');
                    
                    currentGame = index;
                    currentTask = 0;
                    renderTask(index, 0);
                    updateNavButtons(index);
                };
                menuContainer.appendChild(menuBtn);

                const gameDiv = document.createElement('div');
                gameDiv.id = `game${index}`;
                gameDiv.className = 'game-container';
                
                const title = document.createElement('div');
                title.className = 'game-title';
                title.textContent = game.name;
                gameDiv.appendChild(title);

                const chapterBadge = document.createElement('div');
                chapterBadge.style.textAlign = 'center';
                chapterBadge.style.fontSize = '13px';
                chapterBadge.style.color = '#666';
                chapterBadge.style.marginBottom = '15px';
                chapterBadge.textContent = `📚 Chapter: ${game.chapter}`;
                gameDiv.appendChild(chapterBadge);

                const progressBar = document.createElement('div');
                progressBar.className = 'progress-bar';
                const progressFill = document.createElement('div');
                progressFill.className = 'progress-fill';
                progressFill.style.width = '0%';
                progressFill.textContent = `0/${game.tasks.length}`;
                progressBar.appendChild(progressFill);
                gameDiv.appendChild(progressBar);

                createNavigationButtons(index);
                gamesContainer.appendChild(gameDiv);
            });

            document.querySelector('.game-btn').click();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initGames();
            updateScorePanel();
        });
    </script>
