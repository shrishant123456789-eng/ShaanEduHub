<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5 EVS: Advanced Science Explorer</title>
    <style>
        :root {
            --primary: #FF9F1C;   /* Orange */
            --secondary: #2EC4B6; /* Teal */
            --accent: #E71D36;    /* Red/Pink */
            --light: #FDFFFC;     /* White */
            --dark: #011627;      /* Dark Blue */
            --correct: #4CAF50;
            --wrong: #FF5252;
            --font-main: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
            color: var(--dark);
            padding-bottom: 60px; /* Footer space */
        }

        /* --- STICKY SCOREBOARD --- */
        #scoreboard {
            position: sticky;
            top: 0;
            background: var(--dark);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 0.9rem;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .score-val {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        /* --- MAIN CONTAINER --- */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        h1, h2 {
            text-align: center;
            color: var(--secondary);
            margin: 10px 0;
        }

        /* --- MENU GRID --- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .game-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 0 var(--secondary);
            border: 2px solid var(--secondary);
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 140px;
        }

        .game-card:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .game-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 0.9rem;
            font-weight: bold;
            line-height: 1.2;
        }

        /* --- GAME PLAY AREA --- */
        #game-area {
            display: none;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .question-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        /* MCQ Styles */
        .options-grid {
            display: grid;
            gap: 10px;
        }

        .option-btn {
            background: #f0f0f0;
            border: 2px solid #ddd;
            padding: 12px;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background: #e8e8e8;
        }

        .option-btn.correct {
            background: var(--correct);
            color: white;
            border-color: var(--correct);
        }

        .option-btn.wrong {
            background: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }

        /* Sort/Match Styles */
        .sort-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .sort-item {
            background: var(--primary);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .sort-item.selected {
            border-color: var(--dark);
            transform: scale(1.1);
        }

        .sort-buckets {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            margin-top: 20px;
        }

        .bucket {
            border: 2px dashed var(--secondary);
            border-radius: 10px;
            padding: 10px;
            min-height: 100px;
            width: 45%;
            text-align: center;
        }

        /* Feedback & Controls */
        #feedback-area {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            min-height: 30px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #000;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .btn-home { background: var(--secondary); box-shadow: 0 3px 0 #208b81; }
        .btn-next { background: var(--primary); box-shadow: 0 3px 0 #c97b10; }

        /* --- FOOTER --- */
        footer {
            background: var(--dark);
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 0.8rem;
            z-index: 1000;
        }
    </style>
</head>

        // --- STATE VARIABLES ---
        let currentGameIndex = null;
        let currentQuestionIndex = 0;
        let totalScore = 0;
        let totalTasks = 0;
        let totalCorrect = 0;

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', () => {
            renderMenu();
            updateScoreboard();
        });

        // --- MENU LOGIC ---
        function renderMenu() {
            const grid = document.getElementById('game-grid');
            grid.innerHTML = '';
            
            allGames.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => loadGame(index);
                card.innerHTML = `
                    <div class="game-icon">${game.icon}</div>
                    <div class="game-title">${game.title}</div>
                `;
                grid.appendChild(card);
            });
        }

        // --- GAME ENGINE ---
        function loadGame(index) {
            currentGameIndex = index;
            currentQuestionIndex = 0;
            
            // UI Switch
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('game-title-display').innerText = allGames[index].title;
            
            renderQuestion();
        }

        function goHome() {
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
        }

        function renderQuestion() {
            const game = allGames[currentGameIndex];
            const qData = game.questions[currentQuestionIndex];
            const container = document.getElementById('question-container');
            const nextBtn = document.getElementById('next-btn');
            const feedback = document.getElementById('feedback-area');
            
            // Reset UI
            container.innerHTML = '';
            feedback.innerHTML = '';
            nextBtn.style.display = 'none';
            document.getElementById('question-progress').innerText = `${currentQuestionIndex + 1}/${game.questions.length}`;

            // Render Title
            const qTitle = document.createElement('div');
            qTitle.className = 'question-text';
            qTitle.innerText = qData.q;
            container.appendChild(qTitle);

            // Render Options (MCQ / TF)
            if (qData.t === 'mcq' || qData.t === 'tf') {
                const optsDiv = document.createElement('div');
                optsDiv.className = 'options-grid';
                
                let options = qData.t === 'mcq' ? qData.opts : ["True", "False"];
                
                options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(idx, btn, qData);
                    optsDiv.appendChild(btn);
                });
                container.appendChild(optsDiv);
            }
        }

        function checkAnswer(selectedIndex, btnElement, qData) {
            // Prevent multiple clicks
            const parent = btnElement.parentElement;
            if (parent.classList.contains('answered')) return;
            parent.classList.add('answered');

            let isCorrect = false;

            if (qData.t === 'mcq') {
                isCorrect = (selectedIndex === qData.a);
            } else if (qData.t === 'tf') {
                // For TF: Index 0 is True, 1 is False
                // Data.a is bool
                const userBool = (selectedIndex === 0);
                isCorrect = (userBool === qData.a);
            }

            // UI Feedback
            if (isCorrect) {
                btnElement.classList.add('correct');
                document.getElementById('feedback-area').innerHTML = '<span style="color:var(--correct)">Excellent! ⭐</span>';
                totalScore += 10;
                totalCorrect++;
            } else {
                btnElement.classList.add('wrong');
                document.getElementById('feedback-area').innerHTML = '<span style="color:var(--wrong)">Try Again! ❌</span>';
                
                // Highlight correct answer
                const correctIdx = (qData.t === 'mcq') ? qData.a : (qData.a ? 0 : 1);
                parent.children[correctIdx].classList.add('correct');
            }

            totalTasks++;
            updateScoreboard();
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            const game = allGames[currentGameIndex];
            if (currentQuestionIndex < game.questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                // End of Game
                document.getElementById('question-container').innerHTML = `
                    <div style="text-align:center; padding:20px;">
                        <h2>Module Complete! 🎉</h2>
                        <p>You have finished ${game.title}.</p>
                        <button class="btn btn-home" onclick="goHome()">Back to Menu</button>
                    </div>
                `;
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('feedback-area').innerHTML = '';
            }
        }

        function updateScoreboard() {
            document.getElementById('score-total').innerText = totalTasks;
            document.getElementById('score-points').innerText = totalScore;
            
            const percent = totalTasks === 0 ? 0 : Math.round((totalCorrect / totalTasks) * 100);
            document.getElementById('score-percent').innerText = percent + "%";
        }

    </script>
</body>
</html>
