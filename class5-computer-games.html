<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 5 Computer - Advanced Level</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bradley Hand', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-top: 80px;
        }

        .score-panel {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            min-width: 180px;
            font-size: 13px;
        }

        .score-panel h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 16px;
            text-align: center;
        }

        .score-item {
            display: flex;
            justify-content: space-between;
            margin: 4px 0;
            padding: 3px 0;
        }

        .score-item span:first-child {
            color: #555;
        }

        .score-item span:last-child {
            font-weight: bold;
            color: #667eea;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-selector {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .game-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .game-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .game-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .game-container {
            display: none;
        }

        .game-container.active {
            display: block;
        }

        .task {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 3px solid #667eea;
        }

        .task h3 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .question {
            font-size: 18px;
            margin-bottom: 20px;
            color: #333;
            line-height: 1.6;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .input-answer {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 16px;
            font-family: inherit;
        }

        .submit-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }

        .submit-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            display: none;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #4caf50;
            display: block;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f44336;
            display: block;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .nav-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .drag-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .drag-items, .drop-zones {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .drag-item {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            cursor: move;
            text-align: center;
            font-weight: bold;
            transition: all 0.3s;
        }

        .drag-item:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .drop-zone {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 10px;
            border: 2px dashed #999;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .drop-zone.over {
            background: #e3f2fd;
            border-color: #667eea;
        }

        .drop-zone.filled {
            background: #fff;
            border: 2px solid #667eea;
        }

        .match-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .match-column {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .match-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #667eea;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .match-item.selected {
            background: #667eea;
            color: white;
        }

        .match-item.matched {
            background: #4caf50;
            color: white;
            cursor: default;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            color: #555;
            font-size: 14px;
        }

        .hint-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .hint-btn:hover {
            background: #f57c00;
        }

        .hint-text {
            background: #fff3cd;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            border: 2px solid #ff9800;
            display: none;
        }

        .hint-text.show {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .drag-container, .match-container {
                grid-template-columns: 1fr;
            }

            .score-panel {
                font-size: 11px;
                min-width: 150px;
                padding: 10px;
            }

            h1 {
                font-size: 24px;
            }

            .game-selector {
                grid-template-columns: 1fr;
            }
        }

        .true-false-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }

        .tf-btn {
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tf-btn.true {
            background: white;
            color: #4caf50;
            border-color: #4caf50;
        }

        .tf-btn.false {
            background: white;
            color: #f44336;
            border-color: #f44336;
        }

        .tf-btn:hover {
            transform: scale(1.1);
        }

        .tf-btn.selected.true {
            background: #4caf50;
            color: white;
        }

        .tf-btn.selected.false {
            background: #f44336;
            color: white;
        }

        .image-container {
            text-align: center;
            margin: 20px 0;
        }

        .image-container img {
            max-width: 100%;
            border-radius: 15px;
            border: 3px solid #667eea;
        }

        .summary-section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
            border: 3px solid #667eea;
            display: none;
        }

        .summary-section.show {
            display: block;
        }

        .summary-section h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .summary-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .toggle-summary {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s;
        }

        .toggle-summary:hover {
            background: #764ba2;
        }
    </style>
</head>

        let currentGame = 'game1';
        let currentTaskIndex = 0;
        let scores = {
            correct: 0,
            wrong: 0,
            skipped: 0,
            attempted: 0,
            total: 0
        };

        let taskAnswered = false;

        function initGame() {
            scores.total = Object.values(games).reduce((sum, game) => sum + game.length, 0);
            updateScorePanel();
            renderTask();
        }

        function updateScorePanel() {
            document.getElementById('correct-count').textContent = scores.correct;
            document.getElementById('wrong-count').textContent = scores.wrong;
            document.getElementById('skipped-count').textContent = scores.skipped;
            document.getElementById('attempted-count').textContent = scores.attempted;
            const percentage = scores.total > 0 ? Math.round((scores.correct / scores.total) * 100) : 0;
            document.getElementById('percentage').textContent = percentage + '%';
            document.getElementById('marks').textContent = scores.correct + '/' + scores.total;
        }

        function renderTask() {
            const task = games[currentGame][currentTaskIndex];
            const container = document.getElementById(currentGame);
            taskAnswered = false;

            let html = `
                <div class="task">
                    <h3>Question ${currentTaskIndex + 1} of ${games[currentGame].length}</h3>
                    <div class="question">${task.question}</div>
            `;

            if (task.type === 'mcq') {
                html += '<div class="options">';
                task.options.forEach((option, index) => {
                    html += `<div class="option" data-index="${index}">${option}</div>`;
                });
                html += '</div>';
            } else if (task.type === 'truefalse') {
                html += `
                    <div class="true-false-container">
                        <button class="tf-btn true" data-answer="true">✓ True</button>
                        <button class="tf-btn false" data-answer="false">✗ False</button>
                    </div>
                `;
            } else if (task.type === 'fill') {
                html += `
                    <input type="text" class="input-answer" placeholder="Type your answer...">
                    <button class="submit-btn">Submit Answer</button>
                `;
            } else if (task.type === 'drag') {
                html += `
                    <div class="drag-container">
                        <div class="drag-items" id="drag-items">
                            ${task.items.map(item => `<div class="drag-item" draggable="true">${item}</div>`).join('')}
                        </div>
                        <div class="drop-zones" id="drop-zones">
                            ${task.correctOrder.map((_, index) => `<div class="drop-zone" data-index="${index}">Drop here</div>`).join('')}
                        </div>
                    </div>
                    <button class="submit-btn">Check Order</button>
                `;
            } else if (task.type === 'match') {
                html += `
                    <div class="match-container">
                        <div class="match-column" id="left-column">
                            ${task.pairs.map((pair, index) => `<div class="match-item" data-index="${index}">${pair.left}</div>`).join('')}
                        </div>
                        <div class="match-column" id="right-column">
                            ${task.pairs.map((pair, index) => `<div class="match-item" data-index="${index}">${pair.right}</div>`).join('')}
                        </div>
                    </div>
                    <button class="submit-btn">Check Matches</button>
                `;
            }

            html += `
                    <div class="feedback"></div>
                    <div class="navigation">
                        <button class="nav-btn" id="prev-btn" ${currentTaskIndex === 0 ? 'disabled' : ''}>← Previous</button>
                        <button class="nav-btn" id="next-btn">Next →</button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
            attachEventListeners();
        }

        function attachEventListeners() {
            const task = games[currentGame][currentTaskIndex];

            if (task.type === 'mcq') {
                document.querySelectorAll('.option').forEach(option => {
                    option.addEventListener('click', function() {
                        if (taskAnswered) return;
                        document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                        this.classList.add('selected');
                        checkAnswer(parseInt(this.dataset.index));
                    });
                });
            } else if (task.type === 'truefalse') {
                document.querySelectorAll('.tf-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (taskAnswered) return;
                        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        checkAnswer(this.dataset.answer === 'true');
                    });
                });
            } else if (task.type === 'fill') {
                document.querySelector('.submit-btn').addEventListener('click', function() {
                    if (taskAnswered) return;
                    const answer = document.querySelector('.input-answer').value.trim().toLowerCase();
                    checkAnswer(answer);
                });
            } else if (task.type === 'drag') {
                setupDragDrop();
                document.querySelector('.submit-btn').addEventListener('click', function() {
                    if (taskAnswered) return;
                    checkDragAnswer();
                });
            } else if (task.type === 'match') {
                setupMatching();
                document.querySelector('.submit-btn').addEventListener('click', function() {
                    if (taskAnswered) return;
                    checkMatchAnswer();
                });
            }

            document.getElementById('prev-btn').addEventListener('click', previousTask);
            document.getElementById('next-btn').addEventListener('click', nextTask);
        }

        function checkAnswer(answer) {
            if (taskAnswered) return;
            taskAnswered = true;
            scores.attempted++;

            const task = games[currentGame][currentTaskIndex];
            const feedback = document.querySelector('.feedback');
            let correct = false;

            if (task.type === 'mcq') {
                correct = answer === task.correct;
                document.querySelectorAll('.option').forEach(opt => {
                    const index = parseInt(opt.dataset.index);
                    if (index === task.correct) {
                        opt.classList.add('correct');
                    } else if (index === answer && !correct) {
                        opt.classList.add('wrong');
                    }
                });
            } else if (task.type === 'truefalse') {
                correct = answer === task.correct;
            } else if (task.type === 'fill') {
                correct = task.correct.some(ans => ans === answer);
            }

            if (correct) {
                scores.correct++;
                feedback.className = 'feedback correct';
                feedback.textContent = '✓ Excellent! Very Good ⭐';
            } else {
                scores.wrong++;
                feedback.className = 'feedback wrong';
                feedback.textContent = '✗ Try Again! Keep Learning 📚';
            }

            updateScorePanel();
        }

        function setupDragDrop() {
            const dragItems = document.querySelectorAll('.drag-item');
            const dropZones = document.querySelectorAll('.drop-zone');

            dragItems.forEach(item => {
                item.addEventListener('dragstart', function(e) {
                    e.dataTransfer.setData('text', this.textContent);
                    this.style.opacity = '0.5';
                });

                item.addEventListener('dragend', function() {
                    this.style.opacity = '1';
                });
            });

            dropZones.forEach(zone => {
                zone.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    this.classList.add('over');
                });

                zone.addEventListener('dragleave', function() {
                    this.classList.remove('over');
                });

                zone.addEventListener('drop', function(e) {
                    e.preventDefault();
                    this.classList.remove('over');
                    const data = e.dataTransfer.getData('text');
                    this.textContent = data;
                    this.classList.add('filled');
                });
            });
        }

        function checkDragAnswer() {
            if (taskAnswered) return;
            taskAnswered = true;
            scores.attempted++;

            const task = games[currentGame][currentTaskIndex];
            const dropZones = document.querySelectorAll('.drop-zone');
            let correct = true;

            dropZones.forEach((zone, index) => {
                if (zone.textContent !== task.correctOrder[index]) {
                    correct = false;
                }
            });

            const feedback = document.querySelector('.feedback');
            if (correct) {
                scores.correct++;
                feedback.className = 'feedback correct';
                feedback.textContent = '✓ Excellent! Perfect Order ⭐';
            } else {
                scores.wrong++;
                feedback.className = 'feedback wrong';
                feedback.textContent = '✗ Try Again! Check the Order 📚';
            }

            updateScorePanel();
        }

        function setupMatching() {
            let selectedLeft = null;
            let selectedRight = null;
            const matches = [];

            document.querySelectorAll('#left-column .match-item').forEach(item => {
                item.addEventListener('click', function() {
                    if (this.classList.contains('matched')) return;
                    document.querySelectorAll('#left-column .match-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedLeft = this.dataset.index;
                    checkMatch();
                });
            });

            document.querySelectorAll('#right-column .match-item').forEach(item => {
                item.addEventListener('click', function() {
                    if (this.classList.contains('matched')) return;
                    document.querySelectorAll('#right-column .match-item').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    selectedRight = this.dataset.index;
                    checkMatch();
                });
            });

            function checkMatch() {
                if (selectedLeft !== null && selectedRight !== null) {
                    matches.push({ left: selectedLeft, right: selectedRight });
                    const leftItem = document.querySelector(`#left-column .match-item[data-index="${selectedLeft}"]`);
                    const rightItem = document.querySelector(`#right-column .match-item[data-index="${selectedRight}"]`);
                    leftItem.classList.add('matched');
                    rightItem.classList.add('matched');
                    selectedLeft = null;
                    selectedRight = null;
                }
            }
        }

        function checkMatchAnswer() {
            if (taskAnswered) return;
            taskAnswered = true;
            scores.attempted++;

            const task = games[currentGame][currentTaskIndex];
            const matchedItems = document.querySelectorAll('.match-item.matched');
            const correct = matchedItems.length === task.pairs.length * 2;

            const feedback = document.querySelector('.feedback');
            if (correct) {
                scores.correct++;
                feedback.className = 'feedback correct';
                feedback.textContent = '✓ Excellent! All Matched ⭐';
            } else {
                scores.wrong++;
                feedback.className = 'feedback wrong';
                feedback.textContent = '✗ Try Again! Check Matches 📚';
            }

            updateScorePanel();
        }

        function previousTask() {
            if (currentTaskIndex > 0) {
                if (!taskAnswered) {
                    scores.skipped++;
                    updateScorePanel();
                }
                currentTaskIndex--;
                renderTask();
            }
        }

        function nextTask() {
            if (!taskAnswered) {
                scores.skipped++;
                updateScorePanel();
            }

            if (currentTaskIndex < games[currentGame].length - 1) {
                currentTaskIndex++;
                renderTask();
            } else {
                showGameComplete();
            }
        }

        function showGameComplete() {
            const container = document.getElementById(currentGame);
            container.innerHTML = `
                <div class="task">
                    <h2>🎉 Game Complete!</h2>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${(scores.correct / scores.total) * 100}%">
                            ${Math.round((scores.correct / scores.total) * 100)}%
                        </div>
                    </div>
                    <p style="text-align: center; margin-top: 20px; font-size: 18px;">
                        Great job! You've completed this game.<br>
                        Select another game to continue learning! 🚀
                    </p>
                </div>
            `;
        }

        document.querySelectorAll('.game-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (!taskAnswered && currentTaskIndex < games[currentGame].length) {
                    scores.skipped++;
                    updateScorePanel();
                }

                document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));
                currentGame = this.dataset.game;
                currentTaskIndex = 0;
                document.getElementById(currentGame).classList.add('active');
                renderTask();
            });
        });

        document.addEventListener('DOMContentLoaded', initGame);
