<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class 2 Hindi Mega Practice - ShanEduHub</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Fredoka:wght@400;600&display=swap');

        :root {
            --bg-color: #E0F7FA;
            --card-bg: #FFFFFF;
            --primary: #FF6B6B;  /* Pinkish Red */
            --secondary: #4ECDC4; /* Teal */
            --accent: #FFD93D;    /* Yellow */
            --text: #2D3436;
            --success: #6BCB77;
            --error: #FF6B6B;
            --btn-shadow: 0px 5px 0px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Noto Sans Devanagari', 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--secondary) 10%, transparent 10%);
            background-size: 25px 25px;
            margin: 0;
            padding: 0;
            color: var(--text);
            text-align: center;
            overflow-x: hidden;
            padding-bottom: 70px;
        }

        /* --- HEADER --- */
        header {
            background: linear-gradient(180deg, #FF9F43, #FF6B6B);
            color: white;
            padding: 15px;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { margin: 0; font-size: 1.5rem; text-shadow: 2px 2px 0px rgba(0,0,0,0.1); }
        .subtitle { font-size: 0.9rem; opacity: 0.9; margin-top: 5px; }

        /* --- DASHBOARD (SETS) --- */
        #dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .set-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 3px solid transparent;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .set-card:hover { transform: translateY(-5px); border-color: var(--secondary); }
        .set-card:active { transform: scale(0.95); }
        
        .set-icon { font-size: 2.5rem; margin-bottom: 10px; }
        .set-title { font-weight: bold; font-size: 1rem; color: #444; }
        .set-desc { font-size: 0.75rem; color: #888; margin-top: 5px; }
        .locked-badge { position: absolute; top: 5px; right: 5px; font-size: 1.2rem; display: none; }

        /* --- GAME AREA --- */
        #game-area {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        /* --- HUD (Score) --- */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #F8F9FA;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 2px solid #EEE;
        }
        .score-pill { display: flex; align-items: center; gap: 5px; }
        .progress-bar-container { height: 8px; width: 100%; background: #eee; border-radius: 4px; margin-top: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--success); transition: width 0.3s; }

        /* --- QUESTION STYLES --- */
        .q-box { margin: 20px 0; animation: slideIn 0.4s ease-out; }
        .q-text { font-size: 1.8rem; color: #2D3436; margin-bottom: 15px; line-height: 1.4; }
        .q-img-emoji { font-size: 4rem; display: block; margin-bottom: 15px; animation: bounce 2s infinite; }
        .instruction { background: #FFF3CD; color: #856404; padding: 5px 15px; border-radius: 10px; display: inline-block; font-size: 0.9rem; margin-bottom: 10px; }

        /* --- INTERACTIVE ELEMENTS --- */
        .options-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        
        .btn-opt {
            background: #f1f2f6;
            border: 2px solid #dfe4ea;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
            min-width: 80px;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #ccc;
        }
        .btn-opt:hover { background: var(--secondary); color: white; border-color: var(--secondary); }
        .btn-opt:active { transform: translateY(3px); box-shadow: none; }

        .btn-opt.correct { background: var(--success); color: white; border-color: #2e7d32; }
        .btn-opt.wrong { background: var(--error); color: white; border-color: #c0392b; animation: shake 0.4s; }

        /* Input Fields */
        .input-area { width: 80%; padding: 10px; font-size: 1.2rem; border: 2px solid var(--secondary); border-radius: 10px; text-align: center; margin-bottom: 10px; font-family: 'Noto Sans Devanagari'; }
        
        /* Drag/Arrange Area */
        .word-bank { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
        .drop-zone { min-height: 60px; border: 2px dashed #bbb; border-radius: 10px; background: #fafafa; display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; padding: 10px; font-size: 1.3rem; color: var(--primary); font-weight: bold; }

        /* --- CONTROLS --- */
        .controls { display: flex; justify-content: center; gap: 10px; margin-top: 25px; border-top: 1px solid #eee; padding-top: 15px; }
        .btn-action { padding: 10px 20px; border: none; border-radius: 25px; color: white; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .btn-home { background: #636e72; }
        .btn-speak { background: #0984e3; }
        .btn-check { background: var(--success); }
        .btn-next { background: var(--primary); display: none; }

        /* --- MODAL --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; text-align: center; max-width: 90%; animation: popIn 0.5s; border: 5px solid var(--accent); }
        .big-emoji { font-size: 5rem; display: block; }
        
        /* --- FOOTER --- */
        footer {
            background: #2d3436;
            color: #dfe6e9;
            padding: 10px;
            text-align: center;
            font-size: 0.8rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 90;
        }

        /* Animations */
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes popIn { 0% { transform: scale(0); } 90% { transform: scale(1.1); } 100% { transform: scale(1); } }

    </style>
</head>
<body>

<header>
    <h1>🎓 Class 2 Hindi Mega Practice</h1>
    <div class="subtitle">10 Sets • 500+ Questions • Full Syllabus</div>
</header>

<div id="dashboard">
    </div>

<div id="game-area">
    <div class="hud">
        <div class="score-pill">⭐ <span id="score-val">0</span></div>
        <div class="score-pill">🎯 <span id="q-progress">1/50</span></div>
        <div class="score-pill">📊 <span id="score-pct">0%</span></div>
    </div>
    <div class="progress-bar-container"><div class="progress-bar-fill" id="progress-bar"></div></div>

    <div id="q-container" class="q-box">
        </div>

    <div class="controls">
        <button class="btn-action btn-home" onclick="goHome()">🏠 Home</button>
        <button class="btn-action btn-speak" onclick="readQuestion()">🔊 सुनें</button>
        <button class="btn-action btn-check" id="btn-check" onclick="checkCustomInput()" style="display:none">✅ Check</button>
        <button class="btn-action btn-next" id="btn-next" onclick="nextQuestion()">Next ➡</button>
    </div>
</div>

<div id="modal-feedback" class="modal">
    <div class="modal-content">
        <span class="big-emoji" id="modal-emoji">🌟</span>
        <h2 id="modal-title">शाबाश! (Well Done!)</h2>
        <p id="modal-msg">उत्तर सही है!</p>
        <button class="btn-action btn-next" style="display:inline-flex; margin-top:10px;" onclick="closeModal()">जारी रखें</button>
    </div>
</div>

<footer>
    🔒 Footer Locked <br>
    Designed & Created by SHRISHANT YADAV <br>
    2026 – ShanEduHub
</footer>

<script>
/* ==========================================================================
   DATA BANKS (VOCABULARY & RULES)
   ========================================================================== */
const DATA = {
    vowels: ['अ','आ','इ','ई','उ','ऊ','ऋ','ए','ऐ','ओ','औ','अं','अः'],
    consonants: ['क','ख','ग','घ','च','छ','ज','झ','ट','ठ','ड','ढ','ण','त','थ','द','ध','न','प','फ','ब','भ','म','य','र','ल','व','श','ष','स','ह'],
    words: [
        {w:'कमल', type:'noun', img:'🌸'}, {w:'आम', type:'noun', img:'🥭'}, 
        {w:'किताब', type:'noun', img:'📘'}, {w:'सूरज', type:'noun', img:'🌞'},
        {w:'पानी', type:'noun', img:'💧'}, {w:'घर', type:'noun', img:'🏠'},
        {w:'सेब', type:'noun', img:'🍎'}, {w:'पेड़', type:'noun', img:'🌳'}
    ],
    opposites: [
        {a:'दिन', b:'रात'}, {a:'हंसना', b:'रोना'}, {a:'काला', b:'सफेद'}, 
        {a:'ऊपर', b:'नीचे'}, {a:'नया', b:'पुराना'}, {a:'ठंडा', b:'गर्म'},
        {a:'मित्र', b:'शत्रु'}, {a:'सच', b:'झूठ'}
    ],
    gender: [
        {m:'लड़का', f:'लड़की'}, {m:'राजा', f:'रानी'}, {m:'पिता', f:'माता'},
        {m:'दादा', f:'दादी'}, {m:'भाई', f:'बहन'}, {m:'मोर', f:'मोरनी'},
        {m:'शेर', f:'शेरनी'}, {m:'बैल', f:'गाय'}
    ],
    numbers: [ // Singular Plural
        {s:'लड़का', p:'लड़के'}, {s:'किताब', p:'किताबें'}, {s:'तारा', p:'तारे'},
        {s:'आंख', p:'आंखें'}, {s:'बच्चा', p:'बच्चे'}, {s:'पत्ता', p:'पत्ते'}
    ],
    poems: [
        {lines: ["मछली जल की ____ है", "जीवन उसका पानी है"], ans: "रानी"},
        {lines: ["तितली उड़ी, बस में ____", "सीट न मिली, रोने लगी"], ans: "चढ़ी"},
        {lines: ["आलू कचालू बेटा ____ गए थे", "बैंगन की टोकरी में सो रहे थे"], ans: "कहाँ"}
    ],
    stories: [
        {title: "प्यासा कौआ", text: "एक कौआ ____ था। उसे पानी नहीं मिला।", ans: "प्यासा"},
        {title: "शेर और चूहा", text: "शेर सो रहा था। ____ उसके ऊपर कूदने लगा।", ans: "चूहा"}
    ],
    sentences: [
        {jumbled: ["हूँ", "जाता", "स्कूल", "मैं"], correct: "मैं स्कूल जाता हूँ"},
        {jumbled: ["है", "रहा", "नाच", "मोर"], correct: "मोर नाच रहा है"},
        {jumbled: ["पसंद", "है", "आम", "मुझे"], correct: "मुझे आम पसंद है"}
    ]
};

const SETS_CONFIG = [
    { id: 1, title: "वर्ण और शब्द", sub: "Ch 1-2: Alphabet & Words", color: "#FF6B6B", icon: "🅰️" },
    { id: 2, title: "विलोम और संज्ञा", sub: "Ch 3-4: Grammar Basics", color: "#4ECDC4", icon: "✨" },
    { id: 3, title: "सर्वनाम और क्रिया", sub: "Ch 5-6: Pronoun & Verb", color: "#FFD93D", icon: "🏃" },
    { id: 4, title: "वाक्य और कविता", sub: "Ch 7-8: Sentences & Rhymes", color: "#6C5CE7", icon: "📜" },
    { id: 5, title: "कहानी और पठन", sub: "Ch 9-10: Stories & Reading", color: "#A8E6CF", icon: "📖" },
    { id: 6, title: "लेखन कौशल", sub: "Ch 11: Writing Skills", color: "#FF8E53", icon: "✍️" },
    { id: 7, title: "रचनात्मक कार्य", sub: "Ch 12: Creative Writing", color: "#00b894", icon: "🎨" },
    { id: 8, title: "मौखिक अभ्यास", sub: "Speaking & Listening", color: "#74b9ff", icon: "🎤" },
    { id: 9, title: "शब्द पहेली", sub: "Word Puzzles & Logic", color: "#a29bfe", icon: "🧩" },
    { id: 10, title: "महा-अभ्यास", sub: "Mega Mix (All Chapters)", color: "#e17055", icon: "🏆" }
];

/* ==========================================================================
   STATE MANAGEMENT
   ========================================================================== */
let state = {
    setId: 0,
    qIndex: 0,
    score: 0,
    totalQ: 50,
    currentQ: null, // Holds the current question object
    userAns: null
};

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
window.onload = function() {
    renderDashboard();
};

function renderDashboard() {
    const dash = document.getElementById('dashboard');
    dash.innerHTML = '';
    SETS_CONFIG.forEach(set => {
        const card = document.createElement('div');
        card.className = 'set-card';
        card.style.borderBottomColor = set.color;
        card.innerHTML = `
            <div class="set-icon">${set.icon}</div>
            <div class="set-title">${set.title}</div>
            <div class="set-desc">${set.sub}</div>
        `;
        card.onclick = () => startSet(set.id);
        dash.appendChild(card);
    });
    
    document.querySelector('header').style.display = 'block';
    document.getElementById('dashboard').style.display = 'grid';
    document.getElementById('game-area').style.display = 'none';
}

function goHome() {
    renderDashboard();
}

function startSet(id) {
    state.setId = id;
    state.qIndex = 0;
    state.score = 0;
    state.totalQ = 50; // Requirement: 50 Qs per set
    
    document.getElementById('dashboard').style.display = 'none';
    document.querySelector('header').style.display = 'none';
    document.getElementById('game-area').style.display = 'block';
    
    updateHUD();
    generateQuestion();
}

/* ==========================================================================
   QUESTION GENERATOR ENGINE (The core of 500+ unique questions)
   ========================================================================== */
function generateQuestion() {
    // Determine question type based on Set ID and modulus of Index to ensure variety
    const mode = state.qIndex % 5; 
    let q = {};

    // --- SET 1: ALPHABET & WORDS ---
    if(state.setId === 1) {
        if(mode === 0 || mode === 1) { // Identify Vowel/Consonant
            const isVowel = Math.random() > 0.5;
            const target = isVowel ? rArr(DATA.vowels) : rArr(DATA.consonants);
            q = {
                type: 'mcq',
                text: `पहचानो: ${isVowel ? 'स्वर (Vowel)' : 'व्यंजन (Consonant)'}`,
                display: `<span style="font-size:4rem; color:#444">${target}</span>`,
                correct: target,
                options: shuffle([target, rArr(DATA.vowels), rArr(DATA.consonants), rArr(DATA.consonants)]),
                speak: `यह क्या है? ${target}`
            };
        } else { // Word Identify
            const w = rArr(DATA.words);
            q = {
                type: 'mcq',
                text: "चित्र पहचानकर सही शब्द चुनें:",
                display: `<div class="q-img-emoji">${w.img}</div>`,
                correct: w.w,
                options: shuffle([w.w, rArr(DATA.words).w, rArr(DATA.words).w, "हवा"]),
                speak: "चित्र का नाम बताओ"
            };
        }
    }

    // --- SET 2: GRAMMAR BASICS ---
    else if(state.setId === 2) {
        if(mode < 3) { // Opposites
            const pair = rArr(DATA.opposites);
            q = {
                type: 'mcq',
                text: `<span style="color:#e91e63">${pair.a}</span> का विलोम (Opposite) क्या है?`,
                display: "",
                correct: pair.b,
                options: shuffle([pair.b, "हवा", "पानी", rArr(DATA.opposites).b]),
                speak: `${pair.a} का उल्टा क्या है`
            };
        } else { // Gender
            const pair = rArr(DATA.gender);
            const askMale = Math.random() > 0.5;
            q = {
                type: 'mcq',
                text: askMale ? `${pair.f} का पुल्लिंग (Male)?` : `${pair.m} का स्त्रीलिंग (Female)?`,
                correct: askMale ? pair.m : pair.f,
                options: shuffle([pair.m, pair.f, "बच्चा", "साथी"]),
                speak: "लिंग बदलो"
            };
        }
    }

    // --- SET 4: SENTENCES ---
    else if(state.setId === 4) {
        const sData = rArr(DATA.sentences);
        q = {
            type: 'arrange',
            text: "शब्दों को सही क्रम में लगाओ:",
            parts: shuffle([...sData.jumbled]),
            correct: sData.correct,
            speak: "वाक्य बनाओ"
        };
    }

    // --- SET 5: STORIES ---
    else if(state.setId === 5) {
        const story = rArr(DATA.stories);
        q = {
            type: 'mcq',
            text: "कहानी पूरी करें:",
            display: `<div style="background:#fff3e0; padding:10px; border-radius:10px;">${story.text}</div>`,
            correct: story.ans,
            options: shuffle([story.ans, "हवा", "पानी", "सोना"]),
            speak: "खाली जगह भरो"
        };
    }

    // --- SET 6: WRITING (INPUT) ---
    else if(state.setId === 6) {
        const w = rArr(DATA.words);
        q = {
            type: 'input',
            text: "इस चित्र का नाम लिखिए (Type in Hindi):",
            display: `<div class="q-img-emoji">${w.img}</div>`,
            correct: w.w,
            hint: w.w[0] + "...",
            speak: "चित्र का नाम लिखो"
        };
    }

    // --- SET 8: SPEAKING ---
    else if(state.setId === 8) {
        const lines = ["मेरा नाम ... है", "मुझे आम पसंद है", "मैं कक्षा दो में हूँ", "नमस्ते"];
        const line = lines[state.qIndex % lines.length];
        q = {
            type: 'speaking',
            text: "बोलकर अभ्यास करें (Practice Speaking):",
            display: `<div style="font-size:2rem; color:#2980b9; margin:20px;">"${line}"</div>`,
            correct: "simulated",
            speak: line
        };
    }

    // --- FALLBACK GENERIC GENERATOR ---
    else {
        // Generates random math/logic or uses generic grammar
        const num = rArr(DATA.numbers);
        q = {
            type: 'mcq',
            text: `'${num.s}' का बहुवचन (Plural) क्या है?`,
            correct: num.p,
            options: shuffle([num.p, num.s, num.s + "ओं", "कोई नहीं"]),
            speak: "बहुवचन बताओ"
        };
    }

    state.currentQ = q;
    renderQuestion(q);
}

/* ==========================================================================
   RENDERING ENGINE
   ========================================================================== */
function renderQuestion(q) {
    const container = document.getElementById('q-container');
    container.innerHTML = '';
    
    // Reset Controls
    document.getElementById('btn-next').style.display = 'none';
    document.getElementById('btn-check').style.display = 'none';
    
    // Header Text
    let html = `<div class="instruction">❓ ${q.type === 'mcq' ? 'सही विकल्प चुनें' : (q.type === 'arrange' ? 'क्रम में लगाओ' : 'लिखो/बोलो')}</div>`;
    html += `<div class="q-text">${q.text}</div>`;
    if(q.display) html += q.display;

    // Interaction Body
    if(q.type === 'mcq') {
        html += `<div class="options-grid">`;
        q.options.forEach(opt => {
            html += `<button class="btn-opt" onclick="handleMCQ(this, '${opt}')">${opt}</button>`;
        });
        html += `</div>`;
    } 
    else if (q.type === 'input') {
        html += `<input type="text" id="user-input" class="input-area" placeholder="यहाँ लिखें...">`;
        document.getElementById('btn-check').style.display = 'inline-flex';
    }
    else if (q.type === 'arrange') {
        html += `<div id="drop-zone" class="drop-zone"></div>`;
        html += `<div class="word-bank">`;
        q.parts.forEach(word => {
            html += `<button class="btn-opt" onclick="moveWord(this, '${word}')">${word}</button>`;
        });
        html += `</div>`;
        html += `<button class="btn-action" style="background:#95a5a6; margin-top:10px;" onclick="resetArrange()">Reset ↺</button>`;
        document.getElementById('btn-check').style.display = 'inline-flex';
        state.userAns = []; // reset array
    }
    else if (q.type === 'speaking') {
        html += `<button class="btn-action" style="background:var(--success); margin:auto;" onclick="simulateVoiceSuccess()">🎤 मैंने बोल दिया (I Spoke)</button>`;
    }

    container.innerHTML = html;
    
    // Auto speak
    setTimeout(() => speak(q.speak), 500);
}

/* ==========================================================================
   INTERACTION LOGIC
   ========================================================================== */
function handleMCQ(btn, val) {
    if(document.getElementById('btn-next').style.display === 'inline-flex') return;

    if(val === state.currentQ.correct) {
        btn.classList.add('correct');
        successParams();
    } else {
        btn.classList.add('wrong');
        speak("गलत, फिर से कोशिश करो");
    }
}

function checkCustomInput() {
    // For Input Type
    if(state.currentQ.type === 'input') {
        const val = document.getElementById('user-input').value.trim();
        if(val === state.currentQ.correct) {
            successParams();
        } else {
            speak("सही नहीं है");
            document.getElementById('user-input').style.borderColor = 'red';
        }
    }
    // For Arrange Type
    else if(state.currentQ.type === 'arrange') {
        const sentence = state.userAns.join(' ');
        if(sentence === state.currentQ.correct) {
            successParams();
        } else {
            speak("क्रम सही नहीं है");
            resetArrange();
        }
    }
}

// Arrange Logic
function moveWord(btn, word) {
    state.userAns.push(word);
    btn.style.display = 'none';
    const dz = document.getElementById('drop-zone');
    const span = document.createElement('span');
    span.innerText = word;
    span.style.background = "#FFD93D";
    span.style.padding = "5px 10px";
    span.style.borderRadius = "5px";
    dz.appendChild(span);
}

function resetArrange() {
    state.userAns = [];
    renderQuestion(state.currentQ);
}

function simulateVoiceSuccess() {
    speak("बहुत अच्छे!");
    successParams();
}

function successParams() {
    state.score += 10;
    playSound('success');
    updateHUD();
    
    const emojis = ["🌟", "🎉", "🏆", "🍭", "🎈"];
    document.getElementById('modal-emoji').innerText = rArr(emojis);
    document.getElementById('modal-feedback').style.display = 'flex';
}

function nextQuestion() {
    document.getElementById('modal-feedback').style.display = 'none';
    state.qIndex++;
    
    if(state.qIndex >= state.totalQ) {
        endGame();
    } else {
        generateQuestion();
    }
}

function closeModal() {
    nextQuestion();
}

function endGame() {
    const container = document.getElementById('q-container');
    const pct = Math.round((state.score / (state.totalQ * 10)) * 100);
    
    container.innerHTML = `
        <div style="padding:40px; text-align:center;">
            <div style="font-size:5rem;">🏆</div>
            <h2>अभ्यास पूरा हुआ! (Completed)</h2>
            <p>स्कोर: ${state.score} / ${state.totalQ * 10}</p>
            <p>प्रतिशत: ${pct}%</p>
            <div style="margin-top:20px;">
                ${pct > 80 ? 'Excellent! अद्भुत!' : 'Good Job! और अभ्यास करें!'}
            </div>
        </div>
    `;
    document.querySelector('.controls').innerHTML = `<button class="btn-action btn-home" onclick="goHome()">🏠 Main Menu</button>`;
    document.getElementById('progress-bar').style.width = "100%";
}

/* ==========================================================================
   UTILITIES
   ========================================================================== */
function updateHUD() {
    document.getElementById('score-val').innerText = (state.score/10);
    document.getElementById('q-progress').innerText = `${state.qIndex + 1}/${state.totalQ}`;
    const pct = Math.round(((state.qIndex) / state.totalQ) * 100);
    document.getElementById('score-pct').innerText = `${pct}%`;
    document.getElementById('progress-bar').style.width = `${pct}%`;
}

function speak(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hi-IN';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }
}

function playSound(type) {
    // Placeholder for sound effects (Audio context usually requires user interaction first)
}

function rArr(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(array) {
    // Remove duplicates if picking multiple random options
    let unique = [...new Set(array)];
    // Fill if distinct count is low (rare edge case)
    while(unique.length < 4) unique.push("अन्य");
    
    // Fisher-Yates Shuffle
    for (let i = unique.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [unique[i], unique[j]] = [unique[j], unique[i]];
    }
    return unique.slice(0, 4); // return max 4 options
}

function readQuestion() {
    if(state.currentQ) speak(state.currentQ.speak);
}
